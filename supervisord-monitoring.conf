[program:prometheus]
command=/usr/local/bin/prometheus
    --config.file=/app/monitoring/prometheus/prometheus.yml
    --storage.tsdb.path=/app/data/prometheus
    --storage.tsdb.retention.time=7d
    --storage.tsdb.retention.size=256MB
directory=/app
autostart=true
autorestart=true
startsecs=5
startretries=10
stdout_logfile=/app/data/logs/prometheus.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/app/data/logs/prometheus-error.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3

[program:loki]
command=/usr/local/bin/loki
    -config.file=/app/monitoring/loki/loki-config.yml
directory=/app
autostart=true
autorestart=true
startsecs=5
startretries=10
stdout_logfile=/app/data/logs/loki.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/app/data/logs/loki-error.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3

[program:grafana]
command=/opt/grafana/bin/grafana-server --homepath=/opt/grafana
directory=/opt/grafana
environment=GF_SERVER_HTTP_PORT="3100",GF_SERVER_ROOT_URL="http://localhost/grafana/",GF_SECURITY_ADMIN_USER="admin",GF_SECURITY_ADMIN_PASSWORD="admin",GF_USERS_ALLOW_SIGN_UP="false",GF_AUTH_ANONYMOUS_ENABLED="true",GF_AUTH_ANONYMOUS_ORG_ROLE="Viewer",GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH="/app/monitoring/grafana/dashboards/fiestaboard-system.json",GF_PATHS_DATA="/app/data/grafana",GF_PATHS_PROVISIONING="/app/monitoring/grafana/provisioning",GF_PATHS_LOGS="/app/data/logs"
autostart=true
autorestart=true
startsecs=5
startretries=10
stdout_logfile=/app/data/logs/grafana.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/app/data/logs/grafana-error.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3
