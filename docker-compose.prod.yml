services:
  # FiestaBoard - Unified container with API + Web UI
  fiestaboard:
    image: fiestaboard
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fiestaboard
    env_file:
      - .env
    environment:
      - PRODUCTION=true
      # Optional: set FIESTA_API_URL to the browser-facing API URL so the UI
      # can discover it via /api/runtime-config (e.g. http://your-server:6969)
      - FIESTA_API_URL=${FIESTA_API_URL:-}
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      # Persist data (including config) to local filesystem
      - ./data:/app/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
