[supervisord]
nodaemon=true
logfile=/app/data/logs/supervisord.log
logfile_maxbytes=5MB
logfile_backups=1
pidfile=/app/supervisord.pid

[program:api]
command=python -m uvicorn src.api_server:app --host 127.0.0.1 --port 8000 --reload
directory=/app
priority=10
autostart=true
autorestart=true
startsecs=5
startretries=10
stdout_logfile=/app/data/logs/api.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/app/data/logs/api-error.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3

# Dev UI: React Router v7 dev server on 127.0.0.1:3001 (nginx proxies
# `/` traffic here for HMR). The CLI auto-launches Vite under the hood
# with `base: "./"` so dev and prod resolve assets the same way.
[program:rr7]
command=npx react-router dev --host 127.0.0.1 --port 3001
directory=/app/web
environment=WATCHPACK_POLLING="true",CHOKIDAR_USEPOLLING="true"
priority=30
autostart=true
autorestart=true
startsecs=3
startretries=10
stdout_logfile=/app/data/logs/web.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/app/data/logs/web-error.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3

[program:nginx]
command=nginx -g "daemon off;"
priority=20
autostart=true
autorestart=true
startsecs=2
startretries=10
stdout_logfile=/app/data/logs/nginx.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/app/data/logs/nginx-error.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3

[include]
files = /app/conf.d/*.conf
