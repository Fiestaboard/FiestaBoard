services:
  # FiestaBoard - Unified container with API + Web UI
  fiestaboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fiestaboard
    env_file:
      - .env
    environment:
      - PRODUCTION=true
    restart: unless-stopped
    # --- Networking ---
    # Option A (default): Bridge networking with port mapping
    ports:
      - "4420:3000"
    # Option B: Host networking – required for mDNS / Bonjour support
    #           (allows access via http://fiestaboard.local:4420).
    #           Uncomment the line below and remove/comment the 'ports' block.
    # network_mode: host
    volumes:
      # Persist data (including config) to local filesystem
      - ./data:/app/data
      # Persist marketplace-installed (external) plugins across rebuilds
      - ./external_plugins:/app/external_plugins
      # Docker socket for container management (restart/upgrade from UI)
      # Note: Required for self-update and restart features. Grants container
      # access to the host Docker daemon. Remove this line if you do not need
      # in-app restart/upgrade functionality.
      - /var/run/docker.sock:/var/run/docker.sock
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ---------------------------------------------------------------------------
  # FiestaUpdater - sidecar that performs in-place updates of `fiestaboard`.
  # Off by default. Enable by setting COMPOSE_PROFILES=fiestaupdater in `.env`.
  # The sidecar is NOT exposed to the host - it is reachable only from the
  # compose-internal network and is authenticated with a shared bearer token.
  # ---------------------------------------------------------------------------
  fiestaupdater:
    build:
      context: ./fiestaupdater
      dockerfile: Dockerfile
    container_name: fiestaupdater
    profiles: ["fiestaupdater"]
    restart: unless-stopped
    environment:
      - FIESTAUPDATER_TOKEN=${FIESTAUPDATER_TOKEN}
      - FIESTAUPDATER_SERVICE=fiestaboard
      - FIESTAUPDATER_COMPOSE_FILE=/compose/docker-compose.yml
      - COMPOSE_PROJECT_NAME=fiestaboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./docker-compose.yml:/compose/docker-compose.yml:ro
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8765/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
