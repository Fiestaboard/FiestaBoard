services:
  # FiestaBoard - Unified container with API + Web UI
  fiestaboard:
    build:
      context: .
      dockerfile: Dockerfile
      # Explicit production target. The Dockerfile defines a `runtime-dev`
      # stage AFTER `runtime` that adds Node + flips CMD to supervisord-dev
      # for the Vite dev server; without `target`, Docker builds the last
      # stage and prod accidentally runs the dev supervisord (and tries to
      # spawn `rr7` forever). Pin the prod target so it always lands here.
      target: runtime
    container_name: fiestaboard
    env_file:
      - .env
    environment:
      - PRODUCTION=true
    restart: unless-stopped
    # --- Networking ---
    # Option A (default): Bridge networking with port mapping
    ports:
      - "4420:3000"
    # Option B: Host networking – required for mDNS / Bonjour support
    #           (allows access via http://fiestaboard.local:4420).
    #           Uncomment the line below and remove/comment the 'ports' block.
    # network_mode: host
    volumes:
      # Persist data (including config) to local filesystem.
      #
      # IMPORTANT: this is a RELATIVE bind mount. Docker resolves `./data`
      # against the directory you run `docker compose` from, not against the
      # location of this file. Always run `docker compose pull`, `up`, `down`,
      # etc. from the same folder you originally started FiestaBoard in -
      # otherwise your settings will look like they have reset (your data is
      # not deleted, it just lives in the original folder).
      # See: https://fiestaboard.app/docs/troubleshooting#settings-or-board-credentials-are-gone-after-an-update
      - ./data:/app/data
      # Persist marketplace-installed (external) plugins across rebuilds
      - ./external_plugins:/app/external_plugins
      # Docker socket for container management (restart/upgrade from UI)
      # Note: Required for self-update and restart features. Grants container
      # access to the host Docker daemon. Remove this line if you do not need
      # in-app restart/upgrade functionality.
      - /var/run/docker.sock:/var/run/docker.sock
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ---------------------------------------------------------------------------
  # FiestaUpdater - sidecar that performs in-place updates of `fiestaboard`.
  # Off by default. Enable by setting COMPOSE_PROFILES=fiestaupdater in `.env`.
  # The sidecar is NOT exposed to the host - it is reachable only from the
  # compose-internal network and is authenticated with a shared bearer token.
  # ---------------------------------------------------------------------------
  fiestaupdater:
    build:
      context: ./fiestaupdater
      dockerfile: Dockerfile
    container_name: fiestaupdater
    profiles: ["fiestaupdater"]
    restart: unless-stopped
    environment:
      - FIESTAUPDATER_TOKEN=${FIESTAUPDATER_TOKEN}
      - FIESTAUPDATER_SERVICE=fiestaboard
      - FIESTAUPDATER_COMPOSE_FILE=/compose/docker-compose.yml
      - COMPOSE_PROJECT_NAME=fiestaboard
    cap_add:
      - SYS_BOOT
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./docker-compose.yml:/compose/docker-compose.yml:ro
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8765/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ---------------------------------------------------------------------------
  # Mock Vestaboard - off by default; opt-in for local end-to-end testing
  # without a real board. Enable with:
  #   docker compose -f docker-compose.yml --profile mock-board up -d
  # ---------------------------------------------------------------------------
  # Then in the FiestaBoard UI, set the board host to `fiestaboard-mock-board`
  # (the container name resolves over the compose-internal network) and the
  # local API key to `mock-dev-key`. Real production deployments should not
  # set this profile.
  fiestaboard-mock-board:
    image: python:3.11-alpine
    container_name: fiestaboard-mock-board
    profiles: ["mock-board"]
    restart: unless-stopped
    volumes:
      - ./integration-tests/mock-board/server.py:/server.py:ro
    # Host ports avoid macOS AirPlay / Control Center (often binds :7000).
    # Inside the container the mock still listens on 7000/7001.
    ports:
      - "17000:7000"
      - "17001:7001"
    environment:
      - PORTS=7000,7001
    command: python /server.py
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
