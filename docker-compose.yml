services:
  # FiestaBoard - Unified container with API + Web UI
  fiestaboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fiestaboard
    env_file:
      - .env
    environment:
      - PRODUCTION=true
    restart: unless-stopped
    ports:
      - "4420:3000"
    volumes:
      # Persist data (including config) to local filesystem
      - ./data:/app/data
      # Docker socket for container management (restart/upgrade from UI)
      - /var/run/docker.sock:/var/run/docker.sock
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
