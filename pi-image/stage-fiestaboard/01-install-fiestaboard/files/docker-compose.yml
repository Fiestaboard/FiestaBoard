services:
  fiestaboard:
    image: fiestaboard/fiestaboard:latest
    container_name: fiestaboard
    env_file:
      - .env
    environment:
      - PRODUCTION=true
      - FIESTABOARD_PROFILE=pi
    restart: unless-stopped
    pull_policy: always
    ports:
      - "4420:3000"
    # Allow the WiFi-management endpoints (Settings → Network) to drive
    # the host NetworkManager. NET_ADMIN + the bind-mounted D-Bus socket
    # are the minimum needed for `nmcli` inside the container to talk to
    # NM on the host. Polkit on the host authorises the call based on the
    # container appuser's UID (1000), which matches the default `fiesta`
    # user in the netdev group.
    cap_add:
      - NET_ADMIN
    volumes:
      - /opt/fiestaboard/data:/app/data
      - /opt/fiestaboard/external_plugins:/app/external_plugins
      - /var/run/dbus:/var/run/dbus
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  fiestaupdater:
    image: fiestaboard/fiestaupdater:latest
    container_name: fiestaupdater
    profiles: ["fiestaupdater"]
    restart: unless-stopped
    pull_policy: always
    environment:
      - FIESTAUPDATER_TOKEN=${FIESTAUPDATER_TOKEN}
      - FIESTAUPDATER_SERVICE=fiestaboard
      - FIESTAUPDATER_COMPOSE_FILE=/compose/docker-compose.yml
      - COMPOSE_PROJECT_NAME=fiestaboard
    cap_add:
      - SYS_BOOT
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/fiestaboard/docker-compose.yml:/compose/docker-compose.yml:ro
      # The compose file references `env_file: .env` for the fiestaboard
      # service.  When the sidecar runs `docker compose -f /compose/...`,
      # Compose resolves `.env` relative to the compose file's directory.
      # Without this mount, every pull/up/restart fails with
      # "env file /compose/.env not found" and the in-app updater silently
      # no-ops.
      - /opt/fiestaboard/.env:/compose/.env:ro
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8765/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
