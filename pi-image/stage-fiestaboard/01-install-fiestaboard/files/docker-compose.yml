services:
  fiestaboard:
    image: fiestaboard/fiestaboard:latest
    container_name: fiestaboard
    env_file:
      - .env
    environment:
      - PRODUCTION=true
      - FIESTABOARD_PROFILE=pi
    restart: unless-stopped
    pull_policy: always
    ports:
      - "4420:3000"
    volumes:
      - /opt/fiestaboard/data:/app/data
      - /opt/fiestaboard/external_plugins:/app/external_plugins
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  fiestaupdater:
    image: fiestaboard/fiestaupdater:latest
    container_name: fiestaupdater
    profiles: ["fiestaupdater"]
    restart: unless-stopped
    pull_policy: always
    environment:
      - FIESTAUPDATER_TOKEN=${FIESTAUPDATER_TOKEN}
      - FIESTAUPDATER_SERVICE=fiestaboard
      - FIESTAUPDATER_COMPOSE_FILE=/compose/docker-compose.yml
      - COMPOSE_PROJECT_NAME=fiestaboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/fiestaboard/docker-compose.yml:/compose/docker-compose.yml:ro
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8765/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
