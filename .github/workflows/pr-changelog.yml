name: 'Claude: PR Changelog'

# When a PR is merged to main, ask Claude to write a single user-facing
# changelog one-liner and post it as a PR comment with the marker
# `<!-- claude-changelog -->`. The Release workflow later harvests these
# comments instead of relying on raw PR titles, so the release notes read
# like a human wrote them.
#
# Also supports manual workflow_dispatch with a `pr_number` input — useful
# for retroactively summarizing a PR that merged before this workflow
# existed, or for re-running a failed summary.
#
# `pull_request_target`, not `pull_request`, so that merged FORK PRs get a
# changelog line too. A `pull_request` run whose head is a fork receives no
# repo secrets and a read-only GITHUB_TOKEN, so this job would fail twice
# over on an outside contribution — empty `CLAUDE_CODE_OAUTH_TOKEN`, then a
# 403 on `gh pr comment` — and the release notes would silently lose the
# entry. `pull_request_target` is safe here: it evaluates this file from the
# base ref, the checkout below takes the base ref (never PR head code), and
# `--allowed-tools` is three read-only `gh` verbs plus the comment post.
# The actor is whoever merged the PR — a maintainer — so the action's actor
# permission gate passes.

on:
  pull_request_target:
    types: [closed]
    branches:
      - main
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to summarize'
        required: true
        type: string

jobs:
  summarize:
    name: Summarize merged PR
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request_target' && github.event.pull_request.merged == true)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # No `ref:` — on `pull_request_target` this resolves to the base
          # branch, which is what we want. Never check out PR head code in
          # a job that holds secrets (CodeQL `actions/untrusted-checkout`).
          fetch-depth: 1
          persist-credentials: false

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Required now that the trigger is `pull_request_target`: without
          # an explicit token the action tries the OIDC→claude[bot] App
          # exchange, which returns `401 Invalid OIDC token` on
          # pull_request_target subs (same finding as claude-docs-review.yml).
          # Passing a token skips the exchange. The cost is the comment
          # badge — `github-actions[bot]` instead of `claude[bot]` — which
          # nothing depends on: release.yml harvests these by the
          # `<!-- claude-changelog -->` marker, never by author.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: '--model claude-sonnet-4-6 --allowed-tools "Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*)"'
          prompt: |
            You are writing one line of a FiestaBoard changelog. FiestaBoard is
            an open-source platform for controlling split-flap displays.

            PR #${{ github.event.pull_request.number || inputs.pr_number }} just merged to main.

            1. Run `gh pr view ${{ github.event.pull_request.number || inputs.pr_number }} --json title,body,labels,files` to read the PR.
            2. Run `gh pr diff ${{ github.event.pull_request.number || inputs.pr_number }}` to see the actual change (you may pipe to `head -300` if it is huge).
            3. Decide if this change is user-facing. Internal-only changes
               include: version bumps, CI tweaks, dependency bumps with no
               behavior change, internal refactors, doc-only typo fixes, test
               additions. User-facing changes include: new plugins, new
               features, bug fixes a user would notice, UI changes, new config
               options, plugin behavior changes, setup/install improvements.
            4. Write a SINGLE markdown bullet, max ~20 words, that a non-technical
               FiestaBoard user would understand. Lead with what changed for the
               user, not the implementation. Skip the PR number — that gets
               appended automatically by GitHub later. Use one of these emoji
               prefixes based on PR labels and content:
                 - 🎉 new feature
                 - 🔌 new plugin or plugin update (name the plugin)
                 - 🎨 frontend / UI
                 - ⚙️  backend / API
                 - 🐛 bug fix
                 - 📖 docs (only if substantial)
                 - 📦 dependency (only if user-visible)
            5. Post the result as a PR comment using exactly this format
               (the HTML comment markers are required — the release workflow
               greps for them):

                   <!-- claude-changelog -->
                   - <emoji> your one-line summary here

               If the change is internal-only and should be excluded from
               release notes, post this instead:

                   <!-- claude-changelog -->
                   SKIP: <one short reason>

               Post the comment with:
                   gh pr comment ${{ github.event.pull_request.number || inputs.pr_number }} --body "..."

            Do not post anything else. Do not edit files. Do not push.
