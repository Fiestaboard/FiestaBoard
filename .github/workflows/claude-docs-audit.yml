name: 'Claude: Docs Audit'

# =============================================================================
# Twice-daily America/Los_Angeles sweep of repo docs by Claude Sonnet.
# Opens ready-for-review PRs for trivial mechanical fixes and files
# issues for anything that needs a thinking pass — those issues fan out
# to per-issue triage workers (claude-issue-triage.yml) and become
# ready-for-review docs PRs. Both PR sources trigger the docs auto-review
# workflow (claude-docs-review.yml) for a Claude sanity check before
# merge.
#
# Cadence: noon + 4pm PT. Each cron pair fires twice in UTC to absorb DST
# drift; the local-hour gate below admits exactly the intended window.
# workflow_dispatch always proceeds.
#
# Effort scales with the open `docs-audit` issue queue (see "Compute
# dynamic effort" step). Drained queue → thorough mode (batch 32, cap 100).
# Hot queue → conservative mode (batch 12, cap 32). The audit self-throttles
# without manual tuning.
#
# Parallel shards: workflow_dispatch accepts a `parallel_jobs` input. The
# `prep` job computes a matrix of N shards, and the `docs-audit` matrix job
# fans out into N parallel audits. Each shard takes a disjoint slice of
# `files_remaining` (`SHARD_INDEX × batch` offset, next `batch` files), so
# parallel shards within one dispatch don't audit overlapping files. The
# state file commit is idempotent across shards (each writes the same
# end-state — the full N × batch slice moved to `files_audited`) and the
# push uses rebase+retry to survive races. Scheduled (cron) runs default
# to 1 shard, so the existing cadence is unchanged.
#
# Progress tracked in .github/docs-audit-state.json; sweep restarts from
# the top once every file has been audited.
# =============================================================================

on:
  schedule:
    # Two pairs of UTC crons, one per intended PT window. Within each pair
    # only one matches the local-hour gate depending on DST; the other is
    # blocked by the gate or the short cooldown. workflow_dispatch bypasses
    # both gates.
    - cron: '7 19 * * *'   # 12:07 PDT (summer) / 11:07 PST (gated off)
    - cron: '7 20 * * *'   # 12:07 PST (winter) / 13:07 PDT (gated by cooldown)
    - cron: '7 23 * * *'   # 16:07 PDT (summer) / 15:07 PST (gated off)
    - cron: '7 0 * * *'    # 16:07 PST (winter) / 17:07 PDT (gated by cooldown)
  workflow_dispatch:
    inputs:
      parallel_jobs:
        description: 'Number of parallel audit shards to fan out (1–10). Each shard takes a disjoint slice of the file queue.'
        type: number
        default: 1
      focus:
        description: 'Optional steering hint — what part of the docs to focus on (e.g. "weather plugin", "SETUP guides", "plugin manifests"). Leave blank for the default sweep. Focus runs do not advance sweep state.'
        type: string
        default: ''

permissions:
  contents: read

# Per-dispatch unique concurrency group so multiple dispatches don't cancel
# each other's queued runs (GitHub keeps only the newest pending run per
# group). Scheduled (cron) runs still share `docs-audit-cron` so the cron
# cadence stays serialized — the state file is shared across cron runs but
# each dispatch can race with itself only at the rebase+retry level.
concurrency:
  group: docs-audit-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'cron' }}
  cancel-in-progress: false

jobs:
  prep:
    name: Prepare audit shards
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go: ${{ steps.summary.outputs.go }}
      mode: ${{ steps.effort.outputs.mode }}
      batch: ${{ steps.effort.outputs.batch }}
      cap: ${{ steps.effort.outputs.cap }}
      open_count: ${{ steps.effort.outputs.open_count }}
      shards: ${{ steps.shards.outputs.shards }}
      shard_count: ${{ steps.shards.outputs.shard_count }}
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - name: Gate on America/Los_Angeles local hour window
        id: gate
        # Two windows per day: 12:00–13:30 PT and 16:00–17:30 PT. Each
        # absorbs the typical GitHub Actions cron delay (often 10–30 min)
        # without letting a wrong-DST cron through. workflow_dispatch
        # bypasses the gate.
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          hour=$(TZ=America/Los_Angeles date +%H)
          minute=$(TZ=America/Los_Angeles date +%M)
          echo "Local PT: $hour:$minute"
          in_noon_window=false
          in_4pm_window=false
          if [ "$hour" = "12" ] || { [ "$hour" = "13" ] && [ "$minute" -le 30 ]; }; then
            in_noon_window=true
          fi
          if [ "$hour" = "16" ] || { [ "$hour" = "17" ] && [ "$minute" -le 30 ]; }; then
            in_4pm_window=true
          fi
          if [ "$in_noon_window" = "true" ] || [ "$in_4pm_window" = "true" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "go=false" >> "$GITHUB_OUTPUT"
            echo "Skipping: outside 12:00–13:30 PT and 16:00–17:30 PT windows."
          fi

      - name: Checkout repository
        if: steps.gate.outputs.go == 'true'
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Dedup against recent runs and open drafts
        id: dedup
        if: steps.gate.outputs.go == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
        # 2× daily cadence (noon + 4pm PT). Each window has paired UTC
        # crons; a 3h cooldown blocks the second cron in the same window
        # without blocking the other window. Open-draft check is capped at
        # 5 (was: any draft) so reviewer backlog doesn't permanently
        # silence the audit — but still prevents unbounded stacking.
        # workflow_dispatch bypasses both.
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          last=$(jq -r '.last_run_at // empty' .github/docs-audit-state.json)
          if [ -n "$last" ]; then
            last_epoch=$(date -u -d "$last" +%s 2>/dev/null || echo 0)
            now_epoch=$(date -u +%s)
            if [ "$last_epoch" -gt 0 ]; then
              age_h=$(( (now_epoch - last_epoch) / 3600 ))
              if [ "$age_h" -lt 3 ]; then
                echo "Skipping: last run was ${age_h}h ago (<3h cooldown)."
                echo "go=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
          fi
          draft_count=$(gh pr list --search "head:docs-audit/" --state open --json number --jq 'length')
          if [ "$draft_count" -ge 5 ]; then
            drafts=$(gh pr list --search "head:docs-audit/" --state open --json number --jq '[.[].number | tostring] | join(", #")')
            echo "Skipping: ${draft_count} open docs-audit draft(s) (#${drafts}). Merge/close some, or use workflow_dispatch."
            echo "go=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Open audit drafts: ${draft_count} (cap 5)."
          echo "go=true" >> "$GITHUB_OUTPUT"

      - name: Compute dynamic effort
        id: effort
        if: steps.dedup.outputs.go == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
        # Effort scales inverse to the open docs-audit issue queue. A
        # drained queue means triage is keeping up and the codebase can
        # absorb more findings; a hot queue means we should back off so
        # reviewers don't drown. This makes the audit self-balancing
        # without a tuning knob. Per-shard caps — with parallel_jobs=N the
        # total issue cap for the dispatch is roughly N × cap.
        run: |
          open_count=$(gh issue list --label docs-audit --state open --limit 200 --json number --jq 'length')
          echo "Open docs-audit issues: ${open_count}"
          if [ "$open_count" -gt 80 ]; then
            mode="conservative"; batch=12; cap=32
          elif [ "$open_count" -gt 40 ]; then
            mode="balanced";     batch=24; cap=60
          else
            mode="thorough";     batch=32; cap=100
          fi
          echo "mode=${mode} batch=${batch} cap=${cap}"
          {
            echo "mode=${mode}"
            echo "batch=${batch}"
            echo "cap=${cap}"
            echo "open_count=${open_count}"
          } >> "$GITHUB_OUTPUT"

      - name: Compute shard matrix
        id: shards
        if: steps.dedup.outputs.go == 'true'
        # Build the matrix array [0, 1, ..., N-1] from the parallel_jobs
        # input. Scheduled runs default to 1 shard (existing behavior).
        # Clamped to [1, 10] so a typo can't fan out 100 jobs.
        run: |
          N='${{ github.event.inputs.parallel_jobs }}'
          if [ -z "$N" ] || ! [ "$N" -eq "$N" ] 2>/dev/null; then
            N=1
          fi
          if [ "$N" -lt 1 ]; then N=1; fi
          if [ "$N" -gt 10 ]; then N=10; fi
          shards=$(jq -nc --argjson n "$N" '[range(0; $n)]')
          echo "Shard count: ${N}, matrix: ${shards}"
          {
            echo "shards=${shards}"
            echo "shard_count=${N}"
          } >> "$GITHUB_OUTPUT"

      - name: Summarize gate outcome
        id: summary
        if: always()
        # Collapse gate + dedup into a single `go` for the downstream job.
        run: |
          if [ "${{ steps.gate.outputs.go }}" != "true" ] || [ "${{ steps.dedup.outputs.go }}" != "true" ]; then
            echo "go=false" >> "$GITHUB_OUTPUT"
            echo "Audit will not run this invocation."
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
            echo "Audit will run with ${{ steps.shards.outputs.shard_count }} shard(s)."
          fi

  docs-audit:
    name: Audit docs (shard ${{ matrix.shard }})
    needs: prep
    if: needs.prep.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    strategy:
      # Don't cancel sibling shards if one fails — each shard's slice is
      # independent so a single Claude error shouldn't kill the rest.
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.prep.outputs.shards) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # RELEASE_PAT so the state-file commit can push to main past
          # branch protection — same pattern as the plugin-stats job.
          token: ${{ secrets.RELEASE_PAT }}
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run Claude docs audit
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          # Unique per-shard branch suffix. github.run_id is unique per
          # workflow run, matrix.shard disambiguates parallel shards within
          # the same run, so PR branches from a 5-shard dispatch land at
          # docs-audit/round-N-run-<runid>-shard-0 … shard-4.
          BRANCH_SUFFIX: ${{ github.run_id }}-shard-${{ matrix.shard }}
          # Shard coordinates — the prompt uses these to compute its slice
          # of files_remaining and the idempotent end-state for the state
          # file commit.
          SHARD_INDEX: ${{ matrix.shard }}
          SHARD_COUNT: ${{ needs.prep.outputs.shard_count }}
          # Dynamic effort from the prep job. The prompt reads these via
          # the GHA `${{ ... }}` interpolation below; env vars exist
          # primarily for visibility in the action log.
          AUDIT_MODE: ${{ needs.prep.outputs.mode }}
          AUDIT_BATCH_SIZE: ${{ needs.prep.outputs.batch }}
          AUDIT_ISSUE_CAP: ${{ needs.prep.outputs.cap }}
          AUDIT_QUEUE_OPEN: ${{ needs.prep.outputs.open_count }}
          # Optional maintainer-supplied steering hint. Empty for scheduled
          # (cron) runs; set via workflow_dispatch input. When non-empty the
          # prompt narrows file selection to docs matching this topic and
          # skips the state-file advance (focus runs are exploratory probes,
          # not progress).
          AUDIT_FOCUS: ${{ github.event.inputs.focus }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Surface the SDK transcript in the Actions log. Without this the
          # action prints "full output hidden for security" and silent
          # permission denials look like a clean success.
          show_full_output: 'true'
          # Sonnet — the user picked this tier for the recurring audit.
          # --allowed-tools: the agent-mode default toolset is read-only, so
          # without this allowlist every Edit/Write/`git`/`gh` call is denied
          # and the run completes with 0 PRs + 0 issues + an unchanged state
          # file. Bash patterns must match what the prompt actually invokes.
          claude_args: >-
            --model claude-opus-4-8
            --max-turns 250
            --allowed-tools "Read,Glob,Grep,Edit,Write,Bash(ls:*),Bash(cat:*),Bash(find:*),Bash(date:*),Bash(jq:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git branch:*),Bash(git checkout:*),Bash(git switch:*),Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(git fetch:*),Bash(git pull:*),Bash(git rebase:*),Bash(git rev-parse:*),Bash(git reset:*),Bash(gh pr create:*),Bash(gh pr view:*),Bash(gh pr list:*),Bash(gh issue list:*),Bash(gh issue view:*),Bash(gh issue create:*),Bash(gh issue edit:*),Bash(gh label list:*),Bash(gh label create:*)"
          prompt: |
            You are the FiestaBoard docs auditor. You run unattended twice a
            day (noon and 4pm America/Los_Angeles) and audit a batch of repo
            docs. Your job is mostly to **find** problems — fixing happens
            downstream via the issue-triage workflow, which spawns one focused
            Claude worker per issue you file. Lean into filing issues; each
            one becomes a short, scoped, high-success-rate fix task. Save
            inline PRs for the truly trivial.

            ## Parallel shard coordinates

            You are **shard $SHARD_INDEX of $SHARD_COUNT** parallel shards
            running against the same sweep state. Verify these by echoing
            `$SHARD_INDEX` and `$SHARD_COUNT` before doing anything else.

            All shards in this dispatch share `files_remaining`. To avoid
            overlapping work:

            - When picking your batch, **skip the first
              `$SHARD_INDEX * ${{ needs.prep.outputs.batch }}` entries** of
              `files_remaining`, then take the next
              `${{ needs.prep.outputs.batch }}` entries as your batch.
            - If your slice falls entirely past the end of
              `files_remaining` (queue too small for your shard index), exit
              cleanly with the wrap-up summary. Do **not** open a PR, do
              **not** file issues, do **not** touch state. The next run
              will pick up where this one left off.
            - When updating state at the end, move **all
              `$SHARD_COUNT * ${{ needs.prep.outputs.batch }}` files**
              (the union slice consumed by every parallel shard) from
              `files_remaining` to `files_audited`. This is the same
              end-state every shard computes, so racing pushes are safe.
              If fewer than `$SHARD_COUNT * ${{ needs.prep.outputs.batch }}`
              files remain, move whatever is left.
            - Do **not** regenerate `files_remaining` in this run if it
              becomes empty. Round restart happens on the next run, where
              shard 0 will detect empty remaining and bump the round
              cleanly.

            ## Effort for this run (computed by the workflow)

            - **Mode:**       ${{ needs.prep.outputs.mode }}
            - **Batch size:** ${{ needs.prep.outputs.batch }} files per shard
            - **Issue cap:**  ${{ needs.prep.outputs.cap }} per shard
            - **Queue depth:** ${{ needs.prep.outputs.open_count }} open `docs-audit` issues
            - **Shard count:** $SHARD_COUNT (this is shard $SHARD_INDEX)

            The mode/batch/cap were chosen by the workflow based on the
            queue depth — you don't need to second-guess them. Just use
            them.

            ## Focus directive (optional)

            Maintainer-supplied focus for this run: `$AUDIT_FOCUS`

            Verify by echoing `"$AUDIT_FOCUS"` before doing anything else.

            **If `$AUDIT_FOCUS` is empty**, follow the default sweep logic
            below — pick your shard's slice from `files_remaining`, audit
            it, advance state.

            **If `$AUDIT_FOCUS` is non-empty**, this is a targeted probe
            from the maintainer, not a sweep tick. Override the default
            sweep logic as follows:

            - **Override file selection.** Ignore `files_remaining` and
              `files_audited`. Instead, glob the same docs corpus the
              round-restart step would (see "Sweep logic" step 2 for the
              include/exclude patterns), then filter to entries that match
              the focus hint — substring match on path is the first cut,
              but also use judgment about topical match (e.g. focus
              "weather plugin" includes `plugins/weather/**` and any
              top-level doc that talks about the weather plugin).
            - **Apply shard math to the filtered list.** Use the same
              `offset = $SHARD_INDEX * batch` / take next `batch` slice
              rule against the focus-filtered list. If the filtered list
              is shorter than `offset + batch`, just take what's there;
              if your shard's slice is empty, exit cleanly.
            - **Skew what you flag.** Lean toward findings within the focus
              area; small issues outside it can be skipped this run even if
              you stumble across them.
            - **Do NOT advance sweep state.** Skip the entire "State commit"
              section below. Do not modify `.github/docs-audit-state.json`,
              do not commit, do not push. A focus run is exploratory; the
              next scheduled sweep should still cover these files in the
              normal rotation. The fallback push step is also a no-op
              because the state file is unchanged.
            - **Title/body markers.** Tag the focus in your PR title and
              issue bodies so reviewers know this batch was scoped:
                - PR title suffix: ` [focus: <AUDIT_FOCUS>]`
                - Issue body: add a line `_Focus: <AUDIT_FOCUS>._` under
                  the "Filed by" footer.

            ## Learning from past rejections

            **Read `.github/docs-audit/rejected-edits.jsonl` before doing
            anything else.** Each non-empty line is a previous docs-pipeline
            PR (this cron's bucket-A PRs or a triage worker's
            `docs/issue-*` PR) that a human closed without merging — i.e.
            the proposed edit was wrong. The log is your single most
            important input; it is how this audit gets better over time.

            Each line is a JSON object with:
              - `pr`, `title`, `head_ref`, `closed_at`
              - `body` — the PR description you originally wrote
              - `files` — list of `{path, patch}` for every file changed,
                where `patch` is the raw unified diff
              - `comments`, `reviews`, `inline_comments` — every human
                comment on the PR (issue-style, review-level, and inline).
                These usually contain the *reason* the close happened.

            For each rejection:

            1. **Never repeat the exact swap.** Extract the `-` / `+`
               lines from each file's `patch`. If you would propose the
               same `-old → +new` change again — anywhere in the repo,
               not just in the same file — do not.
            2. **Read every comment.** Treat the close commenter's
               reasoning as authoritative. If they wrote "Vestaboard is
               the physical device this software drives, don't rename
               it" then "Vestaboard" is a protected term *everywhere* —
               not just in the file that PR touched.
            3. **Generalize.** Most rejections expose a class of false
               positive (proper nouns, intentional jargon, deliberate
               examples, links that look broken but aren't). Carry the
               class forward, not just the literal string.
            4. **Cite when relevant.** If you skip a finding because a
               past rejection covers it, mention the PR number in your
               wrap-up summary so the maintainer can see the loop
               working.

            If the file does not exist or is empty, proceed normally.

            ## Sweep state

            State file: `.github/docs-audit-state.json`
            Schema:
              - `round`           — int, sweep number (starts at 0; bumped each restart)
              - `round_started_at`— ISO8601 string or null
              - `last_run_at`     — ISO8601 string or null
              - `files_remaining` — list of relative paths still to audit this round
              - `files_audited`   — list of relative paths already audited this round

            ## Sweep logic

            1. Read the state file.
            2. If `files_remaining` is empty AND you are shard 0:
               - Glob the repo for docs files. Include:
                 `README.md`, `docs/**/*.md`, `plugins/*/README.md`,
                 `plugins/*/docs/**/*.md`, `web/src/components/README.md`.
                 Exclude `node_modules/`, `.git/`, `docs-site/node_modules/`,
                 `web/node_modules/`, `tools/`, and anything under `.claude/`.
               - Set `files_remaining` to the full glob, sorted.
               - Set `files_audited` to `[]`.
               - Bump `round` by 1 and set `round_started_at` to now (ISO8601 UTC).
               If `files_remaining` is empty AND you are NOT shard 0:
               - Exit cleanly. Shard 0 handles round restart so only one
                 shard touches the bump.
            3. Compute your slice. Let
               `offset = $SHARD_INDEX * ${{ needs.prep.outputs.batch }}` and
               `batch = ${{ needs.prep.outputs.batch }}`.
               Take `files_remaining[offset : offset + batch]` as this
               shard's batch. If the slice is empty (offset ≥ length),
               exit cleanly per the parallel-shard rules above.

            ## For each file in the batch

            Read it **carefully and deeply** — don't skim. For each file
            spend real budget understanding what the doc claims, then
            verify those claims (commands actually run? paths actually
            exist? referenced functions/symbols actually present? screenshots
            actually in the docs folder? variables/flags match the
            manifest or `src/`?).

            Categorize findings into three buckets:

            **A. Trivial mechanical fixes ONLY** — single-token or
                single-line edits with no ambiguity:
                  - Typos / spelling / grammar
                  - Code blocks missing a language tag
                  - Broken internal links to files that obviously moved
                    (verify with `ls`)

                Anything bigger than a one-line edit, anything that
                requires reading surrounding context to fix, anything
                that involves choosing between multiple reasonable
                rewrites — that is NOT bucket A. Push it to B or C so a
                triage worker handles it with focus.

            **B. Missing documentation** — a referenced concept, command,
                env var, or workflow with no documented home; a plugin
                without `docs/SETUP.md` or a hero image; a feature in
                `src/` with no user-facing doc; missing prerequisites;
                outdated identifiers (model IDs, API versions, CLI flags,
                package names) — file these as issues so the triage worker
                can verify the current value and replace it cleanly;
                broken code inside code blocks (invalid regex, malformed
                JSON, unparseable shell) — file as issue so the triage
                worker can rewrite it with full context.

            **C. Usability / clarity issues** — instructions that are
                correct but confusing, redundant, out-of-order, or could
                be simplified; jargon used before definition; examples
                that work but mislead (stale dates, placeholder values
                where a real example would help, mismatched voice).

            ## Aggressiveness

            Mode for this run: **${{ needs.prep.outputs.mode }}**.

            - `thorough` (queue ≤ 40 open issues): **file any defensible
              finding**. False positives are cheap — the triage worker
              will validate or leave a comment. Under-reporting is
              expensive — broken docs stay broken. Read each file end to
              end before deciding.
            - `balanced` (40 < queue ≤ 80): file findings you're moderately
              confident about. Skim past minor stylistic preferences.
            - `conservative` (queue > 80): only flag findings you're
              highly confident about. The reviewer queue is hot; don't
              add noise.

            Always: dedup against open `docs-audit` issues before filing
            (`gh issue list --label docs-audit --state open --limit 200
            --search "<key phrase>"`). Skip if a same-file, same-topic
            issue already exists open.

            ## Outputs

            ### If bucket A has any findings across the batch

            Compute, for *your shard's batch only*: let
            `audited_before = len(files_audited)` and let
            `T = len(files_audited) + len(files_remaining)` (the total file
            count for the round, computed from state BEFORE any update).
            Let `X = audited_before + ($SHARD_INDEX * ${{ needs.prep.outputs.batch }})`
            and `Y = X + (size of your batch — typically ${{ needs.prep.outputs.batch }})`.
            Use these in the title/body below — they describe the file
            range *this shard* audited, not the union across shards.

            Create a branch named exactly:

                docs-audit/round-<round>-run-$BRANCH_SUFFIX

            where `$BRANCH_SUFFIX` is the value of the `BRANCH_SUFFIX`
            environment variable (set by the workflow to
            `<run_id>-shard-<index>` so parallel shards land on disjoint
            branch names). Verify with `echo "$BRANCH_SUFFIX"` first. Do
            NOT use `date +%s` — past runs invented stale timestamps that
            way.

            Branch off `main`. Apply ONLY the bucket-A fixes (small, surgical
            edits). Commit. Open a **ready-for-review** PR (no `--draft`):

              Title: `docs: auto-audit — round <round>, files <X+1>–<Y> of <T> (shard <SHARD_INDEX>/<SHARD_COUNT>)`
                e.g. `docs: auto-audit — round 1, files 9–16 of 20 (shard 0/2)`
              Body:
                ## Summary
                Auto-generated by the daily docs-audit cron, shard
                <SHARD_INDEX> of <SHARD_COUNT>. Fixes <K> issues across
                <N> files.

                ## Files touched
                - `<path>`: <one-line description of fix>
                - ...

                ## Notes
                - Round <round> sweep, this shard audited files <X+1>–<Y> of <T>.
                - Review each diff — auto-edits can introduce regressions.

                🤖 Generated by the docs-audit GitHub Action.

            Use `gh pr create` (NO `--draft` flag). Docs PRs go straight to
            ready-for-review so the auto-review workflow fires and the
            maintainer sees them in the normal review queue. If you need
            ready-for-review explicitly, the gh default is already that — do
            not pass `--draft`.

            ### For each bucket B or C finding

            File a GitHub issue. Dedupe first:
              `gh issue list --label docs-audit --state open --limit 100 --search "<key phrase>"`
            If an issue with the same file + topic already exists, skip it.

            Issue title: `docs: <verb> <file> — <one-line summary>`
              e.g. `docs: clarify weather plugin SETUP.md — API key step ordering`
                   `docs: add missing docs for src/carousels schema migration flow`

            Issue body:
              ## File(s)
              - `<path>`

              ## Category
              <Missing documentation | Usability / clarity>

              ## Finding
              <2–5 sentences describing what's missing or confusing>

              ## Suggested improvement
              <2–5 sentences proposing how to fix it>

              ---
              _Filed by the docs-audit cron during round <round> (shard <SHARD_INDEX>/<SHARD_COUNT>)._

            Labels: `docs`, `docs-audit`. Create the labels if they don't exist
            (`gh label create docs-audit --color BFD4F2 --description "Filed by the docs-audit cron" || true`).

            After creating each issue, also apply the `claude-fix` label so the
            issue-triage workflow picks it up and takes a first-pass attempt
            at a docs PR (issues filed by this bot don't satisfy the triage
            workflow's author-association gate, so `claude-fix` is what opens
            that path):
              `gh issue edit <N> --add-label claude-fix`
            Create that label first if needed:
              `gh label create claude-fix --color 0E8A16 --description "Run the Claude issue-triage workflow on this issue" || true`

            ## State commit

            After processing your batch:
            1. Re-read the state file (it may have been updated by a sibling
               shard that finished first; that's OK).
            2. Compute the **union slice** consumed by all parallel shards
               this run: the first `min($SHARD_COUNT * ${{ needs.prep.outputs.batch }}, len(files_remaining))`
               entries of `files_remaining`.
            3. Move that union slice from `files_remaining` to
               `files_audited`. Every shard computes the same end-state,
               so racing pushes are safe.
            4. Update `last_run_at` to now (ISO8601 UTC).
            5. Write the JSON back to `.github/docs-audit-state.json`
               (2-space indent, trailing newline, keys in the same order as the
               existing file).
            6. Commit and push to `main` directly with rebase+retry to
               survive races with sibling shards:

               ```bash
               git add .github/docs-audit-state.json
               git commit -m "chore(docs-audit): advance sweep state [skip ci]" || exit 0
               for attempt in 1 2 3 4 5; do
                 if git push origin HEAD:main; then
                   echo "State pushed on attempt $attempt."
                   exit 0
                 fi
                 echo "Push attempt $attempt failed; rebasing onto origin/main."
                 git fetch origin main
                 # If a sibling shard already advanced state to the same
                 # end-state, our commit is a no-op after rebase — that's
                 # fine, the push will succeed.
                 git rebase origin/main || git rebase --abort
               done
               echo "State push failed after retries; sibling shard will cover it."
               ```

               This is the ONLY direct-to-main commit you make.

            ## Hard rules

            - Never push to `main` except for the single state-file commit above.
            - Never force-push, never `--no-verify`, never `--no-gpg-sign`.
            - Never modify non-docs source code. Edits are restricted to
              `*.md` files and `.github/docs-audit-state.json`.
            - Never open more than 1 PR per shard (so up to $SHARD_COUNT PRs
              per dispatch).
            - Never file more than **${{ needs.prep.outputs.cap }}** issues
              per shard (the cap is dynamic based on queue depth). If you'd
              file more, keep the top ${{ needs.prep.outputs.cap }} (most
              actionable) and discard the rest.
            - When dedup says skip, skip — don't refile the same finding.
              When mode is `thorough`, lean toward filing; when
              `conservative`, lean toward skipping.

            ## Wrap up

            Print a one-screen summary:
              SHARD: $SHARD_INDEX of $SHARD_COUNT
              ROUND: <n> (started <date>)
              BATCH: <files in this shard's batch>
              PR opened: <#N or "none">
              Issues filed: <#A #B ...>
              Progress: <audited>/<total> files in this round
              Next batch: <first 3 of files_remaining or "round complete">

      - name: Push state-file changes (fallback)
        # Defensive: if the Claude step somehow leaves a staged state change
        # without pushing (early exit, rate limit, etc.), commit + push it
        # here with the same rebase+retry pattern as the prompt. `[skip ci]`
        # keeps this from triggering downstream workflows.
        run: |
          if git diff --quiet -- .github/docs-audit-state.json; then
            echo "State file unchanged."
            exit 0
          fi
          git add .github/docs-audit-state.json
          git commit -m "chore(docs-audit): advance sweep state [skip ci]"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "State pushed on attempt $attempt."
              exit 0
            fi
            echo "Push attempt $attempt failed; rebasing onto origin/main."
            git fetch origin main
            git rebase origin/main || git rebase --abort
          done
          echo "State push failed after retries; sibling shard will cover it."
