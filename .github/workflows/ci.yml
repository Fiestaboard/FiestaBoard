name: 'CI: Lint, Test & Build'

on:
  push:
    branches: [ main, develop ]
  pull_request:
    # Run on all PRs regardless of target branch (validate before merge)
    branches: [ '**' ]
  # Required so the `CI Success` status check reports on the merge-queue
  # SHA. Without this, GitHub waits `check_response_timeout_minutes` for a
  # check that never fires and removes the PR with "no response for
  # status checks". See `dorny/paths-filter` — it diffs the merge SHA
  # against main, so the existing path filters keep heavy jobs skipped
  # when the merge commit touches nothing they care about.
  merge_group:

concurrency:
  # On merge_group there is no pull_request.number, so this falls back to
  # the merge SHA — unique per queue entry, so no cross-queue cancels.
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  detect-changes:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      ui: ${{ steps.filter.outputs.ui }}
      plugins: ${{ steps.filter.outputs.plugins }}
      shared: ${{ steps.filter.outputs.shared }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          filters: |
            api:
              - 'src/**'
              - 'requirements.txt'
              - 'requirements-dev.txt'
              - 'Dockerfile'
              - 'start-dev.sh'
              - 'tests/**'
              - 'scripts/**'
              - 'pyproject.toml'
            ui:
              - 'web/**'
              - 'Dockerfile'
              - 'nginx.conf'
              - 'start-dev.sh'
            plugins:
              - 'plugins/**'
            shared:
              # Files that genuinely affect every test surface (Platform,
              # UI, Plugins, A11y, E2E, Build). Keep this list as an
              # *explicit allowlist* — do NOT use `!`-negation patterns
              # here. dorny/paths-filter defaults to
              # `predicate-quantifier: some`, which makes a single negation
              # like `!foo` match every file that isn't `foo`, turning the
              # whole filter into a universal match. See
              # docs/development/CI_PATH_FILTERING_AUDIT.md for details.
              #
              # Workflows that own their own pipelines (build-fiestapi,
              # build-fiestaupdater, docs, registry-scan, pr-label,
              # release) are intentionally NOT listed here.
              - 'docker-compose*.yml'
              - '.github/workflows/ci.yml'
              - '.github/workflows/integration-tests.yml'
              - 'package.json'
              - 'scripts/version-sync.js'
            docs:
              - 'docs-site/**'
            markdown:
              # Any markdown anywhere, plus the docs-lint tooling/config, so
              # the lint-markdown + link-check jobs run when prose or their
              # own configuration changes.
              - '**/*.md'
              - '**/*.mdx'
              - 'cspell.json'
              - '.markdownlint-cli2.jsonc'
              - 'lychee.toml'
              - 'scripts/lint-docs-frontmatter.mjs'
              - 'package.json'
              - 'package-lock.json'

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    # PR-only: the action needs a base/head SHA pair to diff against.
    if: github.event_name == 'pull_request'
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write  # allow inline review comments on offending deps
    steps:
      - uses: actions/checkout@v7
      - name: Review new dependencies
        uses: actions/dependency-review-action@v5
        with:
          # Fail on a vulnerable dep being added at moderate or higher.
          fail-on-severity: moderate
          # License allow-list lifted from common OSS-friendly choices.
          # Add to this list if a future dep needs an unlisted license;
          # do NOT silently allow all licenses.
          allow-licenses: >-
            MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, 0BSD,
            CC0-1.0, Unlicense, Python-2.0, MPL-2.0, Zlib, BlueOak-1.0.0
          # Per-package exceptions for deps whose license isn't on the
          # general allow-list but which we've reviewed and accepted.
          # - caniuse-lite ships browser-compat *data* under CC-BY-4.0 (the
          #   code is MIT); it's a transitive dep of browserslist, pulled
          #   in by tooling across the web build.
          # - @fontsource-variable/geist + -geist-mono ship the actual
          #   font files (woff2) under SIL Open Font License 1.1 (OFL-1.1).
          #   OFL is the standard permissive font license used by Google
          #   Fonts; the JS wrapper / package metadata is MIT. Replaced
          #   next/font/google during the Next.js → RR7 migration so the
          #   fonts are self-hosted (HA-Ingress-safe).
          allow-dependencies-licenses: >-
            pkg:npm/caniuse-lite,
            pkg:npm/%40fontsource-variable/geist,
            pkg:npm/%40fontsource-variable/geist-mono
          comment-summary-in-pr: on-failure

  test-platform:
    name: Platform Tests
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.api == 'true' || needs.detect-changes.outputs.shared == 'true'
    timeout-minutes: 10
    
    steps:
    - uses: actions/checkout@v7

    - name: Set up Python deps
      uses: ./.github/actions/setup-python-deps

    - name: Verify imports
      run: |
        python -c "import sys; sys.path.insert(0, '.'); from src import config, board_client, board_chars; print('✅ Core imports successful')"
        python -c "import sys; sys.path.insert(0, '.'); from src.utils import weather, datetime, home_assistant, star_trek_quotes; print('✅ Utils imports successful')"
        python -c "import sys; sys.path.insert(0, '.'); from src.formatters import message_formatter; print('✅ Formatter imports successful')"
        python -c "import sys; sys.path.insert(0, '.'); from src.main import FiestaBoardDisplayService; print('✅ Main module imports successful')"
        python -c "
        import sys; sys.path.insert(0, '.')
        from src.config import Config
        from src.board_chars import BoardChars
        print('✅ Config and BoardChars can be imported')
        print(f'✅ Config class has required attributes: {hasattr(Config, \"BOARD_READ_WRITE_KEY\")}')
        "
      env:
        BOARD_READ_WRITE_KEY: test_key
        WEATHER_API_KEY: test_key
    
    - name: Lint with ruff
      run: |
        ruff --version
        # Config is in pyproject.toml [tool.ruff].
        ruff check src/ plugins/ tests/ scripts/

    - name: Check formatting with ruff
      run: |
        # ruff format replaces black; same output, one tool.
        ruff format --check src/ plugins/ tests/ scripts/
    
    - name: Run platform tests with coverage
      run: |
        # Exclude integration tests (network-dependent, run in a separate step).
        # `-n auto` runs tests across all available CPU cores via pytest-xdist.
        # `--cov` config (source + omit) comes from pyproject.toml
        # [tool.coverage.run] — pytest-cov handles the per-worker data
        # collection and combine automatically.
        pytest tests/ -v -m "not integration" -n auto \
          --cov=src \
          --cov-branch \
          --cov-report=xml:coverage.xml \
          --cov-report=term-missing \
          --cov-fail-under=80
      env:
        BOARD_READ_WRITE_KEY: test_key
        WEATHER_API_KEY: test_key

    - name: Write coverage summary
      if: always()
      run: |
        if [ -f coverage.xml ]; then
          python3 scripts/ci/coverage_summary.py \
            --cobertura coverage.xml \
            --title "Platform Tests" >> "$GITHUB_STEP_SUMMARY"
        fi

    - name: Run plugin install integration tests
      run: |
        # Real git clone/pull/uninstall against live Fiestaboard plugin repos on GitHub.
        # Requires network access and git binary (both available on ubuntu-latest).
        pytest -m integration tests/test_plugin_install_integration.py -v
      env:
        BOARD_READ_WRITE_KEY: test_key

    - name: Run note-array Cloud mock contract tests
      run: |
        # The mock-cloud Cloud API contract suite lives under integration-tests/,
        # which is excluded from [tool.pytest.ini_options] testpaths, so the main
        # test step above never collects it. It is stdlib-only and self-hosts its
        # mock HTTP servers (no Docker needed), so it can run directly on the host.
        pytest integration-tests/ -v
      env:
        BOARD_READ_WRITE_KEY: test_key

    - name: Upload platform coverage
      uses: codecov/codecov-action@v7
      with:
        files: coverage.xml
        flags: platform
        name: platform-coverage
        fail_ci_if_error: false
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  test-plugins:
    name: Plugin Tests
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.plugins == 'true' || needs.detect-changes.outputs.api == 'true' || needs.detect-changes.outputs.shared == 'true'
    timeout-minutes: 10
    
    steps:
    - uses: actions/checkout@v7

    - name: Set up Python deps
      uses: ./.github/actions/setup-python-deps

    - name: Validate plugin integrity
      run: |
        echo "Validating plugin manifests and uniqueness..."
        python scripts/validate_plugins.py --verbose
        echo "✅ All plugins validated successfully"

    - name: Validate plugin registry
      run: |
        echo "Validating plugin-registry.json repository URLs..."
        python scripts/validate_plugins.py --registry --verbose
        echo "✅ All registry repositories are reachable"

    - name: Discover plugins with tests
      id: discover
      run: |
        echo "Discovering plugins with tests..."
        plugins=$(find plugins -maxdepth 2 -type d -name "tests" | sed 's|/tests||' | sed 's|plugins/||' | grep -v "^_" || true)
        if [ -z "$plugins" ]; then
          echo "No plugins with tests found"
          echo "has_plugins=false" >> $GITHUB_OUTPUT
        else
          echo "Found plugins with tests:"
          echo "$plugins"
          echo "has_plugins=true" >> $GITHUB_OUTPUT
        fi
    
    - name: Run plugin tests with coverage
      if: steps.discover.outputs.has_plugins == 'true'
      run: |
        python scripts/run_plugin_tests.py --verbose
        # Combine per-plugin coverage data and generate XML for Codecov.
        # Failures here mean the test setup is broken — surface them.
        coverage combine
        coverage xml -o coverage-plugins.xml
      env:
        BOARD_READ_WRITE_KEY: test_key
        WEATHER_API_KEY: test_key

    - name: Write coverage summary
      if: always() && steps.discover.outputs.has_plugins == 'true'
      run: |
        if [ -f coverage-plugins.xml ]; then
          python3 scripts/ci/coverage_summary.py \
            --cobertura coverage-plugins.xml \
            --title "Plugin Tests" >> "$GITHUB_STEP_SUMMARY"
        fi

    - name: Upload plugin coverage
      if: steps.discover.outputs.has_plugins == 'true'
      uses: codecov/codecov-action@v7
      with:
        files: coverage-plugins.xml
        flags: plugins
        name: plugin-coverage
        fail_ci_if_error: false
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  lint-web:
    name: Lint UI (web)
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.ui == 'true' || needs.detect-changes.outputs.shared == 'true'
    timeout-minutes: 5

    steps:
    - uses: actions/checkout@v7

    - name: Set up Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '20'
        cache: 'npm'
        # package-lock.json is regenerated by the next CI run after the
        # Next.js → RR7 migration; fall back to package.json for the
        # cache key until the regenerated lockfile is committed.
        cache-dependency-path: web/package.json

    - name: Install UI dependencies
      working-directory: web
      # `npm ci` once a fresh lockfile is committed post-migration;
      # `npm install` covers the gap when it isn't.
      run: |
        if [ -f package-lock.json ]; then
          npm ci --legacy-peer-deps --no-audit
        else
          npm install --legacy-peer-deps --no-audit
        fi

    - name: ESLint
      working-directory: web
      run: npm run lint

    - name: Prettier check
      working-directory: web
      run: npm run format:check

  lint-docs:
    name: Lint Docs Site
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.docs == 'true' || needs.detect-changes.outputs.shared == 'true'
    timeout-minutes: 5

    steps:
    - uses: actions/checkout@v7

    - name: Set up Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: docs-site/package-lock.json

    - name: Install docs-site dependencies
      working-directory: docs-site
      run: npm ci

    - name: ESLint
      working-directory: docs-site
      run: npm run lint

    - name: Prettier check
      working-directory: docs-site
      run: npm run format:check

  test-ui:
    name: UI Tests
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.ui == 'true' || needs.detect-changes.outputs.shared == 'true'
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v7

    - name: Set up Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '20'
        cache: 'npm'
        # package-lock.json is regenerated by the next CI run after the
        # Next.js → RR7 migration; fall back to package.json for the
        # cache key until the regenerated lockfile is committed.
        cache-dependency-path: web/package.json

    - name: Install UI dependencies
      working-directory: web
      run: |
        if [ -f package-lock.json ]; then
          npm ci --legacy-peer-deps --no-audit
        else
          npm install --legacy-peer-deps --no-audit
        fi

    - name: Run UI tests with coverage
      working-directory: web
      run: npm run test:coverage

    - name: Write coverage summary
      if: always()
      run: |
        if [ -f web/coverage/lcov.info ]; then
          python3 scripts/ci/coverage_summary.py \
            --lcov web/coverage/lcov.info \
            --title "UI Tests" >> "$GITHUB_STEP_SUMMARY"
        fi

    - name: Upload UI coverage
      uses: codecov/codecov-action@v7
      with:
        files: web/coverage/lcov.info
        flags: ui
        name: ui-coverage
        fail_ci_if_error: false
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  a11y-tests:
    name: Accessibility Tests (${{ matrix.theme }})
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.ui == 'true' || needs.detect-changes.outputs.shared == 'true'
    timeout-minutes: 15

    # Run both themes in parallel — each spawns chromium and walks every
    # story, so cutting them apart roughly halves wall-clock (~4m → ~2m).
    strategy:
      fail-fast: false
      matrix:
        theme: [dark, light]

    steps:
    - uses: actions/checkout@v7

    - name: Set up Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '20'
        cache: 'npm'
        # package-lock.json is regenerated by the next CI run after the
        # Next.js → RR7 migration; fall back to package.json for the
        # cache key until the regenerated lockfile is committed.
        cache-dependency-path: web/package.json

    - name: Install dependencies
      working-directory: web
      run: |
        if [ -f package-lock.json ]; then
          npm ci --legacy-peer-deps --no-audit
        else
          npm install --legacy-peer-deps --no-audit
        fi

    - name: Cache Playwright browsers
      uses: actions/cache@v6
      with:
        path: ~/.cache/ms-playwright
        # Hash package.json when the lockfile isn't present yet
        # (post-migration first-build).
        key: playwright-a11y-${{ runner.os }}-${{ hashFiles('web/package.json', 'web/package-lock.json') }}

    - name: Install Playwright browsers
      working-directory: web
      run: npx playwright install --with-deps chromium

    - name: Build Storybook
      working-directory: web
      run: npm run build-storybook -- --quiet

    - name: Start Storybook static server
      working-directory: web
      run: |
        npx http-server storybook-static --port 6006 --silent &
        sleep 5

    - name: Run Storybook a11y tests
      working-directory: web
      timeout-minutes: 8
      run: |
        URL="http://localhost:6006"
        if [ "${{ matrix.theme }}" = "light" ]; then
          URL="${URL}?globals=theme:light"
        fi
        npm run test-storybook:ci -- --url "$URL"

  build-test-image:
    name: Build Test Image
    runs-on: ubuntu-latest
    needs: detect-changes
    if: github.event_name == 'pull_request' && (needs.detect-changes.outputs.api == 'true' || needs.detect-changes.outputs.ui == 'true' || needs.detect-changes.outputs.shared == 'true')
    timeout-minutes: 10

    # Builds the test Docker image once and warms the `build-test` GHA
    # cache scope. The three downstream E2E jobs (e2e, ai-mcp, auth)
    # each `needs:` this job and pull from the warm cache via
    # `cache-from`, skipping the work of computing layers themselves.
    # Net effect: one cold build per PR instead of three.
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        # Skip on fork PRs and Dependabot PRs (neither has access to the
        # DOCKERHUB_* secrets — forks by policy, Dependabot because it uses
        # a separate secret namespace). On internal PRs and main, fail
        # loudly so we notice credential problems instead of silently
        # falling back to anonymous pulls with their tiny rate limits.
        if: >-
          (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
          && github.actor != 'dependabot[bot]'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build test image (warms cache for E2E jobs)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          # `load: false` — this job doesn't run the image, it only
          # populates the GHA cache so the E2E jobs can pull warm layers.
          build-args: |
            VERSION=dev
          cache-from: |
            type=gha,scope=build-linux/amd64
            type=gha,scope=build-test
          cache-to: type=gha,mode=max,scope=build-test

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [detect-changes, build-test-image]
    if: github.event_name == 'pull_request' && (needs.detect-changes.outputs.api == 'true' || needs.detect-changes.outputs.ui == 'true' || needs.detect-changes.outputs.shared == 'true')
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # ── Install deps (npm + Playwright, with caching) ─────────────
      - name: Set up web E2E environment
        uses: ./.github/actions/setup-web-e2e

      # ── Build Docker image ─────────────────────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        # Skip on fork PRs and Dependabot PRs (neither has access to the
        # DOCKERHUB_* secrets — forks by policy, Dependabot because it uses
        # a separate secret namespace). On internal PRs and main, fail
        # loudly so we notice credential problems instead of silently
        # falling back to anonymous pulls with their tiny rate limits.
        if: >-
          (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
          && github.actor != 'dependabot[bot]'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build test image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: fiestaboard:e2e
          build-args: |
            VERSION=dev
          # Cache is warmed by the `build-test-image` job; we only read.
          cache-from: |
            type=gha,scope=build-linux/amd64
            type=gha,scope=build-test

      # ── Start containers ──────────────────────────────────────────
      - name: Start 4 mock board + mock cloud + FiestaBoard containers
        run: |
          WORKER_COUNT=4
          WORKER_URLS=""
          WORKER_MOCK_URLS=""
          WORKER_MOCK_HOSTS=""
          MOCK_CLOUD_URLS=""

          for i in $(seq 0 $((WORKER_COUNT - 1))); do
            # PORTS=7000,7001 — two Local-API listeners so multi-board output
            # tests (multi-board-output.spec.ts) can address a second board.
            docker run -d --name mock-board-$i \
              -v ${{ github.workspace }}/integration-tests/mock-board:/app:ro \
              -w /app \
              -e PORTS=7000,7001 \
              python:3.11-slim python server.py

            # Note-array Cloud API mock (stdlib-only), one per worker; tests
            # reconfigure its size at runtime via /mock/configure. The
            # backend must know its address at startup, so inspect the IP
            # here and pass VESTABOARD_CLOUD_API_URL to the app container.
            docker run -d --name mock-cloud-$i \
              -e PORT=9200 \
              -v ${{ github.workspace }}/integration-tests/mock-cloud:/app:ro \
              -w /app \
              python:3.11-slim python server.py
            CLOUD_IP=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' mock-cloud-$i)

            docker run -d --name fiestaboard-$i \
              -e PRODUCTION=false \
              -e FIESTABOARD_AUTH_ENABLED=false \
              -e VESTABOARD_CLOUD_API_URL=http://$CLOUD_IP:9200/ \
              fiestaboard:e2e
          done

          for i in $(seq 0 $((WORKER_COUNT - 1))); do
            FB_IP=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' fiestaboard-$i)
            MOCK_IP=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' mock-board-$i)
            CLOUD_IP=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' mock-cloud-$i)

            [ -n "$WORKER_URLS" ] && WORKER_URLS="$WORKER_URLS,"
            [ -n "$WORKER_MOCK_URLS" ] && WORKER_MOCK_URLS="$WORKER_MOCK_URLS,"
            [ -n "$WORKER_MOCK_HOSTS" ] && WORKER_MOCK_HOSTS="$WORKER_MOCK_HOSTS,"
            [ -n "$MOCK_CLOUD_URLS" ] && MOCK_CLOUD_URLS="$MOCK_CLOUD_URLS,"

            WORKER_URLS="${WORKER_URLS}http://$FB_IP:3000"
            WORKER_MOCK_URLS="${WORKER_MOCK_URLS}http://$MOCK_IP:7000"
            WORKER_MOCK_HOSTS="${WORKER_MOCK_HOSTS}$MOCK_IP"
            MOCK_CLOUD_URLS="${MOCK_CLOUD_URLS}http://$CLOUD_IP:9200"

            echo "Worker $i: FiestaBoard=$FB_IP, MockBoard=$MOCK_IP, MockCloud=$CLOUD_IP"
          done

          echo "WORKER_URLS=$WORKER_URLS" >> $GITHUB_ENV
          echo "WORKER_MOCK_URLS=$WORKER_MOCK_URLS" >> $GITHUB_ENV
          echo "WORKER_MOCK_HOSTS=$WORKER_MOCK_HOSTS" >> $GITHUB_ENV
          echo "MOCK_CLOUD_URLS=$MOCK_CLOUD_URLS" >> $GITHUB_ENV

      - name: Wait for all containers to be ready
        # Worst case is 4 workers × 60s = 4min; cap at 3 so we fail
        # well before the job-level timeout (15m) and leave time for
        # log capture + cleanup.
        timeout-minutes: 3
        run: |
          IFS=',' read -ra URLS <<< "$WORKER_URLS"
          for url in "${URLS[@]}"; do
            echo "Waiting for $url..."
            for i in $(seq 1 60); do
              STATUS=$(curl -s -m 5 -o /dev/null -w "%{http_code}" "$url/api/health" 2>/dev/null || echo "000")
              if [ "$STATUS" = "200" ]; then
                echo "  Ready (attempt $i)"
                break
              fi
              if [ "$i" = "60" ]; then
                echo "  ❌ Failed to become ready"
                exit 1
              fi
              sleep 1
            done
          done

      # ── Run tests ─────────────────────────────────────────────────
      - name: Run E2E tests
        working-directory: web
        timeout-minutes: 10
        run: npx playwright test --reporter=github
        env:
          CI: true
          WORKER_URLS: ${{ env.WORKER_URLS }}
          WORKER_MOCK_URLS: ${{ env.WORKER_MOCK_URLS }}
          WORKER_MOCK_HOSTS: ${{ env.WORKER_MOCK_HOSTS }}
          MOCK_CLOUD_URLS: ${{ env.MOCK_CLOUD_URLS }}

      # ── Visual regression tests ───────────────────────────────────
      # Runs visual-regression.spec.ts against the first worker container
      # only (15 screenshot tests don't benefit from per-worker sharding).
      # `continue-on-error: true` is in place until baseline snapshots are
      # committed. To bootstrap (or refresh) baselines, run:
      #   gh workflow run bootstrap-visual-baselines.yml
      # That workflow opens a PR with the new PNGs and removes this
      # `continue-on-error: true` line, making the step required.
      # See docs/development/VISUAL_REGRESSION.md for the full workflow.
      - name: Run visual regression tests
        id: visual-regression
        working-directory: web
        continue-on-error: true
        timeout-minutes: 5
        run: npx playwright test visual-regression.spec.ts --reporter=github --workers=1
        env:
          CI: true
          RUN_VISUAL_REGRESSION: "1"
          PLAYWRIGHT_OUTPUT_DIR: playwright-visual-results
          WORKER_URLS: ${{ env.WORKER_URLS }}
          WORKER_MOCK_URLS: ${{ env.WORKER_MOCK_URLS }}
          WORKER_MOCK_HOSTS: ${{ env.WORKER_MOCK_HOSTS }}
          MOCK_CLOUD_URLS: ${{ env.MOCK_CLOUD_URLS }}

      - name: Stop containers
        if: always()
        run: |
          for i in 0 1 2 3; do
            docker rm -f fiestaboard-$i mock-board-$i mock-cloud-$i 2>/dev/null || true
          done

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-results
          path: web/playwright-test-results/
          retention-days: 7

      - name: Upload visual regression results
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: visual-regression-results
          path: web/playwright-visual-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload visual regression snapshots
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: visual-regression-snapshots
          path: web/tests/visual-regression.spec.ts-snapshots/
          retention-days: 30
          if-no-files-found: ignore

  ai-mcp-e2e-tests:
    name: AI + MCP E2E Tests
    runs-on: ubuntu-latest
    needs: [detect-changes, build-test-image]
    if: github.event_name == 'pull_request' && (needs.detect-changes.outputs.api == 'true' || needs.detect-changes.outputs.ui == 'true' || needs.detect-changes.outputs.shared == 'true')
    timeout-minutes: 12

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up web E2E environment
        uses: ./.github/actions/setup-web-e2e

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        # Skip on fork PRs and Dependabot PRs (neither has access to the
        # DOCKERHUB_* secrets — forks by policy, Dependabot because it uses
        # a separate secret namespace). On internal PRs and main, fail
        # loudly so we notice credential problems instead of silently
        # falling back to anonymous pulls with their tiny rate limits.
        if: >-
          (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
          && github.actor != 'dependabot[bot]'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build test image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: fiestaboard:ai-mcp-e2e
          build-args: |
            VERSION=dev
          # Reuse the cache the main e2e job warms up.
          cache-from: |
            type=gha,scope=build-linux/amd64
            type=gha,scope=build-test

      - name: Start mock LLM + FiestaBoard containers
        run: |
          docker run -d --name mock-llm \
            -v ${{ github.workspace }}/integration-tests/mock-llm:/app:ro \
            -w /app \
            -e PORT=9100 \
            python:3.11-slim python server.py

          MOCK_IP=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' mock-llm)
          echo "Mock LLM IP: $MOCK_IP"

          docker run -d --name fiestaboard-ai \
            -e PRODUCTION=false \
            -e FIESTABOARD_AUTH_ENABLED=false \
            fiestaboard:ai-mcp-e2e

          FB_IP=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' fiestaboard-ai)
          echo "FiestaBoard IP: $FB_IP"

          # BASE_URL is what Playwright hits; MOCK_LLM_URL is what FiestaBoard
          # uses to reach the mock (Docker-internal); MOCK_LLM_CONTROL_URL is
          # what Playwright uses to drive /mock/state etc. (host-reachable).
          echo "BASE_URL=http://$FB_IP:3000" >> $GITHUB_ENV
          echo "MOCK_LLM_URL=http://$MOCK_IP:9100" >> $GITHUB_ENV
          echo "MOCK_LLM_CONTROL_URL=http://$MOCK_IP:9100" >> $GITHUB_ENV

      - name: Wait for containers to be ready
        # 60s for FiestaBoard + 30s for mock LLM; cap at 2m so a stuck
        # container fails fast.
        timeout-minutes: 2
        run: |
          for i in $(seq 1 60); do
            STATUS=$(curl -s -m 5 -o /dev/null -w "%{http_code}" "$BASE_URL/api/health" 2>/dev/null || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "✅ FiestaBoard ready"
              break
            fi
            if [ "$i" = "60" ]; then
              echo "❌ FiestaBoard failed to become ready"
              docker logs fiestaboard-ai | tail -100
              exit 1
            fi
            sleep 1
          done
          for i in $(seq 1 30); do
            STATUS=$(curl -s -m 5 -o /dev/null -w "%{http_code}" "$MOCK_LLM_URL/mock/state" 2>/dev/null || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "✅ Mock LLM ready"
              break
            fi
            if [ "$i" = "30" ]; then
              echo "❌ Mock LLM failed to become ready"
              docker logs mock-llm | tail -100
              exit 1
            fi
            sleep 1
          done

      - name: Sanity check — MCP mount is live
        # If the mcp Python package failed to install, FastMCP silently
        # disables the mount. Catching that here gives a clearer failure
        # than ten flaky-looking mcp.spec.ts errors.
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$BASE_URL/api/mcp/" || echo "000")
          echo "GET /api/mcp/ -> $STATUS"
          if [ "$STATUS" = "404" ]; then
            echo "❌ MCP endpoint returned 404 — mcp package likely missing or mount failed"
            docker logs fiestaboard-ai | grep -i mcp | tail -20
            exit 1
          fi

      - name: Run AI + MCP E2E tests
        working-directory: web
        timeout-minutes: 8
        run: npx playwright test ai.spec.ts mcp.spec.ts --reporter=github --workers=1
        env:
          CI: true
          RUN_AI_TESTS: "1"
          BASE_URL: ${{ env.BASE_URL }}
          MOCK_LLM_URL: ${{ env.MOCK_LLM_URL }}
          MOCK_LLM_CONTROL_URL: ${{ env.MOCK_LLM_CONTROL_URL }}

      - name: Dump logs on failure
        if: failure()
        run: |
          echo "===== fiestaboard-ai ====="
          docker logs fiestaboard-ai | tail -200
          echo "===== mock-llm ====="
          docker logs mock-llm | tail -100

      - name: Stop containers
        if: always()
        run: |
          docker rm -f fiestaboard-ai mock-llm 2>/dev/null || true

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-ai-mcp-results
          path: web/playwright-test-results/
          retention-days: 7

  auth-e2e-tests:
    name: Auth E2E Tests
    runs-on: ubuntu-latest
    needs: [detect-changes, build-test-image]
    if: github.event_name == 'pull_request' && (needs.detect-changes.outputs.api == 'true' || needs.detect-changes.outputs.ui == 'true' || needs.detect-changes.outputs.shared == 'true')
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up web E2E environment
        uses: ./.github/actions/setup-web-e2e

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        # Skip on fork PRs and Dependabot PRs (neither has access to the
        # DOCKERHUB_* secrets — forks by policy, Dependabot because it uses
        # a separate secret namespace). On internal PRs and main, fail
        # loudly so we notice credential problems instead of silently
        # falling back to anonymous pulls with their tiny rate limits.
        if: >-
          (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
          && github.actor != 'dependabot[bot]'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build test image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: fiestaboard:auth-e2e
          build-args: |
            VERSION=dev
          # Reuse the cache the main e2e job warms up.
          cache-from: |
            type=gha,scope=build-linux/amd64
            type=gha,scope=build-test

      - name: Start FiestaBoard with auth enabled
        run: |
          docker run -d --name fiestaboard-auth \
            -e PRODUCTION=false \
            -e FIESTABOARD_AUTH_ENABLED=true \
            fiestaboard:auth-e2e

          FB_IP=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' fiestaboard-auth)
          echo "BASE_URL=http://$FB_IP:3000" >> $GITHUB_ENV
          echo "FiestaBoard IP: $FB_IP"

      - name: Wait for container ready
        # 60s polling budget; cap at 90s so we fail before job timeout.
        timeout-minutes: 2
        run: |
          for i in $(seq 1 60); do
            STATUS=$(curl -s -m 5 -o /dev/null -w "%{http_code}" "$BASE_URL/api/health" 2>/dev/null || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "✅ Ready (attempt $i)"
              break
            fi
            if [ "$i" = "60" ]; then
              echo "❌ Failed to become ready"
              docker logs fiestaboard-auth | tail -50
              exit 1
            fi
            sleep 1
          done

      - name: Confirm auth is enabled
        # Sanity check: if the container started with auth disabled we'd
        # get false positives from the spec's skip guard.
        run: |
          MODE=$(curl -s "$BASE_URL/api/auth/status" | python3 -c "import json,sys; print(json.load(sys.stdin)['mode'])")
          echo "auth mode = $MODE"
          if [ "$MODE" != "enabled" ]; then
            echo "❌ Expected auth mode 'enabled', got '$MODE'"
            exit 1
          fi

      - name: Run auth E2E tests
        working-directory: web
        timeout-minutes: 5
        run: npx playwright test auth.spec.ts --reporter=github --workers=1
        env:
          CI: true
          RUN_AUTH_TESTS: "1"
          BASE_URL: ${{ env.BASE_URL }}

      - name: Dump container logs on failure
        if: failure()
        run: docker logs fiestaboard-auth | tail -200

      - name: Stop container
        if: always()
        run: docker rm -f fiestaboard-auth 2>/dev/null || true

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-auth-results
          path: web/playwright-test-results/
          retention-days: 7

  build:
    name: Build Verification
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.api == 'true' || needs.detect-changes.outputs.ui == 'true' || needs.detect-changes.outputs.shared == 'true'
    timeout-minutes: 5
    
    steps:
    - uses: actions/checkout@v7
    
    - name: Verify package structure
      run: |
        echo "Checking package structure..."
        test -d src || (echo "❌ src directory missing" && exit 1)
        test -f src/__init__.py || (echo "❌ src/__init__.py missing" && exit 1)
        test -f src/main.py || (echo "❌ src/main.py missing" && exit 1)
        test -f src/config.py || (echo "❌ src/config.py missing" && exit 1)
        echo "✅ Package structure is valid"
    
    - name: Verify plugin structure
      run: |
        echo "Checking plugin structure..."
        test -d plugins || (echo "❌ plugins directory missing" && exit 1)
        # Verify each plugin has required files
        for plugin in plugins/*/; do
          plugin_name=$(basename "$plugin")
          if [ "$plugin_name" != "_template" ] && [ -d "$plugin" ]; then
            echo "Checking plugin: $plugin_name"
            test -f "$plugin/__init__.py" || (echo "❌ $plugin_name/__init__.py missing" && exit 1)
            test -f "$plugin/manifest.json" || (echo "❌ $plugin_name/manifest.json missing" && exit 1)
            echo "  ✅ $plugin_name structure valid"
          fi
        done
        echo "✅ All plugin structures valid"

  build-docs:
    name: Build Docs
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.docs == 'true' || needs.detect-changes.outputs.shared == 'true'
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v7

    - name: Set up Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: docs-site/package-lock.json

    - name: Install dependencies
      working-directory: docs-site
      run: npm ci

    - name: Cache Docusaurus build
      uses: actions/cache@v6
      with:
        path: |
          docs-site/.docusaurus
          docs-site/node_modules/.cache
        # PR-mode builds skip 40 historical version snapshots, so they
        # have a different .docusaurus/ shape than full deploy builds.
        # Keep their caches in separate namespaces to avoid each
        # poisoning the other on restore.
        key: docusaurus-pr-${{ runner.os }}-${{ hashFiles('docs-site/src/**', 'docs-site/docs/**', 'docs-site/docusaurus.config.ts', 'docs-site/package-lock.json') }}
        restore-keys: |
          docusaurus-pr-${{ runner.os }}-

    - name: Build Docusaurus site
      working-directory: docs-site
      env:
        # Skip 40 historical versioned_docs snapshots on PR builds —
        # only build the latest documented version. docs.yml (release
        # deploy) does not set this and builds the full version matrix.
        DOCS_PR_MODE: '1'
      run: npm run build

    - name: Write build summary
      if: always()
      run: |
        if [ -d docs-site/build ]; then
          SIZE=$(du -sh docs-site/build | cut -f1)
          FILES=$(find docs-site/build -type f | wc -l | tr -d ' ')
          {
            echo "## Build Docs"
            echo ""
            echo "| Metric | Value |"
            echo "|---|---|"
            echo "| Build size | ${SIZE} |"
            echo "| Files | ${FILES} |"
          } >> "$GITHUB_STEP_SUMMARY"
        fi

  # Docs quality gate: spell-check, markdown-lint, and frontmatter-lint over
  # all repository markdown (config: cspell.json, .markdownlint-cli2.jsonc).
  # Runs on its own Node 22 because cspell 10 requires Node >= 22.18, whereas
  # the docs-site jobs (lint-docs, build-docs) pin Node 20.
  lint-markdown:
    name: Lint Markdown
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.markdown == 'true' || needs.detect-changes.outputs.shared == 'true'
    timeout-minutes: 5

    steps:
    - uses: actions/checkout@v7

    - name: Set up Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: package-lock.json

    - name: Install docs lint tooling
      run: npm ci

    - name: Validate docs frontmatter
      run: npm run docs:lint:frontmatter

    - name: Lint markdown
      run: npm run docs:lint:markdown

    - name: Spell check
      run: npm run docs:lint:spell

  # Repo-wide broken-link check for the GitHub-rendered markdown (docs/**,
  # plugins/**, root *.md). The published Docusaurus site (docs-site/**) is
  # excluded here and validated by build-docs (onBrokenLinks: 'throw'), the
  # only checker that understands Docusaurus routing. Config: lychee.toml.
  link-check:
    name: Check Markdown Links
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.markdown == 'true' || needs.detect-changes.outputs.shared == 'true'
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v7

    - name: Check links with lychee
      uses: lycheeverse/lychee-action@v2
      with:
        args: >-
          --config lychee.toml
          'docs/**/*.md'
          'plugins/*/README.md'
          'plugins/*/docs/**/*.md'
          README.md CONTRIBUTING.md SECURITY.md CODE_OF_CONDUCT.md DOCKERHUB_README.md
        fail: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [detect-changes, dependency-review, test-platform, test-plugins, lint-web, lint-docs, test-ui, a11y-tests, build-test-image, e2e-tests, ai-mcp-e2e-tests, auth-e2e-tests, build, build-docs, lint-markdown, link-check]
    if: always()
    steps:
      - name: Check all jobs passed or were skipped
        # Names line up positionally with `needs:` above. If you add/remove
        # a needs entry, update this list too — keeping them in sync is
        # what lets the summary tell the reviewer which job failed.
        env:
          NAMES: |
            detect-changes
            dependency-review
            test-platform
            test-plugins
            lint-web
            lint-docs
            test-ui
            a11y-tests
            build-test-image
            e2e-tests
            ai-mcp-e2e-tests
            auth-e2e-tests
            build
            build-docs
            lint-markdown
            link-check
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          names = [n for n in os.environ["NAMES"].split() if n]
          results = json.loads(os.environ["RESULTS"])
          if len(names) != len(results):
              print(f"::error::ci-success: name/result length mismatch "
                    f"({len(names)} names vs {len(results)} results) — "
                    f"update the NAMES list to match needs:", file=sys.stderr)
              sys.exit(1)

          rows = list(zip(names, results))
          failed = [n for n, r in rows if r in ("failure", "cancelled")]

          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a") as fh:
                  fh.write("## CI job results\n\n")
                  fh.write("| Job | Result |\n|---|---|\n")
                  icon = {"success": "✅", "skipped": "⏭️",
                          "failure": "❌", "cancelled": "🚫"}
                  for n, r in rows:
                      fh.write(f"| {n} | {icon.get(r, '❓')} {r} |\n")

          if failed:
              print(f"::error::Failed/cancelled jobs: {', '.join(failed)}")
              sys.exit(1)
          print("All CI jobs passed or were skipped.")
          PY
