name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    # Run on all PRs regardless of target branch (validate before merge)
    branches: [ '**' ]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  detect-changes:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      ui: ${{ steps.filter.outputs.ui }}
      plugins: ${{ steps.filter.outputs.plugins }}
      shared: ${{ steps.filter.outputs.shared }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          filters: |
            api:
              - 'src/**'
              - 'requirements.txt'
              - 'requirements-dev.txt'
              - 'Dockerfile'
              - 'start-dev.sh'
              - 'tests/**'
              - '.pylintrc'
            ui:
              - 'web/**'
              - 'Dockerfile'
              - 'nginx.conf'
              - 'start-dev.sh'
            plugins:
              - 'plugins/**'
            shared:
              - 'docker-compose*.yml'
              - '.github/workflows/**'
              - 'package.json'
              - 'scripts/version-sync.js'
            docs:
              - 'docs-site/**'

  test-platform:
    name: Platform Tests
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.api == 'true' || needs.detect-changes.outputs.shared == 'true'
    timeout-minutes: 10
    
    steps:
    - uses: actions/checkout@v6
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v6
      with:
        python-version: "3.11"
        cache: 'pip'
        cache-dependency-path: |
          requirements.txt
          requirements-dev.txt
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
    
    - name: Verify imports
      run: |
        python -c "import sys; sys.path.insert(0, '.'); from src import config, board_client, board_chars; print('✅ Core imports successful')"
        python -c "import sys; sys.path.insert(0, '.'); from src.utils import weather, datetime, home_assistant, star_trek_quotes; print('✅ Utils imports successful')"
        python -c "import sys; sys.path.insert(0, '.'); from src.formatters import message_formatter; print('✅ Formatter imports successful')"
        python -c "import sys; sys.path.insert(0, '.'); from src.main import FiestaBoardDisplayService; print('✅ Main module imports successful')"
        python -c "
        import sys; sys.path.insert(0, '.')
        from src.config import Config
        from src.board_chars import BoardChars
        print('✅ Config and BoardChars can be imported')
        print(f'✅ Config class has required attributes: {hasattr(Config, \"BOARD_READ_WRITE_KEY\")}')
        "
      env:
        BOARD_READ_WRITE_KEY: test_key
        WEATHER_API_KEY: test_key
    
    - name: Run pylint
      run: |
        pylint --version
        pylint src/ --rcfile=.pylintrc || true
      continue-on-error: true
    
    - name: Check code formatting (basic syntax check)
      run: |
        find src -name "*.py" -exec python -m py_compile {} \;
        echo "✅ All Python files compile successfully"
    
    - name: Run platform tests with coverage
      run: |
        # Run tests with coverage, explicitly omitting legacy code
        coverage run --source=src --omit='src/utils/*,src/formatters/*,src/main.py,src/system/*,src/text_to_board.py,src/plugins/testing.py' -m pytest tests/ -v
        coverage xml
        coverage report -m --fail-under=80
      env:
        BOARD_READ_WRITE_KEY: test_key
        WEATHER_API_KEY: test_key
    
    - name: Upload platform coverage
      uses: codecov/codecov-action@v5
      with:
        files: coverage.xml
        flags: platform
        name: platform-coverage
        fail_ci_if_error: false
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  test-plugins:
    name: Plugin Tests
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.plugins == 'true' || needs.detect-changes.outputs.api == 'true' || needs.detect-changes.outputs.shared == 'true'
    timeout-minutes: 10
    
    steps:
    - uses: actions/checkout@v6
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v6
      with:
        python-version: "3.11"
        cache: 'pip'
        cache-dependency-path: |
          requirements.txt
          requirements-dev.txt
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
    
    - name: Validate plugin integrity
      run: |
        echo "Validating plugin manifests and uniqueness..."
        python scripts/validate_plugins.py --verbose
        echo "✅ All plugins validated successfully"
    
    - name: Discover plugins with tests
      id: discover
      run: |
        echo "Discovering plugins with tests..."
        plugins=$(find plugins -maxdepth 2 -type d -name "tests" | sed 's|/tests||' | sed 's|plugins/||' | grep -v "^_" || true)
        if [ -z "$plugins" ]; then
          echo "No plugins with tests found"
          echo "has_plugins=false" >> $GITHUB_OUTPUT
        else
          echo "Found plugins with tests:"
          echo "$plugins"
          echo "has_plugins=true" >> $GITHUB_OUTPUT
        fi
    
    - name: Run plugin tests with coverage
      if: steps.discover.outputs.has_plugins == 'true'
      run: |
        python scripts/run_plugin_tests.py --verbose
        # Combine per-plugin coverage data and generate XML for Codecov
        coverage combine || true
        coverage xml -o coverage-plugins.xml || true
      env:
        BOARD_READ_WRITE_KEY: test_key
        WEATHER_API_KEY: test_key
    
    - name: Upload plugin coverage
      if: steps.discover.outputs.has_plugins == 'true'
      uses: codecov/codecov-action@v5
      with:
        files: coverage-plugins.xml
        flags: plugins
        name: plugin-coverage
        fail_ci_if_error: false
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  test-ui:
    name: UI Tests
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.ui == 'true' || needs.detect-changes.outputs.shared == 'true'
    timeout-minutes: 10
    
    steps:
    - uses: actions/checkout@v6
    
    - name: Set up Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: web/package-lock.json
    
    - name: Install UI dependencies
      working-directory: web
      run: npm ci
    
    - name: Run UI tests with coverage
      working-directory: web
      run: npm run test:coverage

    - name: Upload UI coverage
      uses: codecov/codecov-action@v5
      with:
        files: web/coverage/lcov.info
        flags: ui
        name: ui-coverage
        fail_ci_if_error: false
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  a11y-tests:
    name: Accessibility Tests
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.ui == 'true' || needs.detect-changes.outputs.shared == 'true'
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v6

    - name: Set up Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: web/package-lock.json

    - name: Install dependencies
      working-directory: web
      run: npm ci

    - name: Cache Playwright browsers
      uses: actions/cache@v5
      with:
        path: ~/.cache/ms-playwright
        key: playwright-a11y-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}

    - name: Install Playwright browsers
      working-directory: web
      run: npx playwright install --with-deps chromium

    - name: Build Storybook
      working-directory: web
      run: npm run build-storybook -- --quiet

    - name: Start Storybook static server
      working-directory: web
      run: |
        npx http-server storybook-static --port 6006 --silent &
        sleep 5

    - name: Run Storybook a11y tests (dark theme)
      working-directory: web
      run: npm run test-storybook:ci -- --url http://localhost:6006

    - name: Run Storybook a11y tests (light theme)
      working-directory: web
      run: npm run test-storybook:ci -- --url "http://localhost:6006?globals=theme:light"

  e2e-tests:
    name: E2E Tests
    runs-on:
      - codebuild-Fiestaboard-${{ github.run_id }}-${{ github.run_attempt }}
    needs: detect-changes
    if: github.event_name == 'pull_request' && (needs.detect-changes.outputs.api == 'true' || needs.detect-changes.outputs.ui == 'true' || needs.detect-changes.outputs.shared == 'true')
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # ── Cache restores ────────────────────────────────────────────
      # Docker images cache includes both fiestaboard:e2e and python:3.11-slim
      # so mock board containers start instantly without a network pull.
      - name: Cache Docker images
        id: docker-cache
        uses: actions/cache@v5
        with:
          path: /tmp/docker-images.tar.gz
          key: docker-images-e2e-${{ hashFiles('Dockerfile', 'requirements.txt', 'src/**', 'web/**', 'plugins/**', 'tests/**', 'nginx.conf', 'supervisord.conf', 'supervisord-dev.conf', 'entrypoint.sh') }}

      # Cache node_modules directly so npm ci can be skipped entirely on hit.
      - name: Cache node_modules
        id: node-cache
        uses: actions/cache@v5
        with:
          path: web/node_modules
          key: e2e-node-modules-${{ hashFiles('web/package-lock.json') }}

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}

      # ── Parallel setup ────────────────────────────────────────────
      # Run Docker image load, npm ci, and Playwright install concurrently
      # to overlap I/O-bound operations and cut ~30-60s from startup.
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Load images and install deps (parallel)
        run: |
          # Docker image load in background (includes app + python:3.11-slim)
          if [ -f /tmp/docker-images.tar.gz ]; then
            (docker load -i /tmp/docker-images.tar.gz \
              && docker tag fiestaboard:cached fiestaboard:e2e \
              && echo "✅ Docker images loaded from cache") &
            DOCKER_PID=$!
          fi

          # npm ci in background (skip entirely if node_modules cached)
          if [ "${{ steps.node-cache.outputs.cache-hit }}" != "true" ]; then
            (cd web && npm ci && echo "✅ npm ci complete") &
            NPM_PID=$!
          else
            echo "✅ node_modules restored from cache"
          fi

          # Playwright system deps (always needed on fresh runner)
          cd web
          npx playwright install-deps chromium > /dev/null
          echo "✅ Playwright system deps installed"

          # Wait for npm before Playwright browser install (needs node_modules)
          [ -n "${NPM_PID:-}" ] && { wait $NPM_PID || { echo "❌ npm ci failed"; exit 1; }; }

          # Playwright browsers (skip download if cached)
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" != "true" ]; then
            npx playwright install chromium
            echo "✅ Playwright browsers installed"
          else
            echo "✅ Playwright browsers restored from cache"
          fi

          # Wait for Docker load
          [ -n "${DOCKER_PID:-}" ] && { wait $DOCKER_PID || { echo "❌ Docker image load failed"; exit 1; }; }
          echo "✅ All parallel setup complete"

      # ── Build Docker image (only on cache miss) ───────────────────
      - name: Set up Docker Buildx
        if: steps.docker-cache.outputs.cache-hit != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: steps.docker-cache.outputs.cache-hit != 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build test image
        if: steps.docker-cache.outputs.cache-hit != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: fiestaboard:e2e
          build-args: |
            VERSION=dev
          cache-from: type=gha,scope=build-test
          cache-to: type=gha,mode=max,scope=build-test

      # Save both app image and python:3.11-slim into a single cache file
      # so subsequent runs never need to pull the mock board base image.
      - name: Save Docker images for caching
        if: steps.docker-cache.outputs.cache-hit != 'true'
        run: |
          docker image inspect python:3.11-slim > /dev/null 2>&1 || docker pull python:3.11-slim
          docker tag fiestaboard:e2e fiestaboard:cached
          docker save fiestaboard:cached python:3.11-slim | gzip > /tmp/docker-images.tar.gz

      # ── Start containers ──────────────────────────────────────────
      - name: Start 4 mock board + FiestaBoard containers
        run: |
          WORKER_COUNT=4
          WORKER_URLS=""
          WORKER_MOCK_URLS=""
          WORKER_MOCK_HOSTS=""

          for i in $(seq 0 $((WORKER_COUNT - 1))); do
            docker run -d --name mock-board-$i \
              -v ${{ github.workspace }}/integration-tests/mock-board:/app:ro \
              -w /app \
              python:3.11-slim python server.py

            docker run -d --name fiestaboard-$i \
              -e PRODUCTION=false \
              fiestaboard:e2e
          done

          for i in $(seq 0 $((WORKER_COUNT - 1))); do
            FB_IP=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' fiestaboard-$i)
            MOCK_IP=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' mock-board-$i)

            [ -n "$WORKER_URLS" ] && WORKER_URLS="$WORKER_URLS,"
            [ -n "$WORKER_MOCK_URLS" ] && WORKER_MOCK_URLS="$WORKER_MOCK_URLS,"
            [ -n "$WORKER_MOCK_HOSTS" ] && WORKER_MOCK_HOSTS="$WORKER_MOCK_HOSTS,"

            WORKER_URLS="${WORKER_URLS}http://$FB_IP:3000"
            WORKER_MOCK_URLS="${WORKER_MOCK_URLS}http://$MOCK_IP:7000"
            WORKER_MOCK_HOSTS="${WORKER_MOCK_HOSTS}$MOCK_IP"

            echo "Worker $i: FiestaBoard=$FB_IP, MockBoard=$MOCK_IP"
          done

          echo "WORKER_URLS=$WORKER_URLS" >> $GITHUB_ENV
          echo "WORKER_MOCK_URLS=$WORKER_MOCK_URLS" >> $GITHUB_ENV
          echo "WORKER_MOCK_HOSTS=$WORKER_MOCK_HOSTS" >> $GITHUB_ENV

      - name: Wait for all containers to be ready
        run: |
          IFS=',' read -ra URLS <<< "$WORKER_URLS"
          for url in "${URLS[@]}"; do
            echo "Waiting for $url..."
            for i in $(seq 1 60); do
              STATUS=$(curl -s -m 5 -o /dev/null -w "%{http_code}" "$url/api/health" 2>/dev/null || echo "000")
              if [ "$STATUS" = "200" ]; then
                echo "  Ready (attempt $i)"
                break
              fi
              if [ "$i" = "60" ]; then
                echo "  ❌ Failed to become ready"
                exit 1
              fi
              sleep 1
            done
          done

      # ── Run tests ─────────────────────────────────────────────────
      - name: Run E2E tests
        working-directory: web
        run: npx playwright test --reporter=github
        env:
          CI: true
          WORKER_URLS: ${{ env.WORKER_URLS }}
          WORKER_MOCK_URLS: ${{ env.WORKER_MOCK_URLS }}
          WORKER_MOCK_HOSTS: ${{ env.WORKER_MOCK_HOSTS }}

      - name: Stop containers
        if: always()
        run: |
          for i in 0 1 2 3; do
            docker rm -f fiestaboard-$i mock-board-$i 2>/dev/null || true
          done

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-results
          path: web/playwright-test-results/
          retention-days: 7

  build:
    name: Build Verification
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.api == 'true' || needs.detect-changes.outputs.ui == 'true' || needs.detect-changes.outputs.shared == 'true'
    timeout-minutes: 5
    
    steps:
    - uses: actions/checkout@v6
    
    - name: Verify package structure
      run: |
        echo "Checking package structure..."
        test -d src || (echo "❌ src directory missing" && exit 1)
        test -f src/__init__.py || (echo "❌ src/__init__.py missing" && exit 1)
        test -f src/main.py || (echo "❌ src/main.py missing" && exit 1)
        test -f src/config.py || (echo "❌ src/config.py missing" && exit 1)
        echo "✅ Package structure is valid"
    
    - name: Verify plugin structure
      run: |
        echo "Checking plugin structure..."
        test -d plugins || (echo "❌ plugins directory missing" && exit 1)
        # Verify each plugin has required files
        for plugin in plugins/*/; do
          plugin_name=$(basename "$plugin")
          if [ "$plugin_name" != "_template" ] && [ -d "$plugin" ]; then
            echo "Checking plugin: $plugin_name"
            test -f "$plugin/__init__.py" || (echo "❌ $plugin_name/__init__.py missing" && exit 1)
            test -f "$plugin/manifest.json" || (echo "❌ $plugin_name/manifest.json missing" && exit 1)
            echo "  ✅ $plugin_name structure valid"
          fi
        done
        echo "✅ All plugin structures valid"

  build-docs:
    name: Build Docs
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.docs == 'true' || needs.detect-changes.outputs.shared == 'true'
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v6

    - name: Set up Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: docs-site/package-lock.json

    - name: Install dependencies
      working-directory: docs-site
      run: npm ci

    - name: Build Docusaurus site
      working-directory: docs-site
      run: npm run build
