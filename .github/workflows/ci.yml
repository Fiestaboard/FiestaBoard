name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    # Run on all PRs regardless of target branch (validate before merge)
    branches: [ '**' ]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  detect-changes:
    name: Detect Changed Paths
    runs-on:
      - codebuild-Fiestaboard-${{ github.run_id }}-${{ github.run_attempt }}
    outputs:
      api: ${{ steps.filter.outputs.api }}
      ui: ${{ steps.filter.outputs.ui }}
      plugins: ${{ steps.filter.outputs.plugins }}
      shared: ${{ steps.filter.outputs.shared }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          filters: |
            api:
              - 'src/**'
              - 'requirements.txt'
              - 'requirements-dev.txt'
              - 'Dockerfile'
              - 'start-dev.sh'
              - 'tests/**'
              - '.pylintrc'
            ui:
              - 'web/**'
              - 'Dockerfile'
              - 'nginx.conf'
              - 'start-dev.sh'
            plugins:
              - 'plugins/**'
            shared:
              - 'docker-compose*.yml'
              - '.github/workflows/**'
              - 'package.json'
              - 'scripts/version-sync.js'
            docs:
              - 'docs-site/**'

  test-platform:
    name: Platform Tests
    runs-on:
      - codebuild-Fiestaboard-${{ github.run_id }}-${{ github.run_attempt }}
    needs: detect-changes
    if: needs.detect-changes.outputs.api == 'true' || needs.detect-changes.outputs.shared == 'true'
    timeout-minutes: 10
    
    steps:
    - uses: actions/checkout@v6
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v6
      with:
        python-version: "3.11"
        cache: 'pip'
        cache-dependency-path: |
          requirements.txt
          requirements-dev.txt
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
    
    - name: Verify imports
      run: |
        python -c "import sys; sys.path.insert(0, '.'); from src import config, board_client, board_chars; print('✅ Core imports successful')"
        python -c "import sys; sys.path.insert(0, '.'); from src.utils import weather, datetime, home_assistant, star_trek_quotes; print('✅ Utils imports successful')"
        python -c "import sys; sys.path.insert(0, '.'); from src.formatters import message_formatter; print('✅ Formatter imports successful')"
        python -c "import sys; sys.path.insert(0, '.'); from src.main import FiestaBoardDisplayService; print('✅ Main module imports successful')"
        python -c "
        import sys; sys.path.insert(0, '.')
        from src.config import Config
        from src.board_chars import BoardChars
        print('✅ Config and BoardChars can be imported')
        print(f'✅ Config class has required attributes: {hasattr(Config, \"BOARD_READ_WRITE_KEY\")}')
        "
      env:
        BOARD_READ_WRITE_KEY: test_key
        WEATHER_API_KEY: test_key
    
    - name: Run pylint
      run: |
        pylint --version
        pylint src/ --rcfile=.pylintrc || true
      continue-on-error: true
    
    - name: Check code formatting (basic syntax check)
      run: |
        find src -name "*.py" -exec python -m py_compile {} \;
        echo "✅ All Python files compile successfully"
    
    - name: Run platform tests with coverage
      run: |
        # Run tests with coverage, explicitly omitting legacy code
        coverage run --source=src --omit='src/utils/*,src/formatters/*,src/main.py,src/system/*,src/text_to_board.py,src/plugins/testing.py' -m pytest tests/ -v
        coverage xml
        coverage report -m --fail-under=80
      env:
        BOARD_READ_WRITE_KEY: test_key
        WEATHER_API_KEY: test_key
    
    - name: Upload platform coverage
      uses: codecov/codecov-action@v5
      with:
        files: coverage.xml
        flags: platform
        name: platform-coverage
        fail_ci_if_error: false
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  test-plugins:
    name: Plugin Tests
    runs-on:
      - codebuild-Fiestaboard-${{ github.run_id }}-${{ github.run_attempt }}
    needs: detect-changes
    if: needs.detect-changes.outputs.plugins == 'true' || needs.detect-changes.outputs.api == 'true' || needs.detect-changes.outputs.shared == 'true'
    timeout-minutes: 10
    
    steps:
    - uses: actions/checkout@v6
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v6
      with:
        python-version: "3.11"
        cache: 'pip'
        cache-dependency-path: |
          requirements.txt
          requirements-dev.txt
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
    
    - name: Validate plugin integrity
      run: |
        echo "Validating plugin manifests and uniqueness..."
        python scripts/validate_plugins.py --verbose
        echo "✅ All plugins validated successfully"
    
    - name: Discover plugins with tests
      id: discover
      run: |
        echo "Discovering plugins with tests..."
        plugins=$(find plugins -maxdepth 2 -type d -name "tests" | sed 's|/tests||' | sed 's|plugins/||' | grep -v "^_" || true)
        if [ -z "$plugins" ]; then
          echo "No plugins with tests found"
          echo "has_plugins=false" >> $GITHUB_OUTPUT
        else
          echo "Found plugins with tests:"
          echo "$plugins"
          echo "has_plugins=true" >> $GITHUB_OUTPUT
        fi
    
    - name: Run plugin tests with coverage
      if: steps.discover.outputs.has_plugins == 'true'
      run: |
        python scripts/run_plugin_tests.py --verbose
        # Combine per-plugin coverage data and generate XML for Codecov
        coverage combine || true
        coverage xml -o coverage-plugins.xml || true
      env:
        BOARD_READ_WRITE_KEY: test_key
        WEATHER_API_KEY: test_key
    
    - name: Upload plugin coverage
      if: steps.discover.outputs.has_plugins == 'true'
      uses: codecov/codecov-action@v5
      with:
        files: coverage-plugins.xml
        flags: plugins
        name: plugin-coverage
        fail_ci_if_error: false
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  test-ui:
    name: UI Tests
    runs-on:
      - codebuild-Fiestaboard-${{ github.run_id }}-${{ github.run_attempt }}
    needs: detect-changes
    if: needs.detect-changes.outputs.ui == 'true' || needs.detect-changes.outputs.shared == 'true'
    timeout-minutes: 10
    
    steps:
    - uses: actions/checkout@v6
    
    - name: Set up Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: web/package-lock.json
    
    - name: Install UI dependencies
      working-directory: web
      run: npm ci
    
    - name: Run UI tests with coverage
      working-directory: web
      run: npm run test:coverage

    - name: Upload UI coverage
      uses: codecov/codecov-action@v5
      with:
        files: web/coverage/lcov.info
        flags: ui
        name: ui-coverage
        fail_ci_if_error: false
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  a11y-tests:
    name: Accessibility Tests
    runs-on:
      - codebuild-Fiestaboard-${{ github.run_id }}-${{ github.run_attempt }}
    needs: detect-changes
    if: needs.detect-changes.outputs.ui == 'true' || needs.detect-changes.outputs.shared == 'true'
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v6

    - name: Set up Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: web/package-lock.json

    - name: Install dependencies
      working-directory: web
      run: npm ci

    - name: Cache Playwright browsers
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-a11y-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}

    - name: Install Playwright browsers
      working-directory: web
      run: npx playwright install --with-deps chromium

    - name: Build Storybook
      working-directory: web
      run: npm run build-storybook -- --quiet

    - name: Start Storybook static server
      working-directory: web
      run: |
        npx http-server storybook-static --port 6006 --silent &
        sleep 5

    - name: Run Storybook a11y tests (dark theme)
      working-directory: web
      run: npm run test-storybook:ci -- --url http://localhost:6006

    - name: Run Storybook a11y tests (light theme)
      working-directory: web
      run: npm run test-storybook:ci -- --url "http://localhost:6006?globals=theme:light"

  e2e-tests:
    name: E2E Tests
    runs-on:
      - codebuild-Fiestaboard-${{ github.run_id }}-${{ github.run_attempt }}
      - instance-size:large
    needs: detect-changes
    if: github.event_name == 'pull_request' && (needs.detect-changes.outputs.api == 'true' || needs.detect-changes.outputs.ui == 'true' || needs.detect-changes.outputs.shared == 'true')
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Cache Docker image
        id: docker-cache
        uses: actions/cache@v4
        with:
          path: /tmp/docker-image.tar.gz
          key: docker-image-test-${{ hashFiles('Dockerfile', 'requirements.txt', 'src/**', 'web/**', 'plugins/**', 'tests/**', 'nginx.conf', 'supervisord.conf', 'supervisord-dev.conf', 'entrypoint.sh') }}

      - name: Load cached Docker image
        if: steps.docker-cache.outputs.cache-hit == 'true'
        run: |
          docker load -i /tmp/docker-image.tar.gz
          docker tag fiestaboard:cached fiestaboard:e2e
          echo "✅ Loaded cached Docker image (skipped rebuild)"

      - name: Set up Docker Buildx
        if: steps.docker-cache.outputs.cache-hit != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build test image
        if: steps.docker-cache.outputs.cache-hit != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: fiestaboard:e2e
          build-args: |
            VERSION=dev
          cache-from: type=gha,scope=build-test
          cache-to: type=gha,mode=max,scope=build-test

      - name: Save Docker image for caching
        if: steps.docker-cache.outputs.cache-hit != 'true'
        run: |
          docker tag fiestaboard:e2e fiestaboard:cached
          docker save fiestaboard:cached | gzip > /tmp/docker-image.tar.gz

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install UI dependencies
        working-directory: web
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}

      - name: Install Playwright browsers
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Start mock Vestaboard API
        run: |
          docker run -d --name mock-board \
            -v ${{ github.workspace }}/integration-tests/mock-board:/app:ro \
            -w /app \
            python:3.11-slim python server.py
          sleep 2
          MOCK_IP=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' mock-board)
          echo "Mock board IP: $MOCK_IP"
          echo "MOCK_BOARD_IP=$MOCK_IP" >> $GITHUB_ENV

      - name: Start FiestaBoard container (unified app, same as prod)
        run: |
          docker run -d --name fiestaboard-e2e \
            -e PRODUCTION=false \
            fiestaboard:e2e

          CONTAINER_IP=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' fiestaboard-e2e)
          echo "Container IP: $CONTAINER_IP"
          echo "CONTAINER_URL=http://$CONTAINER_IP:3000" >> $GITHUB_ENV

          echo "Waiting for app at $CONTAINER_IP:3000..."
          READY=false
          for i in $(seq 1 60); do
            STATUS=$(curl -s -m 5 -o /dev/null -w "%{http_code}" "http://$CONTAINER_IP:3000/api/health" 2>/dev/null || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "App ready (attempt $i)"
              READY=true
              break
            fi
            if [ "$((i % 10))" = "0" ]; then
              echo "  Still waiting... (attempt $i, last status: $STATUS)"
            fi
            sleep 1
          done
          if [ "$READY" != "true" ]; then
            echo "❌ App failed to become ready after 60 seconds"
            echo "Last status code: $STATUS"
            echo "=== Container logs ==="
            docker logs fiestaboard-e2e
            echo "=== API logs ==="
            docker exec fiestaboard-e2e cat /app/data/logs/api.log 2>/dev/null || echo "(no api logs)"
            docker exec fiestaboard-e2e cat /app/data/logs/api-error.log 2>/dev/null || echo "(no api error logs)"
            echo "=== Nginx logs ==="
            docker exec fiestaboard-e2e cat /app/data/logs/nginx-error.log 2>/dev/null || echo "(no nginx error logs)"
            exit 1
          fi

      - name: Run E2E tests
        working-directory: web
        run: npx playwright test --reporter=github
        env:
          CI: true
          BASE_URL: ${{ env.CONTAINER_URL }}
          MOCK_BOARD_HOST: ${{ env.MOCK_BOARD_IP }}
          MOCK_BOARD_URL: http://${{ env.MOCK_BOARD_IP }}:7000

      - name: Stop containers
        if: always()
        run: docker rm -f fiestaboard-e2e mock-board 2>/dev/null || true

      - name: Upload test results
        uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: playwright-results
          path: web/playwright-test-results/
          retention-days: 7

  build:
    name: Build Verification
    runs-on:
      - codebuild-Fiestaboard-${{ github.run_id }}-${{ github.run_attempt }}
    needs: detect-changes
    if: needs.detect-changes.outputs.api == 'true' || needs.detect-changes.outputs.ui == 'true' || needs.detect-changes.outputs.shared == 'true'
    timeout-minutes: 5
    
    steps:
    - uses: actions/checkout@v6
    
    - name: Verify package structure
      run: |
        echo "Checking package structure..."
        test -d src || (echo "❌ src directory missing" && exit 1)
        test -f src/__init__.py || (echo "❌ src/__init__.py missing" && exit 1)
        test -f src/main.py || (echo "❌ src/main.py missing" && exit 1)
        test -f src/config.py || (echo "❌ src/config.py missing" && exit 1)
        echo "✅ Package structure is valid"
    
    - name: Verify plugin structure
      run: |
        echo "Checking plugin structure..."
        test -d plugins || (echo "❌ plugins directory missing" && exit 1)
        # Verify each plugin has required files
        for plugin in plugins/*/; do
          plugin_name=$(basename "$plugin")
          if [ "$plugin_name" != "_template" ] && [ -d "$plugin" ]; then
            echo "Checking plugin: $plugin_name"
            test -f "$plugin/__init__.py" || (echo "❌ $plugin_name/__init__.py missing" && exit 1)
            test -f "$plugin/manifest.json" || (echo "❌ $plugin_name/manifest.json missing" && exit 1)
            echo "  ✅ $plugin_name structure valid"
          fi
        done
        echo "✅ All plugin structures valid"

  build-docs:
    name: Build Docs
    runs-on:
      - codebuild-Fiestaboard-${{ github.run_id }}-${{ github.run_attempt }}
    needs: detect-changes
    if: needs.detect-changes.outputs.docs == 'true' || needs.detect-changes.outputs.shared == 'true'
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v6

    - name: Set up Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: docs-site/package-lock.json

    - name: Install dependencies
      working-directory: docs-site
      run: npm ci

    - name: Build Docusaurus site
      working-directory: docs-site
      run: npm run build
