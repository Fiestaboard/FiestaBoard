name: Build FiestaPi image

# =============================================================================
# Builds the flashable FiestaPi .img.xz — a slow job (~45-60 min), so we
# only run it when it matters:
#
#   1. On major-version tags (v5.0.0, v6.0.0, …) — the milestone releases
#      where a "fresh start" image makes sense. Minor/patch users are served
#      by the in-app self-updater instead.
#
#   2. Weekly (Tuesdays, 06:00 UTC) — keeps base OS packages and
#      the Docker layer cache fresh between major releases.
#
#   3. Manual dispatch — for one-off builds during development or hot-patches.
# =============================================================================

on:
  push:
    tags:
      # Only major-version tags: v5.0.0, v6.0.0, etc.
      # Pattern matches vN.0.0 — does NOT fire on minor/patch releases.
      - 'v[0-9]+.0.0'
  schedule:
    - cron: '0 6 * * 2'  # 06:00 UTC every Tuesday
  workflow_dispatch:

permissions:
  contents: write  # to upload to releases

jobs:
  build:
    name: Build .img.xz with pi-gen
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout FiestaBoard
        uses: actions/checkout@v6
        with:
          path: FiestaBoard

      - name: Checkout pi-gen
        uses: actions/checkout@v6
        with:
          repository: RPi-Distro/pi-gen
          ref: arm64
          path: pi-gen

      - name: Wire FiestaBoard stage into pi-gen
        run: |
          cd pi-gen
          ln -s "$GITHUB_WORKSPACE/FiestaBoard/pi-image/stage-fiestaboard" stage-fiestaboard
          cp "$GITHUB_WORKSPACE/FiestaBoard/pi-image/config" config
          # Skip stages we don't ship (desktop, applications).
          # stage2/SKIP_IMAGES prevents a second image from being exported
          # (we export from stage-fiestaboard via its EXPORT_IMAGE file).
          touch ./stage2/SKIP_IMAGES ./stage3/SKIP ./stage3/SKIP_IMAGES ./stage4/SKIP ./stage4/SKIP_IMAGES ./stage5/SKIP ./stage5/SKIP_IMAGES || true

      - name: Determine version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            # Weekly builds labelled by year-week so the filename is
            # meaningful (e.g. fiestapi-2026-W18-arm64.img.xz).
            VERSION="$(date -u +%Y-W%V)"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build image
        run: |
          cd pi-gen
          # build-docker.sh runs the whole pi-gen pipeline inside a
          # privileged Docker container.  This is the supported path on CI.
          sudo ./build-docker.sh

      - name: Locate output
        id: out
        run: |
          IMG=$(find pi-gen/deploy -name '*.img.xz' | head -n1)
          test -n "$IMG"
          echo "img=$IMG" >> "$GITHUB_OUTPUT"
          echo "Found image: $IMG"

      - name: Upload as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: fiestapi-${{ steps.version.outputs.version }}-arm64
          path: ${{ steps.out.outputs.img }}
          # 30 days — weekly builds rotate frequently; grab the latest.
          retention-days: 30

      - name: Attach to release (major-version tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.out.outputs.img }}

      - name: Update latest-version file in docs (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
        run: |
          # Checkout the main branch of FiestaBoard so we can commit to it.
          cd "$GITHUB_WORKSPACE/FiestaBoard"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B main origin/main

          # Write the new version so the docs site can display it.
          echo "${{ steps.version.outputs.version }}" > docs-site/static/fiestapi-latest-version.txt

          git add docs-site/static/fiestapi-latest-version.txt
          git diff --cached --quiet && echo "No change, skipping commit." && exit 0
          git commit -m "chore: update FiestaPi latest version to ${{ steps.version.outputs.version }} [skip ci]"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" main
