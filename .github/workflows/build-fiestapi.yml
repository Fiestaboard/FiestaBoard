name: Build FiestaPi image

# =============================================================================
# Builds the flashable FiestaPi .img.xz — a slow job (~45-60 min), so we
# only run it when it matters:
#
#   1. After every app release (workflow_run on "Release and Publish") —
#      the image is attached to that release's assets automatically.
#
#   2. On major-version tags (v5.0.0, v6.0.0, …) — fallback/manual path
#      for milestone releases pushed directly by tag.
#
#   3. Weekly (Tuesdays, 06:00 UTC) — keeps base OS packages and
#      the Docker layer cache fresh between releases.
#
#   4. Manual dispatch — for one-off builds during development or hot-patches.
# =============================================================================

on:
  workflow_run:
    workflows: ["Release and Publish"]
    types: [completed]
  push:
    tags:
      # Only major-version tags: v5.0.0, v6.0.0, etc.
      # Pattern matches vN.0.0 — does NOT fire on minor/patch releases.
      - 'v[0-9]+.0.0'
  schedule:
    - cron: '0 6 * * 2'  # 06:00 UTC every Tuesday
  workflow_dispatch:

permissions:
  contents: write  # to upload to releases

jobs:
  build:
    name: Build .img.xz with pi-gen
    # Native arm64 runner — pi-gen's arm64 branch builds the image directly
    # without qemu/binfmt emulation, which is both faster and avoids the
    # flaky qemu setup that previously failed on ubuntu-latest (amd64).
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    # For workflow_run triggers, only proceed if the upstream workflow succeeded.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout FiestaBoard
        uses: actions/checkout@v6
        with:
          path: FiestaBoard

      - name: Checkout pi-gen
        uses: actions/checkout@v6
        with:
          repository: RPi-Distro/pi-gen
          ref: arm64
          path: pi-gen

      - name: Free up disk space
        # pi-gen needs ~4 GB of scratch; ubuntu-latest is tight by default.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          sudo docker image prune -af || true
          df -h /

      - name: Set up QEMU (arm64 emulation for pi-gen)
        # pi-gen's build-docker.sh runs `which qemu-aarch64` on the HOST
        # before launching its build container. ubuntu-latest no longer
        # ships qemu-user-static, so we install + register binfmt handlers
        # via the standard Docker action.
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Wire FiestaBoard stage into pi-gen
        run: |
          cd pi-gen
          # Copy (don't symlink) — pi-gen's build-docker.sh runs inside a
          # container that only bind-mounts the pi-gen directory itself,
          # so a symlink to $GITHUB_WORKSPACE/FiestaBoard/... is dangling
          # inside the container and `realpath stage-fiestaboard` fails.
          cp -r "$GITHUB_WORKSPACE/FiestaBoard/pi-image/stage-fiestaboard" stage-fiestaboard
          cp "$GITHUB_WORKSPACE/FiestaBoard/pi-image/config" config
          # Skip stages we don't ship. stage2/SKIP_IMAGES prevents a second
          # image from being exported (we export from stage-fiestaboard via
          # its EXPORT_IMAGE file). Newer pi-gen branches may not have
          # stage3/4/5 — skip those only if present.
          touch ./stage2/SKIP_IMAGES
          for s in stage3 stage4 stage5; do
            if [ -d "./$s" ]; then
              touch "./$s/SKIP" "./$s/SKIP_IMAGES"
            fi
          done

      - name: Sanity-check pi-gen wiring
        run: |
          ls -la pi-gen/stage-fiestaboard/
          echo '--- pi-gen/config ---'
          cat pi-gen/config
          echo '--- stage list dirs ---'
          ls -d pi-gen/stage*/

      - name: Determine version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          elif [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            # Triggered by a release: label the image with that release's version.
            VERSION=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 20 \
                        --json tagName,isDraft,isPrerelease \
                        --jq 'map(select(.isDraft == false and .isPrerelease == false and (.tagName | startswith("v")))) | .[0].tagName | ltrimstr("v")')
            if [[ -z "$VERSION" ]]; then
              echo "::error::Could not determine version from latest release"
              exit 1
            fi
          else
            # Weekly builds labelled by year-week so the filename is
            # meaningful (e.g. FiestaPi-2026-W18-arm64.img.xz).
            VERSION="$(date -u +%Y-W%V)"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build image
        run: |
          cd pi-gen
          # build-docker.sh runs the whole pi-gen pipeline inside a
          # privileged Docker container.  This is the supported path on CI.
          sudo ./build-docker.sh

      - name: Upload pi-gen build logs
        # Always upload so we can debug failed builds — the build step is
        # the most likely place for things to go wrong, and the logs are
        # otherwise discarded with the runner.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pi-gen-build-logs-${{ steps.version.outputs.version || github.run_id }}
          path: |
            pi-gen/deploy/build-docker.log
            pi-gen/deploy/build.log
            pi-gen/work/*/build.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Locate and rename output
        id: out
        run: |
          # build-docker.sh runs as root, so pi-gen/deploy and its contents
          # are root-owned. Reclaim ownership so subsequent steps (checksum,
          # artifact upload, release attach) can read/write without sudo.
          sudo chown -R "$USER:$USER" pi-gen/deploy
          SRC=$(find pi-gen/deploy -name '*.img.xz' | head -n1)
          test -n "$SRC"
          # Rename to a stable, user-facing format. pi-gen's default
          # `image_<date>-fiestapi-lite.img.xz` is ugly and doesn't carry
          # the FiestaBoard version, so the docs have always lied. Land on
          # `FiestaPi-<version>-arm64.img.xz` so the release asset matches
          # what we tell users to download.
          DEST="pi-gen/deploy/FiestaPi-${{ steps.version.outputs.version }}-arm64.img.xz"
          mv "$SRC" "$DEST"
          echo "img=$DEST" >> "$GITHUB_OUTPUT"
          echo "Renamed: $SRC -> $DEST"

      - name: Generate SHA-256 checksum
        id: checksum
        run: |
          IMG="${{ steps.out.outputs.img }}"
          sha256sum "$IMG" > "${IMG}.sha256"
          echo "sha256=${IMG}.sha256" >> "$GITHUB_OUTPUT"
          echo "Checksum:"
          cat "${IMG}.sha256"

      - name: Upload as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: FiestaPi-${{ steps.version.outputs.version }}-arm64
          path: ${{ steps.out.outputs.img }}
          # 30 days — weekly builds rotate frequently; grab the latest.
          retention-days: 30

      - name: Resolve target app release tag
        # Skip on workflow_dispatch from non-default branches: a manual
        # build from a feature branch should produce a verifiable artifact
        # for testing, not pollute a published release page. Dispatch on
        # main remains attached (maintainer hot-patch path).
        if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
        # Every release-attaching build path resolves an existing app release:
        #   - Tag builds (refs/tags/vN.0.0) → attach to that tag's release.
        #   - Weekly cron / dispatch-on-main → attach to the latest published
        #     non-prerelease app release (e.g. v5.1.1).
        # This keeps each app version's release page as the single source
        # of truth for both the code release and its FiestaPi .img.xz.
        id: target_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 20 \
                    --json tagName,isDraft,isPrerelease \
                    --jq 'map(select(.isDraft == false and .isPrerelease == false and (.tagName | startswith("v")))) | .[0].tagName')
          fi
          if [ -z "$TAG" ]; then
            echo "::error::No published release found to attach the FiestaPi image to."
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Will attach FiestaPi image to release: $TAG"

      - name: Attach FiestaPi image to app release
        if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
        # Upload the .img.xz and .sha256 to the resolved release.
        # softprops/action-gh-release@v3 replaces same-named assets in
        # place, so re-running overwrites cleanly. Body is intentionally
        # omitted so the existing app release notes are preserved.
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.target_release.outputs.tag }}
          files: |
            ${{ steps.out.outputs.img }}
            ${{ steps.checksum.outputs.sha256 }}

      - name: Update latest-version file in docs (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
        run: |
          # Checkout the main branch of FiestaBoard so we can commit to it.
          cd "$GITHUB_WORKSPACE/FiestaBoard"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B main origin/main

          # Write the new version so the docs site can display it.
          echo "${{ steps.version.outputs.version }}" > docs-site/static/fiestapi-latest-version.txt

          git add docs-site/static/fiestapi-latest-version.txt
          git diff --cached --quiet && echo "No change, skipping commit." && exit 0
          git commit -m "chore: update FiestaPi latest version to ${{ steps.version.outputs.version }} [skip ci]"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" main
