name: Release and Publish

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'docs-site/**'
      - '.github/**'
      - '.devcontainer/**'
      - '.cursor/**'
      - '.cursorrules'
      - 'images/**'
      - 'LICENSE'
      - 'fiesta-icon.png'

concurrency:
  group: release-publish
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: read
  actions: write
  models: read

jobs:
  # Prevent loop: skip release when this run was triggered by our own version-bump push.
  guard:
    name: Skip if version-bump commit
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - name: Check if trigger was a version-bump commit
        id: check
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          # Skip when head commit is our version-bump or docs-snapshot (avoids loop when push uses RELEASE_PAT and actor is not github-actions[bot])
          if echo "$COMMIT_MSG" | head -1 | grep -qE '^(chore: bump version to |docs: snapshot version )'; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "Skipping: trigger commit is a version-bump commit."
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

  prep:
    name: Prepare Release
    runs-on: ubuntu-latest
    needs: [guard]
    if: needs.guard.outputs.skip != 'true'
    outputs:
      version: ${{ steps.version.outputs.version }}
      release_sha: ${{ steps.commit.outputs.release_sha }}
    steps:
      # Use RELEASE_PAT when branch protection/rulesets block GITHUB_TOKEN from pushing to main.
      # Add repo secret RELEASE_PAT (PAT with repo scope) and allow that user to bypass rules on main.
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Determine version bump type
        id: bump_type
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            // Get the most recent merged PR
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'closed',
              sort: 'updated',
              direction: 'desc',
              per_page: 10
            });
            
            // Find the most recently merged PR
            const mergedPR = prs.find(pr => 
              pr.merged_at && 
              new Date(pr.merged_at) > new Date(Date.now() - 60000) // Within last minute
            );
            
            let bumpType = 'patch'; // default
            
            if (mergedPR) {
              console.log(`Found merged PR #${mergedPR.number}: ${mergedPR.title}`);
              
              const labels = mergedPR.labels.map(l => l.name);
              console.log(`PR labels: ${labels.join(', ')}`);
              
              if (labels.includes('major')) {
                bumpType = 'major';
              } else if (labels.includes('minor')) {
                bumpType = 'minor';
              } else if (labels.includes('patch')) {
                bumpType = 'patch';
              }
            } else {
              console.log('No recently merged PR found, using default: patch');
            }
            
            console.log(`Version bump type: ${bumpType}`);
            
            // Set outputs
            core.setOutput('bump_type', bumpType);
            
            return bumpType;
          result-encoding: string

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sync with latest main
        run: |
          # Ensure we're working with the latest main branch.
          # This handles the case where main has moved forward since the
          # workflow was triggered (e.g., when multiple PRs merge in quick
          # succession or a prior release workflow pushed a version bump).
          git fetch origin main
          git checkout -B main origin/main
          echo "Synced to latest main: $(git rev-parse HEAD)"

      - name: Bump version
        id: version
        run: |
          echo "Bumping version with type: ${{ steps.bump_type.outputs.result }}"
          node scripts/version-sync.js ${{ steps.bump_type.outputs.result }}
          
          # Read the new version from package.json
          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "version=${NEW_VERSION}" >> $GITHUB_OUTPUT
          echo "New version: ${NEW_VERSION}"

      - name: Commit version bump
        id: commit
        run: |
          git add package.json web/package.json src/__init__.py
          git commit -m "chore: bump version to ${{ steps.version.outputs.version }} [skip ci]"

          # Push with retry to handle transient failures or rare race conditions
          for attempt in 1 2 3; do
            if git push origin main; then
              echo "Push succeeded (attempt $attempt)"
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Push failed after 3 attempts"
              exit 1
            fi
            echo "Attempt $attempt failed, pulling latest main and rebasing..."
            git pull --rebase origin main
          done

          echo "release_sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    needs: [prep]
    if: needs.prep.result == 'success'
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prep.outputs.release_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Check if already pushed
        id: check-existing
        run: |
          VERSION="${{ needs.prep.outputs.version }}"
          ARCH="${{ matrix.arch }}"
          EXISTING=$(docker buildx imagetools inspect "fiestaboard/fiestaboard:${VERSION}" --raw 2>/dev/null | \
            jq -r --arg arch "$ARCH" \
            '.manifests[]? | select(.platform.architecture == $arch and .platform.os == "linux") | .digest' \
            2>/dev/null) || true

          if [ -n "$EXISTING" ] && [ "$EXISTING" != "null" ]; then
            echo "fiestaboard/fiestaboard:${VERSION} (${ARCH}) already on Docker Hub — skipping build"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "digest=$EXISTING" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push by digest
        if: steps.check-existing.outputs.skip != 'true'
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            VERSION=${{ needs.prep.outputs.version }}
          cache-from: type=gha,scope=build-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=build-${{ matrix.platform }}
          outputs: type=image,name=fiestaboard/fiestaboard,push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          if [ "${{ steps.check-existing.outputs.skip }}" = "true" ]; then
            digest="${{ steps.check-existing.outputs.digest }}"
          else
            digest="${{ steps.build.outputs.digest }}"
          fi
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge Multi-Platform Image
    runs-on: ubuntu-latest
    needs: [prep, build]
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            -t fiestaboard/fiestaboard:${{ needs.prep.outputs.version }} \
            -t fiestaboard/fiestaboard:latest \
            $(printf 'fiestaboard/fiestaboard@sha256:%s ' *)

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [prep, merge]
    if: always() && needs.prep.result == 'success'
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prep.outputs.release_sha }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        id: create-release
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const version = '${{ needs.prep.outputs.version }}';
            const releaseSha = '${{ needs.prep.outputs.release_sha }}';
            const tagName = `v${version}`;
            
            // Create a tag pointing to the version-bump commit
            try {
              await github.rest.git.createRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `refs/tags/${tagName}`,
                sha: releaseSha
              });
              console.log(`Created tag: ${tagName}`);
            } catch (error) {
              console.log(`Tag ${tagName} may already exist: ${error.message}`);
            }
            
            // Find previous release tag
            let previousTag = null;
            try {
              const { data: releases } = await github.rest.repos.listReleases({
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 1
              });
              if (releases.length > 0) {
                previousTag = releases[0].tag_name;
              }
            } catch (error) {
              console.log(`Could not list previous releases: ${error.message}`);
            }
            
            // Generate release notes using GitHub's API (uses .github/release.yml for categories)
            let autoNotes = '';
            try {
              const notesParams = {
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: tagName,
                target_commitish: releaseSha
              };
              if (previousTag) {
                notesParams.previous_tag_name = previousTag;
              }
              const { data: generated } = await github.rest.repos.generateReleaseNotes(notesParams);
              autoNotes = generated.body;
            } catch (error) {
              console.log(`Could not auto-generate release notes: ${error.message}`);
            }
            
            // Collect change context for AI summary
            let changesContext = '';
            
            if (autoNotes) {
              changesContext += `GitHub auto-generated changelog:\n${autoNotes}\n\n`;
            }
            
            if (previousTag) {
              try {
                const { data: comparison } = await github.rest.repos.compareCommitsWithBasehead({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  basehead: `${previousTag}...${releaseSha}`
                });
                
                const commitMessages = comparison.commits
                  .map(c => c.commit.message.split('\n')[0])
                  .filter(msg =>
                    !msg.startsWith('chore: bump version to ') &&
                    !msg.startsWith('docs: snapshot version ')
                  )
                  .slice(0, 50);
                
                if (commitMessages.length > 0) {
                  changesContext += `Commits:\n${commitMessages.map(m => `- ${m}`).join('\n')}\n\n`;
                }
                
                if (comparison.files && comparison.files.length > 0) {
                  const areas = new Set();
                  for (const file of comparison.files) {
                    const parts = file.filename.split('/');
                    if (parts[0] === 'plugins') areas.add(`${parts[1]} plugin`);
                    else if (parts[0] === 'web') areas.add('frontend');
                    else if (parts[0] === 'src') areas.add('backend');
                    else if (parts[0] === 'docs-site') areas.add('documentation');
                  }
                  if (areas.size > 0) {
                    changesContext += `Areas affected: ${[...areas].join(', ')}\n`;
                  }
                  changesContext += `Total files changed: ${comparison.files.length}\n`;
                }
              } catch (error) {
                console.log(`Could not compare commits: ${error.message}`);
              }
            }
            
            // Truncate context to stay within model limits
            if (changesContext.length > 4000) {
              changesContext = changesContext.substring(0, 4000) + '\n...(truncated)';
            }
            
            // Generate AI summary using GitHub Models
            let aiSummary = '';
            if (changesContext.trim()) {
              try {
                const response = await fetch('https://models.github.ai/inference/chat/completions', {
                  method: 'POST',
                  headers: {
                    'Authorization': `Bearer ${process.env.GITHUB_TOKEN}`,
                    'Content-Type': 'application/json'
                  },
                  body: JSON.stringify({
                    model: 'openai/gpt-4o-mini',
                    messages: [
                      {
                        role: 'system',
                        content: 'You are a release notes writer for FiestaBoard, an open-source self-hosted platform for controlling split-flap displays. Write a concise, friendly summary of the changes in this release. Format as 2-5 bullet points with emoji prefixes. Focus on user-facing changes: new features, improvements, and bug fixes. Keep each bullet to 1-2 sentences. Omit version bumps, CI changes, and internal tooling unless they affect users. Output only the bullet points, no headers or extra text.'
                      },
                      {
                        role: 'user',
                        content: `Summarize these changes for release ${tagName}:\n\n${changesContext}`
                      }
                    ],
                    max_tokens: 500,
                    temperature: 0.3
                  })
                });
                
                if (response.ok) {
                  const data = await response.json();
                  aiSummary = data.choices?.[0]?.message?.content || '';
                  console.log('AI summary generated successfully');
                } else {
                  console.log(`GitHub Models returned ${response.status}: ${await response.text()}`);
                }
              } catch (error) {
                console.log(`AI summary generation failed: ${error.message}`);
              }
            }
            
            // Collect contributor info
            const contributors = new Set();
            if (previousTag) {
              try {
                const { data: comparison } = await github.rest.repos.compareCommitsWithBasehead({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  basehead: `${previousTag}...${releaseSha}`
                });
                for (const commit of comparison.commits) {
                  const login = commit.author?.login || commit.committer?.login;
                  if (login && login !== 'github-actions[bot]' && login !== 'web-flow') {
                    contributors.add(login);
                  }
                }
              } catch (error) {
                console.log(`Could not fetch contributors: ${error.message}`);
              }
            }

            // Build final release notes
            let releaseNotes = '';

            // Pi image is built by a separate workflow (build-fiestapi.yml) that
            // runs after this release is published and takes ~45-60 min. Mark the
            // release with a banner so users know the .img.xz is on its way; the
            // Pi workflow strips this block once the image has been attached.
            // Markers are HTML comments so the regex-strip in build-fiestapi.yml
            // can find this exact span no matter how the body is edited later.
            const piPendingBanner =
              `<!-- pi-image-pending-start -->\n` +
              `> 🍓 **Raspberry Pi image is building** — the \`FiestaPi-${version}-arm64.img.xz\` ` +
              `asset will appear in the **Assets** section below once the build completes ` +
              `(~45-60 min). ` +
              `[Watch progress](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/workflows/build-fiestapi.yml)\n` +
              `<!-- pi-image-pending-end -->\n\n`;
            releaseNotes += piPendingBanner;

            if (aiSummary) {
              releaseNotes += `## Summary\n\n${aiSummary}\n\n`;
            }
            
            if (autoNotes) {
              releaseNotes += autoNotes;
            } else {
              releaseNotes += `## What's Changed\n\nSee [commit history](https://github.com/${context.repo.owner}/${context.repo.repo}/commits/${tagName}) for changes.`;
            }
            
            if (previousTag) {
              releaseNotes += `\n\n**Full Changelog**: [\`${previousTag}...${tagName}\`](https://github.com/${context.repo.owner}/${context.repo.repo}/compare/${previousTag}...${tagName})\n`;
            }

            releaseNotes += `\n---\n\n## Raspberry Pi\n\n`;
            releaseNotes += `Download the FiestaPi image from the **Assets** section below and flash it to a microSD card — no Docker setup, no command line.\n\n`;
            releaseNotes += `1. Download \`image_...-fiestapi-lite.img.xz\` from **Assets** below\n`;
            releaseNotes += `2. Flash it with [Raspberry Pi Imager](https://www.raspberrypi.com/software/) — choose **Use custom** and pick the file\n`;
            releaseNotes += `3. Boot your Pi — FiestaBoard starts automatically at **http://fiestapi.local:4420**\n\n`;
            releaseNotes += `Full setup guide: [FiestaPi Quick Start](https://fiestaboard.app/docs/setup/raspberry-pi)\n`;
            releaseNotes += `\n---\n\n## Docker\n\n`;
            releaseNotes += `### docker-compose (recommended)\n\n`;
            releaseNotes += `\`\`\`bash\n`;
            releaseNotes += `mkdir -p ~/fiestaboard && cd ~/fiestaboard\n`;
            releaseNotes += `curl -O https://raw.githubusercontent.com/Fiestaboard/FiestaBoard/main/docker-compose.hub.yml\n`;
            releaseNotes += `docker-compose -f docker-compose.hub.yml up -d\n`;
            releaseNotes += `\`\`\`\n\n`;
            releaseNotes += `Open **http://localhost:4420** in your browser.\n\n`;
            releaseNotes += `### docker pull\n\n`;
            releaseNotes += `\`\`\`bash\n`;
            releaseNotes += `docker pull fiestaboard/fiestaboard:${version}\n\n`;
            releaseNotes += `# or\n`;
            releaseNotes += `docker pull fiestaboard/fiestaboard:latest\n`;
            releaseNotes += `\`\`\`\n\n`;
            releaseNotes += `Supports \`linux/amd64\` and \`linux/arm64\`. Running FiestaBoard in Docker on a Pi? Use these same commands.\n\n`;
            releaseNotes += `Full setup guide: [Docker Setup](https://fiestaboard.app/docs/setup/quick-start)\n`;

            if (contributors.size > 0) {
              const sorted = [...contributors].sort((a, b) => a.toLowerCase().localeCompare(b.toLowerCase()));
              releaseNotes += `\n## Contributors\n\n`;
              releaseNotes += sorted.map(c => `@${c}`).join(', ');
              releaseNotes += `\n`;
            }

            releaseNotes += `\n## 🔗 Links\n\n`;
            releaseNotes += `- 📖 [Documentation](https://fiestaboard.app)\n`;
            releaseNotes += `- 🐳 [Docker Hub](https://hub.docker.com/r/fiestaboard/fiestaboard)\n`;
            releaseNotes += `- 💬 [Discord](https://discord.gg/JvN8y6ahaf)\n`;
            releaseNotes += `- 🐛 [Report an Issue](https://github.com/${context.repo.owner}/${context.repo.repo}/issues/new)\n`;
            
            // Create the release
            const { data: release } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tagName,
              name: `Release ${version}`,
              body: releaseNotes,
              draft: false,
              prerelease: false
            });
            
            console.log(`Created release: ${release.html_url}`)

      # The release above is created with GITHUB_TOKEN, whose events do
      # not trigger other workflows.  Explicitly dispatch the Deploy Docs
      # workflow with the release tag so it can create a Docusaurus version
      # snapshot and deploy the updated site in a single run.
      - name: Trigger docs versioning and deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run docs.yml \
            --repo "${{ github.repository }}" \
            -f tag="v${{ needs.prep.outputs.version }}"

  dockerhub-description:
    name: Update Docker Hub Description
    runs-on: ubuntu-latest
    needs: [merge]
    if: needs.merge.result == 'success'
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Update Docker Hub Description
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: fiestaboard/fiestaboard
          readme-filepath: ./DOCKERHUB_README.md
          short-description: "Open-source self-hosted platform for controlling split-flap displays 🌮"
          enable-url-completion: true

  revert-on-failure:
    name: Revert on Build Failure
    runs-on: ubuntu-latest
    needs: [prep, merge]
    if: failure() && needs.merge.result == 'failure'
    steps:
      - name: Revert merge
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            console.log('🚨 Docker build failed! Reverting merge...');
            
            // Get the commit that triggered this workflow
            const { data: commit } = await github.rest.repos.getCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha
            });
            
            // Check if this is a merge commit
            let prNumber = null;
            let revertMessage = `Revert: ${commit.commit.message.split('\n')[0]}`;
            
            // Try to extract PR number from merge commit message
            const prMatch = commit.commit.message.match(/Merge pull request #(\d+)/);
            if (prMatch) {
              prNumber = parseInt(prMatch[1]);
              revertMessage = `Revert merge of PR #${prNumber} - Docker build failed`;
            }
            
            // Create revert commit
            try {
              // Get the parent commit (the one before the merge)
              const parentSha = commit.parents[0].sha;
              
              // Update the main branch to point to the parent
              await github.rest.git.updateRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: 'heads/main',
                sha: parentSha,
                force: true
              });
              
              console.log(`✅ Successfully reverted main to ${parentSha}`);
              
              // If we found a PR, comment on it
              if (prNumber) {
                try {
                  // Get PR details
                  const { data: pr } = await github.rest.pulls.get({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    pull_number: prNumber
                  });
                  
                  // Re-open the PR if it was closed
                  if (pr.state === 'closed') {
                    await github.rest.pulls.update({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      pull_number: prNumber,
                      state: 'open'
                    });
                    console.log(`✅ Re-opened PR #${prNumber}`);
                  }
                  
                  // Add comment to PR
                  await github.rest.issues.createComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: prNumber,
                    body: `## 🚨 Docker Build Failed\n\nThe merge to \`main\` has been automatically reverted because the Docker build failed.\n\n**Build logs:** ${context.payload.repository.html_url}/actions/runs/${context.runId}\n\nPlease fix the Docker build issues and re-submit this PR.`
                  });
                  
                  console.log(`✅ Posted comment to PR #${prNumber}`);
                } catch (error) {
                  console.log(`⚠️  Could not update PR #${prNumber}: ${error.message}`);
                }
              } else {
                // Create an issue if we can't find the PR
                await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title: '🚨 Docker Build Failed - Merge Reverted',
                  body: `The merge to \`main\` at commit ${context.sha} has been automatically reverted because the Docker build failed.\n\n**Build logs:** ${context.payload.repository.html_url}/actions/runs/${context.runId}\n\nPlease investigate and fix the Docker build issues.`,
                  labels: ['bug', 'build-failure']
                });
                console.log('✅ Created issue for build failure');
              }
            } catch (error) {
              console.error(`❌ Failed to revert: ${error.message}`);
              core.setFailed(`Failed to revert merge: ${error.message}`);
            }
