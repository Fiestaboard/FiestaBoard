name: Release

# Releases are batched through Changesets. Every PR that changes what ships adds
# a `.changeset/*.md` file (ci.yml's release-guards job enforces it). On each
# push to `main`, `alpha` or `v11`:
#
# 1. changesets/action opens or updates ONE "chore: release" Version PR that
#    consumes the pending changesets, bumps the version (package.json,
#    web/package*.json, src/__init__.py via scripts/version-sync.js) and writes
#    CHANGELOG.md. It runs with no publish script: it never releases.
# 2. scripts/release/plan.py decides whether to release: the version in
#    package.json has no GitHub Release yet. Only merging the Version PR makes
#    that true, so many merges share one image build, and re-running after a
#    failed build resumes it.
# 3. If so, the image is built from the commit that set the version, the
#    multi-arch manifest is pushed, and only THEN the tag and GitHub Release
#    are created: installs discover updates from releases and Docker Hub tags,
#    so a release must never point at an image that is not pullable yet.
#
# `main` releases X.Y.Z to `:latest` and the "latest" GitHub Release, then
# triggers the docs snapshot, the FiestaPi image and the Docker Hub
# description. `alpha` runs in Changesets pre mode (`.changeset/pre.json`, tag
# `beta`) and releases X.Y.Z-beta.N to `:beta` as a GitHub prerelease, which
# only installs on the beta channel see. `v11` publishes isolated Docker tags
# (`:v11-alpha` and `:v11-alpha-11.0.0-alpha.N`) and a git tag only. See docs/internal/development/RELEASING.md.
#
# Trigger is `push`, not `workflow_run`: under workflow_run GITHUB_REF is the
# default branch, and changesets/action takes its branch from GITHUB_REF, so an
# alpha run would open its Version PR against main. No paths-ignore: a push that
# only adds a changeset must still update the Version PR.
on:
  push:
    branches: [main, alpha, v11]
  # Re-run lever after an infrastructure failure. Pick the branch in the UI.
  workflow_dispatch:

permissions:
  contents: read

# Per branch, so an alpha release never waits on a main one. Never cancelled:
# killing a run between the manifest push and the release strands a pushed
# image without its release.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  version:
    name: Version PR and release plan
    # Forks that push to their own main must not open PRs or publish, and a
    # manual run from any other branch would open a Version PR against it.
    if: >-
      github.repository == 'Fiestaboard/FiestaBoard'
      && (github.ref_name == 'main' || github.ref_name == 'alpha' || github.ref_name == 'v11')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      image_tag: ${{ steps.plan.outputs.image_tag }}
      moving_tag: ${{ steps.plan.outputs.moving_tag }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
      release_sha: ${{ steps.plan.outputs.release_sha }}
    steps:
      # The Claude bot app token, not GITHUB_TOKEN: a Version PR opened with
      # GITHUB_TOKEN has its `pull_request` CI born gated in `action_required`,
      # so the required `CI Success` waits on a manual approval every release.
      - name: Mint app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.CLAUDE_BOT_APP_ID }}
          private-key: ${{ secrets.CLAUDE_BOT_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # plan.py walks history for the commit that set the version
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install release tooling
        run: npm ci --no-audit --no-fund

      # alpha versions and releases only in beta pre mode. In exit mode (a
      # promotion to main in progress) the action would open a STABLE Version
      # PR against alpha, so it is skipped; with no pre.json at all this fails
      # the run. See scripts/release/pre_mode.py.
      - name: Check alpha prerelease mode
        id: alpha
        if: github.ref_name == 'alpha'
        run: python3 scripts/release/pre_mode.py alpha-action >> "$GITHUB_OUTPUT"

      - name: Check v11 prerelease mode
        id: v11
        if: github.ref_name == 'v11'
        run: python3 scripts/release/pre_mode.py v11-action >> "$GITHUB_OUTPUT"

      # v2, not v1: v1 supports the Changesets v2 CLI only. No publish-script:
      # this step only maintains the Version PR; releasing is decided below.
      # The token goes in `github-token` only. v2 throws if a GITHUB_TOKEN env
      # differs from it, and hands it to changelog-github itself.
      - name: Open or update the Version PR
        if: (github.ref_name != 'alpha' || steps.alpha.outputs.action == 'release') && (github.ref_name != 'v11' || steps.v11.outputs.action == 'release')
        uses: changesets/action@v2
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          version-script: npm run version-packages
          pr-title: 'chore: release'
          commit-message: 'chore: release'

      - name: Decide whether to release
        id: plan
        if: (github.ref_name != 'alpha' || steps.alpha.outputs.action == 'release') && (github.ref_name != 'v11' || steps.v11.outputs.action == 'release')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The action commits the Version PR through the GitHub API and leaves
          # its bump (package.json, CHANGELOG.md, deleted changesets) in this
          # working tree. Discard all of it: the plan must describe the pushed
          # commit, not the PR. plan.py also reads package.json from git, not
          # from disk, so a leftover edit cannot leak in.
          git reset --hard --quiet "$GITHUB_SHA"
          git clean -fdq
          python3 scripts/release/plan.py "$GITHUB_REF_NAME" > /tmp/plan.txt
          cat /tmp/plan.txt >> "$GITHUB_OUTPUT"
          printf '### Release plan\n\n%s\n' "$(sed -n 's/^reason=//p' /tmp/plan.txt)" >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build (${{ matrix.platform }})
    needs: [version]
    if: needs.version.outputs.release == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          # Native arm64 runner: emulated arm64 turns the ~5-minute web build
          # into the better part of an hour.
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.release_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # A re-run after a later job failed should not rebuild an arch that is
      # already on Docker Hub under this version.
      - name: Check if already pushed
        id: check-existing
        env:
          VERSION: ${{ needs.version.outputs.image_tag }}
          ARCH: ${{ matrix.arch }}
        run: |
          EXISTING=$(docker buildx imagetools inspect "fiestaboard/fiestaboard:${VERSION}" --raw 2>/dev/null | \
            jq -r --arg arch "$ARCH" \
            '.manifests[]? | select(.platform.architecture == $arch and .platform.os == "linux") | .digest' \
            2>/dev/null) || true

          if [ -n "$EXISTING" ] && [ "$EXISTING" != "null" ]; then
            echo "fiestaboard/fiestaboard:${VERSION} (${ARCH}) already on Docker Hub — skipping build"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "digest=$EXISTING" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push by digest
        if: steps.check-existing.outputs.skip != 'true'
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          # Pin the production stage explicitly — a target-less build takes
          # whatever stage is last in the Dockerfile, which once shipped the
          # dev supervisor config to users (issue #1377).
          target: runtime
          platforms: ${{ matrix.platform }}
          build-args: |
            VERSION=${{ needs.version.outputs.version }}
          cache-from: type=gha,scope=build-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=build-${{ matrix.platform }}
          outputs: type=image,name=fiestaboard/fiestaboard,push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        env:
          SKIPPED: ${{ steps.check-existing.outputs.skip }}
          EXISTING_DIGEST: ${{ steps.check-existing.outputs.digest }}
          BUILT_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          if [ "$SKIPPED" = "true" ]; then digest="$EXISTING_DIGEST"; else digest="$BUILT_DIGEST"; fi
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge Multi-Platform Image
    needs: [version, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Stable moves `:latest`; a prerelease moves `:beta` and never touches
      # `:latest`, which is what every shipped compose file pulls.
      - name: Create manifest list and push
        working-directory: /tmp/digests
        env:
          VERSION: ${{ needs.version.outputs.image_tag }}
          MOVING: ${{ needs.version.outputs.moving_tag }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2046 # one argument per digest file
          docker buildx imagetools create \
            -t "fiestaboard/fiestaboard:${VERSION}" \
            -t "fiestaboard/fiestaboard:${MOVING}" \
            $(printf 'fiestaboard/fiestaboard@sha256:%s ' *)

      - name: Verify the published manifest carries both architectures
        env:
          VERSION: ${{ needs.version.outputs.image_tag }}
        run: |
          set -euo pipefail
          RAW=$(docker buildx imagetools inspect "fiestaboard/fiestaboard:${VERSION}" --raw)
          for arch in amd64 arm64; do
            echo "$RAW" | jq -e --arg a "$arch" \
              '.manifests[] | select(.platform.architecture == $a and .platform.os == "linux")' >/dev/null \
              || { echo "::error::fiestaboard/fiestaboard:${VERSION} is missing linux/$arch"; exit 1; }
          done
          echo "fiestaboard/fiestaboard:${VERSION} carries linux/amd64 and linux/arm64"

  v11-tag:
    name: Mark v11 image published
    needs: [version, merge]
    if: github.ref_name == 'v11'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      TAG: ${{ needs.version.outputs.tag }}
      RELEASE_SHA: ${{ needs.version.outputs.release_sha }}
    steps:
      # A public GitHub Release would be offered to already-deployed beta
      # clients. The tag alone records success without entering their feed.
      - name: Tag the published image
        uses: actions/github-script@v9
        with:
          script: |
            const { TAG: tag, RELEASE_SHA: sha } = process.env;
            try {
              await github.rest.git.createRef({ ...context.repo, ref: `refs/tags/${tag}`, sha });
            } catch (error) {
              if (error.status !== 422) throw error;
              const { data: ref } = await github.rest.git.getRef({ ...context.repo, ref: `tags/${tag}` });
              if (ref.object.sha !== sha) throw new Error(`Tag ${tag} points at ${ref.object.sha}, not ${sha}`);
            }

  release:
    if: github.ref_name != 'v11'
    name: Create Release
    needs: [version, merge]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # tag + GitHub Release
      actions: write # dispatch build-fiestapi.yml
      pull-requests: read # per-PR claude-changelog comments
      issues: read # (listComments goes through the issues API)
      id-token: write # required by claude-code-base-action
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TAG: ${{ needs.version.outputs.tag }}
      RELEASE_SHA: ${{ needs.version.outputs.release_sha }}
      PRERELEASE: ${{ needs.version.outputs.prerelease }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.release_sha }}
          fetch-depth: 0

      # Step 1 — tag the commit that set the version, and gather release
      # context: the version's CHANGELOG.md section (written by Changesets
      # from each PR's changeset), per-PR `<!-- claude-changelog -->`
      # comments, commit titles and the areas touched. Stashed to /tmp for the
      # Claude summary and the render step.
      - name: Tag and gather release context
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const { VERSION: version, TAG: tagName, RELEASE_SHA: releaseSha } = process.env;
            const prerelease = process.env.PRERELEASE === 'true';

            // Created with GITHUB_TOKEN on purpose: a tag it creates fires no
            // `push` event, so build-fiestapi.yml's vN.0.0 tag trigger does not
            // start a second Pi build next to the dispatch below.
            // Idempotent for re-runs, but never silently reuse a tag that
            // points somewhere else.
            try {
              await github.rest.git.createRef({ ...context.repo, ref: `refs/tags/${tagName}`, sha: releaseSha });
              core.info(`Created tag ${tagName} at ${releaseSha}`);
            } catch (error) {
              if (error.status !== 422) throw error;
              const { data: ref } = await github.rest.git.getRef({ ...context.repo, ref: `tags/${tagName}` });
              if (ref.object.sha !== releaseSha) {
                core.setFailed(`Tag ${tagName} already exists at ${ref.object.sha}, not ${releaseSha}.`);
                return;
              }
              core.info(`Tag ${tagName} already at ${releaseSha}, reusing it`);
            }

            // This version's section of CHANGELOG.md: from "## <version>" to
            // the next "## " heading.
            let changelog = '';
            try {
              const text = fs.readFileSync('CHANGELOG.md', 'utf8');
              const start = text.indexOf(`\n## ${version}\n`);
              if (start !== -1) {
                const body = text.slice(start + `\n## ${version}\n`.length);
                const end = body.search(/^## /m);
                changelog = (end === -1 ? body : body.slice(0, end)).trim();
              }
            } catch (error) {
              core.warning(`Could not read CHANGELOG.md: ${error.message}`);
            }
            if (!changelog) core.warning(`CHANGELOG.md has no section for ${version}`);

            // Previous release on the same channel: a stable release compares
            // against the last stable one (not an interleaved beta); a beta
            // against the newest release of any kind.
            const { data: releases } = await github.rest.repos.listReleases({ ...context.repo, per_page: 50 });
            const previous = releases.find((r) => !r.draft && r.tag_name !== tagName && (prerelease || !r.prerelease));
            const previousTag = previous ? previous.tag_name : null;

            let changesContext = changelog ? `Changelog (from changesets — the most accurate source):\n${changelog}\n\n` : '';
            const contributors = new Set();
            const prChangelogLines = [];

            if (previousTag) {
              try {
                const { data: comparison } = await github.rest.repos.compareCommitsWithBasehead({
                  ...context.repo,
                  basehead: `${previousTag}...${releaseSha}`,
                });
                for (const commit of comparison.commits) {
                  const login = commit.author?.login || commit.committer?.login;
                  if (login && !login.endsWith('[bot]') && login !== 'web-flow') contributors.add(login);
                }
                const prNumbers = new Set();
                for (const c of comparison.commits) {
                  const match = c.commit.message.match(/\(#(\d+)\)|Merge pull request #(\d+)/);
                  if (match) prNumbers.add(parseInt(match[1] || match[2], 10));
                }
                for (const num of prNumbers) {
                  try {
                    const { data: comments } = await github.rest.issues.listComments({ ...context.repo, issue_number: num, per_page: 100 });
                    const tagged = comments.find((c) => c.body && c.body.includes('<!-- claude-changelog -->'));
                    if (tagged) {
                      const body = tagged.body.replace('<!-- claude-changelog -->', '').trim();
                      if (!body.startsWith('SKIP')) prChangelogLines.push(`${body} (#${num})`);
                    }
                  } catch (error) {
                    core.info(`Could not fetch comments for PR #${num}: ${error.message}`);
                  }
                }
                if (prChangelogLines.length > 0) {
                  changesContext += `Per-PR human-written summaries:\n${prChangelogLines.join('\n')}\n\n`;
                }
                const commitMessages = comparison.commits
                  .map((c) => c.commit.message.split('\n')[0])
                  .filter((msg) => !msg.startsWith('chore: release'))
                  .slice(0, 50);
                if (commitMessages.length > 0) {
                  changesContext += `All commits in range:\n${commitMessages.map((m) => `- ${m}`).join('\n')}\n\n`;
                }
                if (comparison.files && comparison.files.length > 0) {
                  const areas = new Set();
                  for (const file of comparison.files) {
                    const parts = file.filename.split('/');
                    if (parts[0] === 'plugins') areas.add(`${parts[1]} plugin`);
                    else if (parts[0] === 'web') areas.add('frontend');
                    else if (parts[0] === 'src') areas.add('backend');
                  }
                  if (areas.size > 0) changesContext += `Areas affected: ${[...areas].join(', ')}\n`;
                }
              } catch (error) {
                core.info(`Could not compare ${previousTag}...${releaseSha}: ${error.message}`);
              }
            }
            if (changesContext.length > 8000) changesContext = changesContext.substring(0, 8000) + '\n...(truncated)';

            fs.writeFileSync('/tmp/release-context.md', `# Release ${tagName}\n\n${changesContext}`);
            fs.writeFileSync('/tmp/release-meta.json', JSON.stringify({
              version, tagName, releaseSha, prerelease, previousTag, changelog, contributors: [...contributors],
            }, null, 2));

      # Step 2 (stable only) — Claude turns the gathered context into the
      # user-facing summary at /tmp/release-summary.md. continue-on-error: the
      # render step tolerates a missing summary, so an API hiccup ships the
      # release without AI bullets rather than blocking it.
      #
      # claude-code-base-action, not claude-code-action@v1, which rejects
      # `push` events. Pinned to a SHA whose nested actions run on node24
      # (issue #1577). The prompt and its input file are produced by this
      # workflow on a trusted push, so the base action's skipped trust checks
      # are fine here.
      - name: Generate AI summary with Claude
        if: needs.version.outputs.prerelease != 'true'
        continue-on-error: true
        uses: anthropics/claude-code-base-action@298ebba052ef5001fd3417bbc6f2cb23788c1df0
        env:
          NODE_VERSION: '24'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: '--model claude-sonnet-4-6 --allowed-tools "Read,Write"'
          prompt: |
            You are writing the "Summary" section of FiestaBoard release
            ${{ needs.version.outputs.version }}. FiestaBoard is an open-source
            self-hosted platform for controlling split-flap displays.

            1. Read `/tmp/release-context.md`. It contains the changelog
               written from each PR's changeset (most accurate — prefer it),
               per-PR human-written summaries, all commit titles, and the
               areas of the repo affected.
            2. Write 3-6 polished bullets to `/tmp/release-summary.md` that a
               FiestaBoard user would read at the top of the release notes.
               Group bullets into themes when natural:
                 - New plugins (call them out by name)
                 - New features / UX improvements
                 - Bug fixes (only if user-visible)
               Skip entirely: version bumps, CI tweaks, dependency bumps with
               no behavior change, internal refactors, test additions, docs.
               If everything in the release is internal, write a single bullet:
               "🧹 Internal maintenance — no user-facing changes this release."
            3. Each bullet:
                 - Starts with an emoji (🎉 feature, 🔌 plugin, 🎨 UI,
                   ⚙️  backend, 🐛 fix, 🍓 Pi/setup).
                 - One sentence, ~15-25 words.
                 - Leads with what the user can now do, not the implementation.
                 - No PR numbers (they appear in the changelog below).
            4. Output ONLY the bullets to `/tmp/release-summary.md` — no
               heading, no preamble, no trailing prose. Do not edit any other
               file. Do not run shell commands beyond what Read/Write need.

      # Step 3 — render the body and create the GitHub Release.
      - name: Render and publish release
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const { version, tagName, releaseSha, prerelease, previousTag, changelog, contributors } =
              JSON.parse(fs.readFileSync('/tmp/release-meta.json', 'utf8'));
            const repoUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}`;
            const changes = changelog || `See [commit history](${repoUrl}/commits/${tagName}) for changes.`;
            const compare = previousTag
              ? `\n\n**Full Changelog**: [\`${previousTag}...${tagName}\`](${repoUrl}/compare/${previousTag}...${tagName})\n`
              : '\n';

            let body = '';
            if (prerelease) {
              body += [
                '> **This is a beta build from `alpha`.** It is not a stable release.',
                '> Expect breaking changes, and read the notes below before installing.',
                '',
                "## What's Changed",
                '',
                changes,
              ].join('\n');
              body += compare;
              body += [
                '',
                '## Install',
                '',
                'Switch to the beta channel in **Settings → Updates**, or pull the image directly:',
                '',
                '```bash',
                `docker pull fiestaboard/fiestaboard:${version}   # pinned`,
                'docker pull fiestaboard/fiestaboard:beta              # moving',
                '```',
                '',
                '## Going back to stable',
                '',
                'Switch the channel back to stable (or point your compose file at `:latest`) and pull again.',
                'A beta may have migrated your data to a schema stable does not understand — the app refuses',
                'to read such a file rather than misinterpreting it, so restore a backup taken before you',
                'joined the beta.',
                '',
                `Built from \`${releaseSha.substring(0, 9)}\`.`,
                '',
              ].join('\n');
            } else {
              let aiSummary = '';
              try {
                aiSummary = fs.readFileSync('/tmp/release-summary.md', 'utf8').trim();
              } catch (error) {
                core.info(`No Claude summary found: ${error.message}`);
              }

              // The FiestaPi image is built afterwards by build-fiestapi.yml
              // (~45-60 min), which strips this marked block once it attaches
              // the .img.xz. The HTML-comment markers are what it searches for.
              body +=
                `<!-- pi-image-pending-start -->\n` +
                `> 🍓 **Raspberry Pi image is building** — the \`FiestaPi-${version}-arm64.img.xz\` ` +
                `asset will appear in the **Assets** section below once the build completes ` +
                `(~45-60 min). ` +
                `[Watch progress](${repoUrl}/actions/workflows/build-fiestapi.yml)\n` +
                `<!-- pi-image-pending-end -->\n\n`;
              if (aiSummary) body += `## Summary\n\n${aiSummary}\n\n`;
              body += `## What's Changed\n\n${changes}`;
              body += compare;
              body += `\n---\n\n## Raspberry Pi\n\n`;
              body += `Download the FiestaPi image from the **Assets** section below and flash it to a microSD card — no Docker setup, no command line.\n\n`;
              body += `1. Download \`image_...-fiestapi-lite.img.xz\` from **Assets** below\n`;
              body += `2. Flash it with [Raspberry Pi Imager](https://www.raspberrypi.com/software/) — choose **Use custom** and pick the file\n`;
              body += `3. Boot your Pi — FiestaBoard starts automatically at **http://fiestapi.local:4420**\n\n`;
              body += `Full setup guide: [FiestaPi Quick Start](https://fiestaboard.app/docs/setup/raspberry-pi)\n`;
              body += `\n---\n\n## Docker\n\n`;
              body += `### docker-compose (recommended)\n\n`;
              body += '```bash\n';
              body += `mkdir -p ~/fiestaboard && cd ~/fiestaboard\n`;
              body += `curl -O https://raw.githubusercontent.com/Fiestaboard/FiestaBoard/main/docker-compose.hub.yml\n`;
              body += `docker-compose -f docker-compose.hub.yml up -d\n`;
              body += '```\n\n';
              body += `Open **http://localhost:4420** in your browser.\n\n`;
              body += `### docker pull\n\n`;
              body += '```bash\n';
              body += `docker pull fiestaboard/fiestaboard:${version}\n\n`;
              body += `# or\n`;
              body += `docker pull fiestaboard/fiestaboard:latest\n`;
              body += '```\n\n';
              body += `Supports \`linux/amd64\` and \`linux/arm64\`. Running FiestaBoard in Docker on a Pi? Use these same commands.\n\n`;
              body += `Full setup guide: [Docker Setup](https://fiestaboard.app/docs/setup/quick-start)\n`;
            }

            if (contributors.length > 0) {
              const sorted = [...contributors].sort((a, b) => a.toLowerCase().localeCompare(b.toLowerCase()));
              body += `\n## Contributors\n\n${sorted.map((c) => `@${c}`).join(', ')}\n`;
            }
            body += `\n## 🔗 Links\n\n`;
            body += `- 📖 [Documentation](https://fiestaboard.app)\n`;
            body += `- 🐳 [Docker Hub](https://hub.docker.com/r/fiestaboard/fiestaboard)\n`;
            body += `- 💬 [Discord](https://discord.gg/2GAqKnRF6h)\n`;
            body += `- 🐛 [Report an Issue](${repoUrl}/issues/new)\n`;

            // `prerelease` keeps a beta out of /releases/latest, the endpoint
            // stable installs poll, so a stable install is never offered one.
            // `make_latest` is pinned explicitly both ways: the in-app update
            // banner's "View Release" link falls back to /releases/latest.
            const { data: release } = await github.rest.repos.createRelease({
              ...context.repo,
              tag_name: tagName,
              name: prerelease ? `Beta ${version}` : `Release ${version}`,
              body,
              draft: false,
              prerelease,
              make_latest: prerelease ? 'false' : 'true',
            });
            core.notice(`Created ${prerelease ? 'prerelease' : 'release'} ${release.html_url}`);

      # The docs site (Fiestaboard/fiestaboard.github.io) snapshots and deploys
      # fiestaboard.app for each stable tag on a `release` repository_dispatch.
      # GITHUB_TOKEN cannot dispatch cross-repo, so this uses RELEASE_PAT.
      - name: Notify docs site repo of release
        if: needs.version.outputs.prerelease != 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: |
          gh api repos/Fiestaboard/fiestaboard.github.io/dispatches \
            -f event_type=release \
            -f "client_payload[tag]=${TAG}"

      # Explicit dispatch rather than build-fiestapi.yml listening for this
      # workflow's completion: every push runs this workflow, and most runs
      # only update the Version PR. workflow_dispatch is one of the events a
      # GITHUB_TOKEN may trigger.
      - name: Build the FiestaPi image for this release
        if: needs.version.outputs.prerelease != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run build-fiestapi.yml --repo "$GITHUB_REPOSITORY" --ref main -f release_tag="$TAG"
          echo "Dispatched the FiestaPi build for ${TAG}." >> "$GITHUB_STEP_SUMMARY"

  dockerhub-description:
    name: Update Docker Hub Description
    needs: [version, merge]
    if: needs.version.outputs.prerelease != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.release_sha }}

      - name: Update Docker Hub Description
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: fiestaboard/fiestaboard
          readme-filepath: ./DOCKERHUB_README.md
          short-description: "Open-source self-hosted platform for controlling split-flap displays 🌮"
          enable-url-completion: true
