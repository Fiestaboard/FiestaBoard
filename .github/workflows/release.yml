name: Release and Publish

on:
  push:
    branches:
      - main

permissions:
  contents: write
  packages: write
  pull-requests: read

jobs:
  # Prevent loop: skip release when this run was triggered by our own version-bump push.
  guard:
    name: Skip if version-bump commit
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - name: Check if trigger was a version-bump commit
        id: check
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          # Skip when head commit is our version-bump (avoids loop when push uses RELEASE_PAT and actor is not github-actions[bot])
          if echo "$COMMIT_MSG" | head -1 | grep -qE '^chore: bump version to '; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "Skipping: trigger commit is a version-bump commit."
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

  prep:
    name: Prepare Release
    runs-on: ubuntu-latest
    needs: [guard]
    if: needs.guard.outputs.skip != 'true'
    outputs:
      version: ${{ steps.version.outputs.version }}
      release_sha: ${{ steps.commit.outputs.release_sha }}
      build_pi: ${{ steps.bump_type.outputs.build_pi }}
      platforms: ${{ steps.bump_type.outputs.build_pi == 'true' && 'linux/amd64,linux/arm/v7,linux/arm64' || 'linux/amd64' }}
      owner_lower: ${{ steps.owner_lower.outputs.owner_lower }}
    steps:
      # Use RELEASE_PAT when branch protection/rulesets block GITHUB_TOKEN from pushing to main.
      # Add repo secret RELEASE_PAT (PAT with repo scope) and allow that user to bypass rules on main.
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}

      - name: Set owner lowercase for GHCR
        id: owner_lower
        run: echo "owner_lower=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Determine version bump type and build platforms
        id: bump_type
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            // Get the most recent merged PR
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'closed',
              sort: 'updated',
              direction: 'desc',
              per_page: 10
            });
            
            // Find the most recently merged PR
            const mergedPR = prs.find(pr => 
              pr.merged_at && 
              new Date(pr.merged_at) > new Date(Date.now() - 60000) // Within last minute
            );
            
            let bumpType = 'patch'; // default
            let buildPi = false; // default
            
            if (mergedPR) {
              console.log(`Found merged PR #${mergedPR.number}: ${mergedPR.title}`);
              
              const labels = mergedPR.labels.map(l => l.name);
              console.log(`PR labels: ${labels.join(', ')}`);
              
              if (labels.includes('major')) {
                bumpType = 'major';
              } else if (labels.includes('minor')) {
                bumpType = 'minor';
              } else if (labels.includes('patch')) {
                bumpType = 'patch';
              }
              
              // Check if Pi builds are requested
              if (labels.includes('pi') || labels.includes('raspberry-pi')) {
                buildPi = true;
                console.log('🍓 Raspberry Pi builds enabled via label');
              }
            } else {
              console.log('No recently merged PR found, using default: patch');
            }
            
            console.log(`Version bump type: ${bumpType}`);
            console.log(`Build Pi images: ${buildPi}`);
            
            // Set outputs
            core.setOutput('bump_type', bumpType);
            core.setOutput('build_pi', buildPi);
            
            return bumpType;
          result-encoding: string

      - name: Bump version
        id: version
        run: |
          echo "Bumping version with type: ${{ steps.bump_type.outputs.result }}"
          node scripts/version-sync.js ${{ steps.bump_type.outputs.result }}
          
          # Read the new version from package.json
          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "version=${NEW_VERSION}" >> $GITHUB_OUTPUT
          echo "New version: ${NEW_VERSION}"

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit version bump
        id: commit
        run: |
          git add package.json web/package.json src/__init__.py
          git commit -m "chore: bump version to ${{ steps.version.outputs.version }} [skip ci]"
          git push
          echo "release_sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

  build-api:
    name: Build API Image
    runs-on: ubuntu-latest
    needs: [prep]
    if: needs.prep.result == 'success'
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prep.outputs.release_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        id: build-api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.api
          push: true
          platforms: ${{ needs.prep.outputs.platforms }}
          build-args: |
            VERSION=${{ needs.prep.outputs.version }}
          tags: |
            ghcr.io/${{ needs.prep.outputs.owner_lower }}/fiestaboard-api:${{ needs.prep.outputs.version }}
            ghcr.io/${{ needs.prep.outputs.owner_lower }}/fiestaboard-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-ui:
    name: Build UI Image
    runs-on: ubuntu-latest
    needs: [prep]
    if: needs.prep.result == 'success'
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prep.outputs.release_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push UI image
        id: build-ui
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.ui
          push: true
          platforms: ${{ needs.prep.outputs.platforms }}
          build-args: |
            VERSION=${{ needs.prep.outputs.version }}
          tags: |
            ghcr.io/${{ needs.prep.outputs.owner_lower }}/fiestaboard-ui:${{ needs.prep.outputs.version }}
            ghcr.io/${{ needs.prep.outputs.owner_lower }}/fiestaboard-ui:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [prep, build-api, build-ui]
    if: always() && needs.prep.result == 'success'
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prep.outputs.release_sha }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        id: create-release
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const version = '${{ needs.prep.outputs.version }}';
            const releaseSha = '${{ needs.prep.outputs.release_sha }}';
            const tagName = `v${version}`;
            
            // Create a tag pointing to the version-bump commit
            try {
              await github.rest.git.createRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `refs/tags/${tagName}`,
                sha: releaseSha
              });
              console.log(`Created tag: ${tagName}`);
            } catch (error) {
              console.log(`Tag ${tagName} may already exist: ${error.message}`);
            }
            
            // Get commits since last release
            let releaseNotes = `## What's Changed\n\n`;
            
            try {
              const { data: releases } = await github.rest.repos.listReleases({
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 1
              });
              
              if (releases.length > 0) {
                const lastRelease = releases[0];
                const { data: comparison } = await github.rest.repos.compareCommits({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  base: lastRelease.tag_name,
                  head: releaseSha
                });
                
                releaseNotes += comparison.commits
                  .map(commit => `- ${commit.commit.message.split('\n')[0]} (${commit.sha.substring(0, 7)})`)
                  .join('\n');
              } else {
                releaseNotes += 'Initial release';
              }
            } catch (error) {
              console.log('Could not generate comparison, using default notes');
              releaseNotes += 'See commit history for changes.';
            }
            
            releaseNotes += `\n\n## Docker Images\n\n`;
            
            const buildPi = '${{ needs.prep.outputs.build_pi }}' === 'true';
            const platforms = buildPi 
              ? '`linux/amd64`, `linux/arm/v7`, `linux/arm64` 🍓' 
              : '`linux/amd64`';
            
            releaseNotes += `**Platforms:** ${platforms}\n\n`;
            releaseNotes += `\`\`\`bash\n`;
            releaseNotes += `docker pull ghcr.io/${{ needs.prep.outputs.owner_lower }}/fiestaboard-api:${version}\n`;
            releaseNotes += `docker pull ghcr.io/${{ needs.prep.outputs.owner_lower }}/fiestaboard-ui:${version}\n`;
            releaseNotes += `\`\`\`\n`;
            
            if (buildPi) {
              releaseNotes += `\n### 🍓 Raspberry Pi Support\n\n`;
              releaseNotes += `This release includes multi-architecture images that work on Raspberry Pi (arm/v7 and arm64).\n`;
              releaseNotes += `Simply use the same \`docker pull\` commands above on your Pi!\n`;
            }
            
            // Create the release
            const { data: release } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tagName,
              name: `Release ${version}`,
              body: releaseNotes,
              draft: false,
              prerelease: false
            });
            
            console.log(`Created release: ${release.html_url}`)

