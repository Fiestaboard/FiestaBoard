name: 'Claude: Docs Auto-Review'

# =============================================================================
# Auto-runs a Claude code review on any PR that touches markdown docs.
# Posts ONE review comment on the PR. Read-only on contents — only
# pull-requests: write so the action can leave its review.
#
# Goal: every docs PR (human-authored or bot-authored) gets a sanity check
# before merge — voice/format match against the canonical formats in
# CLAUDE.md, factual accuracy against the code, no real PII in examples,
# and the FiestaBoard-vs-Vestaboard branding distinction that surfaced
# from rejection PRs #999/#1001.
#
# `pull_request_target` runs from the base ref's workflow definition, so
# malicious head-branch edits to this workflow file can't fire. The action
# checks out the PR's head sha because we need to read the diff and the
# changed files — but `--allowed-tools` is read-only, no Edit/Write, no
# git push, no shell escapes outside the allowlist.
#
# Draft PRs are skipped — a draft signals "not ready for review yet."
# The trigger includes `ready_for_review` so the review fires when the
# author flips draft → ready.
# =============================================================================

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '**.md'
      - 'plugins/*/docs/**'
      - 'docs/**'
      - 'docs-site/**'

permissions:
  contents: read

# Cancel a prior review for the same PR if a new push comes in — only the
# latest diff matters and we don't want two reviews racing the same comment.
concurrency:
  group: claude-docs-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Claude reviews the docs diff
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event.pull_request.draft == false
    permissions:
      contents: read
      pull-requests: write
      id-token: write
      actions: read
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v6
        with:
          # pull_request_target normally checks out base; for review we
          # need the PR's actual changes. Safe to use head sha here because
          # the allowed-tools list below is read-only — no Edit/Write/push.
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Run Claude review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Bot-authored PRs (docs-audit cron, issue-triage worker) need
          # to be reviewed too — that's the whole point. Without this the
          # action's anti-bot guard short-circuits the run.
          allowed_bots: 'claude,github-actions'
          # Surface the SDK transcript so silent permission denials don't
          # look like a clean success.
          show_full_output: 'true'
          claude_args: >-
            --model claude-sonnet-4-6
            --max-turns 40
            --allowed-tools "Read,Glob,Grep,Bash(ls:*),Bash(cat:*),Bash(find:*),Bash(grep:*),Bash(rg:*),Bash(python3:*),Bash(jq:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh api:*)"
          prompt: |
            You are the FiestaBoard docs reviewer. Review PR
            #${{ github.event.pull_request.number }} — only the docs changes
            it makes. Skim any non-docs changes for context but don't review
            them; another workflow handles code review.

            ## How to review

            1. Run `gh pr diff ${{ github.event.pull_request.number }}` to
               see the exact diff. Focus on `*.md` files and files under
               `plugins/*/docs/`, `docs/`, or `docs-site/`.
            2. Read the root `CLAUDE.md` and `plugins/CLAUDE.md` (if
               touching plugin docs) for the canonical README/SETUP
               section orders, the voice rules (examples-first, no
               marketing fluff), and the privacy rules (no real PII).
            3. For each changed doc, verify:
               - **Factual accuracy.** Does it match the code? If a doc
                 names a command, `ls` to verify the script exists. If it
                 cites a manifest variable, check `manifest.json`. If it
                 claims an env var, grep `src/`. If it references a line
                 number, the line numbers rot fast — flag any.
               - **Voice and format.** Does it match the canonical voice
                 and section order? Concrete examples beat placeholders
                 (`"22"` beats `<value>`). Short paragraphs. No marketing
                 words ("powerful", "seamless", "easily").
               - **Privacy.** No real addresses, home coordinates, API
                 keys, phone numbers, or emails. The plugin `manifest.json`
                 `author` field is the only allowed exception.
               - **Internal links.** Every relative link resolves on disk
                 (use `ls` to verify).
               - **Branding.** "FiestaBoard" is the open-source software;
                 "Vestaboard" is the physical hardware it drives. Don't
                 confuse the two — this was the cause of closed PRs #999
                 and #1001. If the diff renames Vestaboard → FiestaBoard
                 (or vice versa) anywhere, flag it loudly.
            4. Save edge nits for last; lead with substantive findings.

            ## Output — post a review with applicable `suggestion` blocks

            Post ONE pull request review via the GitHub Reviews API. The
            review has a **top-level body** (verdict + structural notes)
            AND **inline comments** — and inline comments containing a
            ```` ```suggestion ```` block render an "Apply suggestion"
            button the maintainer clicks to commit the fix straight to the
            PR. This is the whole point of this workflow: every finding
            that has a concrete one-line replacement should ride as an
            inline suggestion. No copy-paste for the reviewer.

            ### Step 1 — identify positions

            Inline comments only attach to lines that appear in the PR
            diff (added `+` lines and surrounding context). Run
            `gh pr diff ${{ github.event.pull_request.number }}` to see
            what's eligible. For each finding, you need:
              - `path` — file path relative to the repo root
              - `line` — the RIGHT-side line number (the line as it
                appears in the PR head). Because the workflow checks out
                the PR head SHA, `cat -n <file>` gives the exact line
                number GitHub expects — no diff-position math needed.

            ### Step 2 — build the review payload

            Construct a JSON object with:
              - `event` — always `"COMMENT"` (never APPROVE / REQUEST_CHANGES;
                this is an auto-review, not sign-off)
              - `body` — top-level summary: verdict + any findings that
                CAN'T be expressed as a single-line replacement (missing
                canonical section, missing hero image, structural reorder,
                lines outside the PR diff)
              - `comments` — array of inline comments. Each entry:
                - `path`, `line`, `side: "RIGHT"`
                - `body` — short human explanation, then a
                  ```` ```suggestion ```` block containing the EXACT
                  replacement text for that line
                - For a multi-line suggestion, add `start_line` and
                  `start_side: "RIGHT"`; the suggestion replaces lines
                  `start_line`..`line` inclusive

            ### Step 3 — POST via `gh api`

            Build the JSON in python3 and pipe to gh api:

                python3 <<'PY' | gh api \
                  "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/reviews" \
                  --method POST --input -
                import json
                payload = {
                    "event": "COMMENT",
                    "body": (
                        "## Docs review\n\n"
                        "**Verdict:** small fixes\n\n"
                        "Inline suggestions below — click _Apply suggestion_ "
                        "to commit any you agree with.\n\n"
                        "🤖 Auto-review by `claude-docs-review.yml`."
                    ),
                    "comments": [
                        {
                            "path": "plugins/foo/README.md",
                            "line": 12,
                            "side": "RIGHT",
                            "body": (
                                "FiestaBoard is the software; the hardware "
                                "it drives is Vestaboard.\n\n"
                                "```suggestion\n"
                                "FiestaBoard renders this template on the Vestaboard.\n"
                                "```"
                            ),
                        },
                    ],
                }
                print(json.dumps(payload))
                PY

            If the API rejects with `pull_request_review_thread.line must
            be part of the diff`, that finding's line isn't in the diff —
            drop it from `comments` and put it in the top-level `body`
            instead, then resubmit. Don't burn the whole review over one
            bad position.

            ### What goes inline vs. top-level

            **Inline (with ```` ```suggestion ````):**
            - Single-token typos (`teh` → `the`)
            - Branding swaps (`Fiestaboard` → `FiestaBoard`)
            - Outdated values with an obvious correct replacement
            - Code-fence language tags (` ``` ` → ` ```sh `)
            - Inaccurate one-line claims with a verified correct value

            **Top-level body only:**
            - "Missing `## Author` canonical section"
            - "Hero image `./docs/board-display.png` is absent"
            - "This whole code block needs to be re-derived from the manifest"
            - Findings on lines outside the PR diff

            ### Clean-PR shortcut

            If the PR is genuinely clean — no findings worth posting —
            submit a one-line review:

                python3 -c "
                import json
                print(json.dumps({
                    'event': 'COMMENT',
                    'body': (
                        '## Docs review\n\n'
                        '**Verdict:** looks-good — voice, format, and '
                        'accuracy all check out.\n\n'
                        '🤖 Auto-review by `claude-docs-review.yml`.'
                    ),
                }))
                " | gh api \
                  "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/reviews" \
                  --method POST --input -

            Don't manufacture findings to look thorough.

            ## Hard rules

            - Review only. Always `event: "COMMENT"` — never APPROVE,
              never REQUEST_CHANGES. Sign-off stays human.
            - No file edits, no pushes, no PR state changes.
            - One review per run. If you'd post a second, consolidate.
            - Stay focused on the docs diff. Don't review code changes
              even if they're in the same PR.
