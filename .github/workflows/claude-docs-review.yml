name: 'Claude: Docs Auto-Review'

# =============================================================================
# Auto-runs a Claude code review on any PR that touches markdown docs.
# Posts ONE review comment on the PR. Read-only on contents — only
# pull-requests: write so the action can leave its review.
#
# Goal: every docs PR (human-authored or bot-authored) gets a sanity check
# before merge — voice/format match against the canonical formats in
# CLAUDE.md, factual accuracy against the code, no real PII in examples,
# and the FiestaBoard-vs-Vestaboard branding distinction that surfaced
# from rejection PRs #999/#1001.
#
# `pull_request_target` runs from the base ref's workflow definition, so
# malicious head-branch edits to this workflow file can't fire. We also
# only check out the BASE ref — never the PR head — per the CodeQL
# `actions/untrusted-checkout` rule (the "pwn-request" pattern). PR head
# content is read read-only via `gh api .../contents/<path>?ref=<head_sha>`
# from inside the Claude prompt: bytes piped through Claude as data, never
# materialized in a location a later step could execute. Belt and braces:
# `--allowed-tools` is read-only (no Edit/Write, no git push, no shell
# escapes outside the allowlist).
#
# Draft PRs are skipped — a draft signals "not ready for review yet."
# The trigger includes `ready_for_review` so the review fires when the
# author flips draft → ready.
#
# FORK PRs ARE SKIPPED. `claude-code-action` gates every run on the
# ACTOR's repo permission, and a fork contributor has `read` — so the job
# died at "Actor does not have write permissions to the repository"
# before reading a line of the diff, painting a red X on every outside
# contribution that touched a markdown file (#1593). There is no input
# that bypasses that gate, so the honest move is not to fire at all.
# Maintainers who still want the review run it from the Actions tab via
# `workflow_dispatch` with the PR number: the actor is then a maintainer,
# the gate passes, and the review posts exactly as it would have.
# =============================================================================

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '**.md'
      - 'plugins/*/docs/**'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to review. Use this for fork PRs — the automatic trigger skips them.'
        required: true
        type: string

permissions:
  contents: read

# Cancel a prior review for the same PR if a new push comes in — only the
# latest diff matters and we don't want two reviews racing the same comment.
concurrency:
  group: claude-docs-review-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  review:
    name: Claude reviews the docs diff
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Skip Dependabot PRs — they only bump dependency versions and never
    # touch docs in a way this review can usefully critique. The job also
    # can't post a review on them: Dependabot PRs receive a read-only
    # GITHUB_TOKEN, so the gh api review POST 403s every time.
    #
    # Skip fork PRs — the action's actor permission gate fails them (see
    # the header). `workflow_dispatch` is the maintainer-run path and is
    # never gated here: the dispatcher already needs write access, and
    # dispatch carries no `pull_request` context to test.
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event.pull_request.draft == false
          && github.event.pull_request.user.login != 'dependabot[bot]'
          && github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read
      pull-requests: write
      id-token: write
      actions: read
    steps:
      # One source of truth for the PR coordinates, so the rest of the job
      # doesn't branch on event type. On `pull_request_target` they come
      # from the event payload; on `workflow_dispatch` only a number was
      # supplied, so ask the API for the head SHA and base ref. All three
      # values are repo metadata (never PR file content) — safe to expand
      # into later expressions.
      - name: Resolve PR coordinates
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_NUMBER: ${{ inputs.pr_number }}
          EVENT_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            number="$INPUT_NUMBER"
            # Fail loudly on a typo'd number rather than running the
            # review against an empty head SHA.
            meta=$(gh pr view "$number" --json headRefOid,baseRefName)
            head_sha=$(printf '%s' "$meta" | jq -er .headRefOid)
            base_ref=$(printf '%s' "$meta" | jq -er .baseRefName)
          else
            number="$EVENT_NUMBER"
            head_sha="$EVENT_HEAD_SHA"
            base_ref="$EVENT_BASE_REF"
          fi
          {
            echo "number=$number"
            echo "head_sha=$head_sha"
            echo "base_ref=$base_ref"
          } >> "$GITHUB_OUTPUT"
          echo "Reviewing PR #$number (head $head_sha, base $base_ref)"

      - name: Checkout base ref (trusted)
        uses: actions/checkout@v7
        with:
          # `pull_request_target` grants this workflow access to repo
          # secrets — so we MUST NOT check out PR-author-controlled code
          # here (CodeQL's `actions/untrusted-checkout` rule, the
          # "pwn-request" pattern). Checking out the BASE ref gives Claude
          # the trusted CLAUDE.md / canonical README references it needs
          # for voice/format comparison. PR head content is read read-only
          # via `gh api .../contents/<path>?ref=<head_sha>` from inside
          # the prompt — data piped through Claude, never executed.
          ref: ${{ steps.pr.outputs.base_ref }}
          fetch-depth: 1
          persist-credentials: false

      - name: Run Claude review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Skip the OIDC→claude[bot] App-token exchange and post the
          # review under the workflow's own GITHUB_TOKEN. On
          # `pull_request_target` events the App exchange returns
          # `401 Invalid OIDC token` (the App's trust policy doesn't
          # admit pull_request_target subs); providing `github_token`
          # bypasses that exchange entirely, per the action's FAQ. The
          # cost is the review badge — `github-actions[bot]` instead of
          # `claude[bot]`. The downstream feedback-capture workflow
          # already allowlists both bots so the loop is unchanged.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Bot-authored PRs (docs-audit cron, issue-triage worker) need
          # to be reviewed too — that's the whole point. Without this the
          # action's anti-bot guard short-circuits the run. fiestaboard-ci-bot
          # is the App identity that pushes branch updates, so the synchronize
          # events it fires must also clear the guard.
          allowed_bots: 'claude,github-actions,fiestaboard-ci-bot'
          # Surface the SDK transcript so silent permission denials don't
          # look like a clean success.
          show_full_output: 'true'
          claude_args: >-
            --model claude-opus-4-8
            --max-turns 40
            --allowed-tools "Read,Glob,Grep,Bash(ls:*),Bash(cat:*),Bash(find:*),Bash(grep:*),Bash(rg:*),Bash(python3:*),Bash(jq:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh api:*)"
          prompt: |
            You are the FiestaBoard docs reviewer. Review PR
            #${{ steps.pr.outputs.number }} — only the docs changes
            it makes. Skim any non-docs changes for context but don't review
            them; another workflow handles code review.

            ## How to review

            **Important — workspace is at BASE, not PR head.** The
            workflow checks out the trusted base ref (per CodeQL's
            untrusted-checkout rule), so `cat`/`Read`/`ls` see the BASE
            content. PR-head content is read on-demand via:

                gh api \
                  "repos/${{ github.repository }}/contents/<path>?ref=${{ steps.pr.outputs.head_sha }}" \
                  -H "Accept: application/vnd.github.raw"

            That returns raw file bytes (data only — never executed). Use
            this whenever you need the PR's version of a file.

            1. Run `gh pr diff ${{ steps.pr.outputs.number }}` to
               see the exact diff. Focus on `*.md` files and files under
               `plugins/*/docs/` or `docs/`.
            2. Read the root `CLAUDE.md` and `plugins/CLAUDE.md` (if
               touching plugin docs) — these live at base, so plain
               `Read`/`cat` works. They contain the canonical README/SETUP
               section orders, voice rules (examples-first, no marketing
               fluff), and privacy rules (no real PII).
            3. For each changed doc, verify:
               - **Factual accuracy.** Does it match the code? If a doc
                 names a command, check the script exists at the PR head
                 via the `gh api` contents call above (HTTP 404 = doesn't
                 exist). If it cites a manifest variable, fetch the PR's
                 `manifest.json`. If it claims an env var, grep base
                 (`src/`) — base-vs-head drift for env vars is rare. If
                 it references a line number, line numbers rot fast —
                 flag any.
               - **Voice and format.** Does it match the canonical voice
                 and section order? Concrete examples beat placeholders
                 (`"22"` beats `<value>`). Short paragraphs. No marketing
                 words ("powerful", "seamless", "easily").
               - **Privacy.** No real addresses, home coordinates, API
                 keys, phone numbers, or emails. The plugin `manifest.json`
                 `author` field is the only allowed exception.
               - **Internal links.** Every relative link resolves on disk
                 (use `ls` to verify).
               - **Branding.** "FiestaBoard" is the open-source software;
                 "Vestaboard" is the physical hardware it drives. Don't
                 confuse the two — this was the cause of closed PRs #999
                 and #1001. If the diff renames Vestaboard → FiestaBoard
                 (or vice versa) anywhere, flag it loudly.
            4. Save edge nits for last; lead with substantive findings.

            ## Output — post a review with applicable `suggestion` blocks

            Post ONE pull request review via the GitHub Reviews API. The
            review has a **top-level body** (verdict + structural notes)
            AND **inline comments** — and inline comments containing a
            ```` ```suggestion ```` block render an "Apply suggestion"
            button the maintainer clicks to commit the fix straight to the
            PR. This is the whole point of this workflow: every finding
            that has a concrete one-line replacement should ride as an
            inline suggestion. No copy-paste for the reviewer.

            ### Step 1 — identify positions

            Inline comments only attach to lines in the PR diff (added
            `+` lines and surrounding context). Run
            `gh pr diff ${{ steps.pr.outputs.number }}` to see
            what's eligible. For each finding, you need:
              - `path` — file path relative to the repo root
              - `line` — the RIGHT-side line number (the line as it
                appears in the PR head)

            Compute the right-side line number from the diff hunk
            header `@@ -A,B +C,D @@`:
              - new-side line numbers START at C
              - for each context line (` `) or added line (`+`) in the
                hunk body, the new-side line number increments by 1
              - removed lines (`-`) DO NOT consume a new-side line number

            Example: hunk header `@@ -10,4 +12,5 @@`, body:
            ```
             context             ← line 12 (new side)
            -removed
            +added                ← line 13
             context             ← line 14
            +added                ← line 15
             context             ← line 16
            ```

            If you want to spot-check the line number, fetch the PR head
            file via `gh api .../contents/...?ref=<head_sha>` and pipe
            through `cat -n` — but never write PR head content to a
            location where a later step could execute it (data only).

            ### Step 2 — build the review payload

            Construct a JSON object with:
              - `event` — always `"COMMENT"` (never APPROVE / REQUEST_CHANGES;
                this is an auto-review, not sign-off)
              - `body` — top-level summary: verdict + any findings that
                CAN'T be expressed as a single-line replacement (missing
                canonical section, missing hero image, structural reorder,
                lines outside the PR diff)
              - `comments` — array of inline comments. Each entry:
                - `path`, `line`, `side: "RIGHT"`
                - `body` — short human explanation, then a
                  ```` ```suggestion ```` block containing the EXACT
                  replacement text for that line
                - For a multi-line suggestion, add `start_line` and
                  `start_side: "RIGHT"`; the suggestion replaces lines
                  `start_line`..`line` inclusive

            ### Step 3 — POST via `gh api`

            Build the JSON in python3 and pipe to gh api:

                python3 <<'PY' | gh api \
                  "repos/${{ github.repository }}/pulls/${{ steps.pr.outputs.number }}/reviews" \
                  --method POST --input -
                import json
                payload = {
                    "event": "COMMENT",
                    "body": (
                        "## Docs review\n\n"
                        "**Verdict:** small fixes\n\n"
                        "Inline suggestions below — click _Apply suggestion_ "
                        "to commit any you agree with.\n\n"
                        "🤖 Auto-review by `claude-docs-review.yml`."
                    ),
                    "comments": [
                        {
                            "path": "plugins/foo/README.md",
                            "line": 12,
                            "side": "RIGHT",
                            "body": (
                                "FiestaBoard is the software; the hardware "
                                "it drives is Vestaboard.\n\n"
                                "```suggestion\n"
                                "FiestaBoard renders this template on the Vestaboard.\n"
                                "```"
                            ),
                        },
                    ],
                }
                print(json.dumps(payload))
                PY

            If the API rejects with `pull_request_review_thread.line must
            be part of the diff`, that finding's line isn't in the diff —
            drop it from `comments` and put it in the top-level `body`
            instead, then resubmit. Don't burn the whole review over one
            bad position.

            ### What goes inline vs. top-level

            **Inline (with ```` ```suggestion ````):**
            - Single-token typos (`teh` → `the`)
            - Branding swaps (`Fiestaboard` → `FiestaBoard`)
            - Outdated values with an obvious correct replacement
            - Code-fence language tags (` ``` ` → ` ```sh `)
            - Inaccurate one-line claims with a verified correct value

            **Top-level body only:**
            - "Missing `## Author` canonical section"
            - "Hero image `./docs/board-display.png` is absent"
            - "This whole code block needs to be re-derived from the manifest"
            - Findings on lines outside the PR diff

            ### Clean-PR shortcut

            If the PR is genuinely clean — no findings worth posting —
            submit a one-line review:

                python3 -c "
                import json
                print(json.dumps({
                    'event': 'COMMENT',
                    'body': (
                        '## Docs review\n\n'
                        '**Verdict:** looks-good — voice, format, and '
                        'accuracy all check out.\n\n'
                        '🤖 Auto-review by `claude-docs-review.yml`.'
                    ),
                }))
                " | gh api \
                  "repos/${{ github.repository }}/pulls/${{ steps.pr.outputs.number }}/reviews" \
                  --method POST --input -

            Don't manufacture findings to look thorough.

            ## Hard rules

            - Review only. Always `event: "COMMENT"` — never APPROVE,
              never REQUEST_CHANGES. Sign-off stays human.
            - No file edits, no pushes, no PR state changes.
            - One review per run. If you'd post a second, consolidate.
            - Stay focused on the docs diff. Don't review code changes
              even if they're in the same PR.
