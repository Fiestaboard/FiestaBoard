name: Backfill Docker Hub

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only list missing versions without building'
        type: boolean
        default: false
      max_versions:
        description: 'Maximum number of versions to backfill (0 = all)'
        type: number
        default: 5

concurrency:
  group: backfill-docker
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  discover:
    name: Discover Missing Builds
    runs-on: ubuntu-latest
    outputs:
      builds: ${{ steps.find-missing.outputs.builds }}
      versions: ${{ steps.find-missing.outputs.versions }}
      count: ${{ steps.find-missing.outputs.count }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Find missing Docker Hub versions and architectures
        id: find-missing
        run: |
          set -euo pipefail

          REQUIRED_ARCHES=("amd64" "arm64")

          # Helper: fetch all tags with architecture info from Docker Hub (paginated)
          # Returns a JSON array: [{"name":"1.0.0","arches":["amd64","arm64"]}, ...]
          fetch_docker_tags() {
            local REPO="$1"
            local ALL_RESULTS="[]"
            local PAGE=1
            while true; do
              RESPONSE=$(curl -sS --fail-with-body "https://hub.docker.com/v2/repositories/${REPO}/tags?page_size=100&page=${PAGE}" 2>&1) || {
                echo "Note: Docker Hub API request failed for ${REPO} (page $PAGE)." >&2
                break
              }
              PAGE_DATA=$(echo "$RESPONSE" | jq -c '[.results[]? | {name: .name, arches: ([.images[]? | select(.os == "linux") | .architecture] | unique)}]' 2>/dev/null)
              if [ -z "$PAGE_DATA" ] || [ "$PAGE_DATA" = "[]" ] || [ "$PAGE_DATA" = "null" ]; then
                break
              fi
              ALL_RESULTS=$(printf '%s\n%s' "$ALL_RESULTS" "$PAGE_DATA" | jq -sc 'add')
              NEXT=$(echo "$RESPONSE" | jq -r '.next // empty')
              if [ -z "$NEXT" ] || [ "$NEXT" = "null" ]; then
                break
              fi
              PAGE=$((PAGE + 1))
            done
            echo "$ALL_RESULTS"
          }

          # Helper: get linux architectures for a specific version from fetched data
          get_arches() {
            local TAGS_JSON="$1"
            local VERSION="$2"
            echo "$TAGS_JSON" | jq -r --arg v "$VERSION" '.[] | select(.name == $v) | .arches[]' 2>/dev/null
          }

          # --- Fetch existing tags with architecture info from Docker Hub ---
          echo "::group::Fetching Docker Hub tags"

          echo "--- fiestaboard/fiestaboard (v2.x unified) ---"
          DOCKER_UNIFIED=$(fetch_docker_tags "fiestaboard/fiestaboard")
          echo "$DOCKER_UNIFIED" | jq -r '.[] | "\(.name): \(.arches | join(", "))"' 2>/dev/null | sort -V || echo "(none)"

          echo "--- fiestaboard/fiestaboard-api (v1.x API) ---"
          DOCKER_API=$(fetch_docker_tags "fiestaboard/fiestaboard-api")
          echo "$DOCKER_API" | jq -r '.[] | "\(.name): \(.arches | join(", "))"' 2>/dev/null | sort -V || echo "(none)"

          echo "--- fiestaboard/fiestaboard-ui (v1.x UI) ---"
          DOCKER_UI=$(fetch_docker_tags "fiestaboard/fiestaboard-ui")
          echo "$DOCKER_UI" | jq -r '.[] | "\(.name): \(.arches | join(", "))"' 2>/dev/null | sort -V || echo "(none)"

          echo "::endgroup::"

          # --- Get all v1.x and v2.x git tags sorted by version ---
          echo "::group::Git tags (v1.x + v2.x)"
          GIT_TAGS=$(git tag -l 'v1.*' 'v2.*' | sort -V)
          echo "$GIT_TAGS"
          echo "::endgroup::"

          # --- Find versions with missing architectures ---
          # v1.x used split images (fiestaboard-api + fiestaboard-ui)
          # v2.x uses a unified image (fiestaboard)
          echo "::group::Comparing versions and architectures"
          BUILDS="[]"
          VERSIONS=()
          SUMMARY_LINES=()

          for TAG in $GIT_TAGS; do
            VERSION="${TAG#v}"
            MAJOR="${VERSION%%.*}"

            MISSING_ARCHES=()

            if [ "$MAJOR" = "1" ]; then
              # v1.x: check both API and UI repos — missing if either image lacks the arch
              API_ARCHES=$(get_arches "$DOCKER_API" "$VERSION")
              UI_ARCHES=$(get_arches "$DOCKER_UI" "$VERSION")
              for ARCH in "${REQUIRED_ARCHES[@]}"; do
                API_HAS=$(echo "$API_ARCHES" | grep -cFx "$ARCH" || true)
                UI_HAS=$(echo "$UI_ARCHES" | grep -cFx "$ARCH" || true)
                if [ "$API_HAS" -eq 0 ] || [ "$UI_HAS" -eq 0 ]; then
                  MISSING_ARCHES+=("$ARCH")
                fi
              done
            else
              # v2.x: check unified repo
              EXISTING_ARCHES=$(get_arches "$DOCKER_UNIFIED" "$VERSION")
              for ARCH in "${REQUIRED_ARCHES[@]}"; do
                if ! echo "$EXISTING_ARCHES" | grep -qFx "$ARCH"; then
                  MISSING_ARCHES+=("$ARCH")
                fi
              done
            fi

            if [ ${#MISSING_ARCHES[@]} -eq 0 ]; then
              echo "OK:      $TAG (all architectures present)"
              continue
            fi

            if [ ${#MISSING_ARCHES[@]} -eq ${#REQUIRED_ARCHES[@]} ]; then
              echo "MISSING: $TAG (not on Docker Hub)"
              SUMMARY_LINES+=("- \`$TAG\` — **missing entirely**")
            else
              echo "PARTIAL: $TAG (missing: ${MISSING_ARCHES[*]})"
              SUMMARY_LINES+=("- \`$TAG\` — missing: ${MISSING_ARCHES[*]}")
            fi

            VERSIONS+=("$TAG")

            # Add build entries for each missing architecture
            for ARCH in "${MISSING_ARCHES[@]}"; do
              if [ "$ARCH" = "amd64" ]; then
                RUNNER="ubuntu-latest"
              else
                RUNNER="ubuntu-24.04-arm"
              fi
              BUILDS=$(echo "$BUILDS" | jq -c --arg v "$TAG" --arg p "linux/$ARCH" --arg a "$ARCH" --arg r "$RUNNER" \
                '. + [{"version": $v, "platform": $p, "arch": $a, "runner": $r}]')
            done
          done
          echo "::endgroup::"

          BUILD_COUNT=$(echo "$BUILDS" | jq 'length')
          VERSION_COUNT=${#VERSIONS[@]}
          echo "Versions needing work: $VERSION_COUNT"
          echo "Total builds needed: $BUILD_COUNT"

          # Apply max_versions limit if set
          MAX="${{ inputs.max_versions }}"
          MAX="${MAX:-0}"
          if [ "$MAX" -gt 0 ] && [ "$VERSION_COUNT" -gt "$MAX" ]; then
            KEEP_VERSIONS=("${VERSIONS[@]:0:$MAX}")
            echo "Limiting to first $MAX of $VERSION_COUNT versions"
            KEEP_JSON=$(printf '%s\n' "${KEEP_VERSIONS[@]}" | jq -R . | jq -sc .)
            BUILDS=$(echo "$BUILDS" | jq -c --argjson keep "$KEEP_JSON" '[.[] | select(.version as $v | $keep | index($v))]')
            VERSIONS=("${KEEP_VERSIONS[@]}")
            VERSION_COUNT=${#VERSIONS[@]}
            BUILD_COUNT=$(echo "$BUILDS" | jq 'length')
          fi

          # Output for matrix strategies
          echo "builds=$BUILDS" >> "$GITHUB_OUTPUT"
          if [ "$VERSION_COUNT" -eq 0 ]; then
            echo "versions=[]" >> "$GITHUB_OUTPUT"
          else
            VERSIONS_JSON=$(printf '%s\n' "${VERSIONS[@]}" | jq -R . | jq -sc .)
            echo "versions=$VERSIONS_JSON" >> "$GITHUB_OUTPUT"
          fi
          echo "count=$BUILD_COUNT" >> "$GITHUB_OUTPUT"

          # --- Write job summary ---
          {
            echo "## Docker Hub Backfill Discovery"
            echo ""
            echo "- **Git tags (v1.x + v2.x):** $(echo "$GIT_TAGS" | wc -w)"
            echo "- **Docker Hub tags (unified):** $(echo "$DOCKER_UNIFIED" | jq 'length')"
            echo "- **Docker Hub tags (api):** $(echo "$DOCKER_API" | jq 'length')"
            echo "- **Docker Hub tags (ui):** $(echo "$DOCKER_UI" | jq 'length')"
            echo "- **Versions needing work:** $VERSION_COUNT"
            echo "- **Total builds needed:** $BUILD_COUNT"
            if [ ${#SUMMARY_LINES[@]} -gt 0 ]; then
              echo ""
              echo "### Versions to backfill"
              printf '%s\n' "${SUMMARY_LINES[@]}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  backfill:
    name: Build ${{ matrix.version }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: [discover]
    if: ${{ needs.discover.outputs.count != '0' && !inputs.dry_run }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include: ${{ fromJson(needs.discover.outputs.builds) }}
    steps:
      - name: Checkout tag
        uses: actions/checkout@v6
        with:
          ref: ${{ matrix.version }}

      - name: Extract version number
        id: ver
        run: |
          VERSION="${{ matrix.version }}"
          echo "number=${VERSION#v}" >> "$GITHUB_OUTPUT"

      - name: Detect Dockerfile layout
        id: layout
        run: |
          if [ -f "./Dockerfile" ]; then
            echo "type=unified" >> "$GITHUB_OUTPUT"
            echo "Detected unified Dockerfile (v2.x style)"
          elif [ -f "./Dockerfile.api" ] && [ -f "./Dockerfile.ui" ]; then
            echo "type=split" >> "$GITHUB_OUTPUT"
            echo "Detected split Dockerfiles (v1.x style: Dockerfile.api + Dockerfile.ui)"
          else
            echo "::error::No recognized Dockerfile layout at ${{ matrix.version }}"
            ls -la Dockerfile* 2>/dev/null || echo "No Dockerfile* files found"
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # --- Unified build (v2.x: single Dockerfile) ---

      - name: Build and push unified image
        if: steps.layout.outputs.type == 'unified'
        id: build-unified
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            VERSION=${{ steps.ver.outputs.number }}
          outputs: type=image,name=fiestaboard/fiestaboard,push-by-digest=true,name-canonical=true,push=true

      - name: Export unified digest
        if: steps.layout.outputs.type == 'unified'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build-unified.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload unified digest
        if: steps.layout.outputs.type == 'unified'
        uses: actions/upload-artifact@v6
        with:
          name: digests-${{ matrix.version }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

      # --- Split build (v1.x: Dockerfile.api + Dockerfile.ui) ---

      - name: Build and push API image
        if: steps.layout.outputs.type == 'split'
        id: build-api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.api
          platforms: ${{ matrix.platform }}
          build-args: |
            VERSION=${{ steps.ver.outputs.number }}
          outputs: type=image,name=fiestaboard/fiestaboard-api,push-by-digest=true,name-canonical=true,push=true

      - name: Export API digest
        if: steps.layout.outputs.type == 'split'
        run: |
          mkdir -p /tmp/digests-api
          digest="${{ steps.build-api.outputs.digest }}"
          touch "/tmp/digests-api/${digest#sha256:}"

      - name: Upload API digest
        if: steps.layout.outputs.type == 'split'
        uses: actions/upload-artifact@v6
        with:
          name: digests-api-${{ matrix.version }}-${{ matrix.arch }}
          path: /tmp/digests-api/*
          if-no-files-found: error
          retention-days: 1

      - name: Build and push UI image
        if: steps.layout.outputs.type == 'split'
        id: build-ui
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.ui
          platforms: ${{ matrix.platform }}
          build-args: |
            VERSION=${{ steps.ver.outputs.number }}
          outputs: type=image,name=fiestaboard/fiestaboard-ui,push-by-digest=true,name-canonical=true,push=true

      - name: Export UI digest
        if: steps.layout.outputs.type == 'split'
        run: |
          mkdir -p /tmp/digests-ui
          digest="${{ steps.build-ui.outputs.digest }}"
          touch "/tmp/digests-ui/${digest#sha256:}"

      - name: Upload UI digest
        if: steps.layout.outputs.type == 'split'
        uses: actions/upload-artifact@v6
        with:
          name: digests-ui-${{ matrix.version }}-${{ matrix.arch }}
          path: /tmp/digests-ui/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge ${{ matrix.version }}
    runs-on: ubuntu-latest
    needs: [discover, backfill]
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJson(needs.discover.outputs.versions) }}
    steps:
      - name: Extract version info
        id: ver
        run: |
          VERSION="${{ matrix.version }}"
          echo "number=${VERSION#v}" >> "$GITHUB_OUTPUT"
          MAJOR="${VERSION#v}"
          MAJOR="${MAJOR%%.*}"
          echo "major=$MAJOR" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # --- Download per-architecture artifacts ---
      # Only artifacts for architectures we actually built will exist;
      # continue-on-error lets us handle arches that were already on Docker Hub.

      # Unified (v2.x)
      - name: Download unified amd64 digest
        if: steps.ver.outputs.major != '1'
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: digests-${{ matrix.version }}-amd64
          path: /tmp/digests-amd64

      - name: Download unified arm64 digest
        if: steps.ver.outputs.major != '1'
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: digests-${{ matrix.version }}-arm64
          path: /tmp/digests-arm64

      - name: Create unified manifest
        if: steps.ver.outputs.major != '1'
        run: |
          VERSION="${{ steps.ver.outputs.number }}"
          REPO="fiestaboard/fiestaboard"
          SOURCES=""

          # For each required architecture, use new build digest or existing Docker Hub digest
          for ARCH in amd64 arm64; do
            DIR="/tmp/digests-${ARCH}"
            if [ -d "$DIR" ] && [ "$(ls -A "$DIR" 2>/dev/null)" ]; then
              for file in "$DIR"/*; do HASH=$(basename "$file"); break; done
              SOURCES="$SOURCES ${REPO}@sha256:${HASH}"
              echo "NEW ${ARCH}: sha256:${HASH}"
            else
              # Architecture was not rebuilt — fetch existing digest from Docker Hub
              DIGEST=$(docker buildx imagetools inspect "${REPO}:${VERSION}" --raw 2>/dev/null | \
                jq -r --arg arch "$ARCH" '.manifests[]? | select(.platform.architecture == $arch and .platform.os == "linux") | .digest' 2>/dev/null) || true
              if [ -n "$DIGEST" ] && [ "$DIGEST" != "null" ]; then
                SOURCES="$SOURCES ${REPO}@${DIGEST}"
                echo "EXISTING ${ARCH}: ${DIGEST}"
              else
                echo "WARNING: No digest available for ${ARCH}"
              fi
            fi
          done

          if [ -n "$SOURCES" ]; then
            docker buildx imagetools create \
              -t "${REPO}:${VERSION}" \
              $SOURCES
          fi

      # Split API (v1.x)
      - name: Download API amd64 digest
        if: steps.ver.outputs.major == '1'
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: digests-api-${{ matrix.version }}-amd64
          path: /tmp/digests-api-amd64

      - name: Download API arm64 digest
        if: steps.ver.outputs.major == '1'
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: digests-api-${{ matrix.version }}-arm64
          path: /tmp/digests-api-arm64

      - name: Create API manifest
        if: steps.ver.outputs.major == '1'
        run: |
          VERSION="${{ steps.ver.outputs.number }}"
          REPO="fiestaboard/fiestaboard-api"
          SOURCES=""

          for ARCH in amd64 arm64; do
            DIR="/tmp/digests-api-${ARCH}"
            if [ -d "$DIR" ] && [ "$(ls -A "$DIR" 2>/dev/null)" ]; then
              for file in "$DIR"/*; do HASH=$(basename "$file"); break; done
              SOURCES="$SOURCES ${REPO}@sha256:${HASH}"
              echo "NEW ${ARCH}: sha256:${HASH}"
            else
              DIGEST=$(docker buildx imagetools inspect "${REPO}:${VERSION}" --raw 2>/dev/null | \
                jq -r --arg arch "$ARCH" '.manifests[]? | select(.platform.architecture == $arch and .platform.os == "linux") | .digest' 2>/dev/null) || true
              if [ -n "$DIGEST" ] && [ "$DIGEST" != "null" ]; then
                SOURCES="$SOURCES ${REPO}@${DIGEST}"
                echo "EXISTING ${ARCH}: ${DIGEST}"
              else
                echo "WARNING: No digest available for ${ARCH}"
              fi
            fi
          done

          if [ -n "$SOURCES" ]; then
            docker buildx imagetools create \
              -t "${REPO}:${VERSION}" \
              $SOURCES
          fi

      # Split UI (v1.x)
      - name: Download UI amd64 digest
        if: steps.ver.outputs.major == '1'
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: digests-ui-${{ matrix.version }}-amd64
          path: /tmp/digests-ui-amd64

      - name: Download UI arm64 digest
        if: steps.ver.outputs.major == '1'
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: digests-ui-${{ matrix.version }}-arm64
          path: /tmp/digests-ui-arm64

      - name: Create UI manifest
        if: steps.ver.outputs.major == '1'
        run: |
          VERSION="${{ steps.ver.outputs.number }}"
          REPO="fiestaboard/fiestaboard-ui"
          SOURCES=""

          for ARCH in amd64 arm64; do
            DIR="/tmp/digests-ui-${ARCH}"
            if [ -d "$DIR" ] && [ "$(ls -A "$DIR" 2>/dev/null)" ]; then
              for file in "$DIR"/*; do HASH=$(basename "$file"); break; done
              SOURCES="$SOURCES ${REPO}@sha256:${HASH}"
              echo "NEW ${ARCH}: sha256:${HASH}"
            else
              DIGEST=$(docker buildx imagetools inspect "${REPO}:${VERSION}" --raw 2>/dev/null | \
                jq -r --arg arch "$ARCH" '.manifests[]? | select(.platform.architecture == $arch and .platform.os == "linux") | .digest' 2>/dev/null) || true
              if [ -n "$DIGEST" ] && [ "$DIGEST" != "null" ]; then
                SOURCES="$SOURCES ${REPO}@${DIGEST}"
                echo "EXISTING ${ARCH}: ${DIGEST}"
              else
                echo "WARNING: No digest available for ${ARCH}"
              fi
            fi
          done

          if [ -n "$SOURCES" ]; then
            docker buildx imagetools create \
              -t "${REPO}:${VERSION}" \
              $SOURCES
          fi
