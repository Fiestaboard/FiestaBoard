name: Backfill Docker Hub

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only list missing versions without building'
        type: boolean
        default: false
      max_versions:
        description: 'Maximum number of versions to backfill (0 = all)'
        type: number
        default: 0

concurrency:
  group: backfill-docker
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  discover:
    name: Discover Missing Versions
    runs-on: ubuntu-latest
    outputs:
      missing: ${{ steps.find-missing.outputs.missing }}
      count: ${{ steps.find-missing.outputs.count }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Find missing Docker Hub versions
        id: find-missing
        run: |
          set -euo pipefail

          # Helper: fetch all tags from a Docker Hub repository (paginated)
          fetch_docker_tags() {
            local REPO="$1"
            local TAGS=""
            local PAGE=1
            while true; do
              RESPONSE=$(curl -sS --fail-with-body "https://hub.docker.com/v2/repositories/${REPO}/tags?page_size=100&page=${PAGE}" 2>&1) || {
                echo "Note: Docker Hub API request failed for ${REPO} (page $PAGE)." >&2
                break
              }
              PAGE_TAGS=$(echo "$RESPONSE" | jq -r '.results[]?.name // empty' 2>/dev/null)
              if [ -z "$PAGE_TAGS" ]; then
                break
              fi
              TAGS="${TAGS}${PAGE_TAGS}"$'\n'
              NEXT=$(echo "$RESPONSE" | jq -r '.next // empty')
              if [ -z "$NEXT" ] || [ "$NEXT" = "null" ]; then
                break
              fi
              PAGE=$((PAGE + 1))
            done
            echo "$TAGS"
          }

          # --- Fetch existing tags from Docker Hub repositories ---
          echo "::group::Fetching Docker Hub tags"

          echo "--- fiestaboard/fiestaboard (v2.x unified) ---"
          DOCKER_TAGS_UNIFIED=$(fetch_docker_tags "fiestaboard/fiestaboard")
          echo "$DOCKER_TAGS_UNIFIED" | sort -V | grep -v '^$' || echo "(none)"

          echo "--- fiestaboard/fiestaboard-api (v1.x API) ---"
          DOCKER_TAGS_API=$(fetch_docker_tags "fiestaboard/fiestaboard-api")
          echo "$DOCKER_TAGS_API" | sort -V | grep -v '^$' || echo "(none)"

          echo "::endgroup::"

          # --- Get all v1.x and v2.x git tags sorted by version ---
          echo "::group::Git tags (v1.x + v2.x)"
          GIT_TAGS=$(git tag -l 'v1.*' 'v2.*' | sort -V)
          echo "$GIT_TAGS"
          echo "::endgroup::"

          # --- Find versions in git but missing from Docker Hub ---
          # v1.x used split images (fiestaboard-api + fiestaboard-ui)
          # v2.x uses a unified image (fiestaboard)
          echo "::group::Comparing versions"
          MISSING=()
          for TAG in $GIT_TAGS; do
            VERSION="${TAG#v}"
            MAJOR="${VERSION%%.*}"
            if [ "$MAJOR" = "1" ]; then
              if echo "$DOCKER_TAGS_API" | grep -qFx "$VERSION"; then
                echo "OK:      $TAG ($VERSION exists on Docker Hub as fiestaboard-api)"
              else
                MISSING+=("$TAG")
                echo "MISSING: $TAG ($VERSION not on Docker Hub)"
              fi
            else
              if echo "$DOCKER_TAGS_UNIFIED" | grep -qFx "$VERSION"; then
                echo "OK:      $TAG ($VERSION exists on Docker Hub)"
              else
                MISSING+=("$TAG")
                echo "MISSING: $TAG ($VERSION not on Docker Hub)"
              fi
            fi
          done
          echo "::endgroup::"

          TOTAL=${#MISSING[@]}
          echo "Total missing versions: $TOTAL"

          # Apply max_versions limit if set
          MAX="${{ inputs.max_versions }}"
          MAX="${MAX:-0}"
          if [ "$MAX" -gt 0 ] && [ "$TOTAL" -gt "$MAX" ]; then
            MISSING=("${MISSING[@]:0:$MAX}")
            echo "Limiting to first $MAX of $TOTAL missing versions"
          fi

          # Output as JSON array for the matrix strategy
          if [ ${#MISSING[@]} -eq 0 ]; then
            echo "missing=[]" >> "$GITHUB_OUTPUT"
          else
            JSON=$(printf '%s\n' "${MISSING[@]}" | jq -R . | jq -sc .)
            echo "missing=$JSON" >> "$GITHUB_OUTPUT"
          fi
          echo "count=${#MISSING[@]}" >> "$GITHUB_OUTPUT"

          # --- Write job summary ---
          {
            echo "## Docker Hub Backfill Discovery"
            echo ""
            echo "- **Git tags (v1.x + v2.x):** $(echo "$GIT_TAGS" | wc -w)"
            echo "- **Docker Hub tags (unified):** $(echo "$DOCKER_TAGS_UNIFIED" | grep -cv '^$' || echo 0)"
            echo "- **Docker Hub tags (api):** $(echo "$DOCKER_TAGS_API" | grep -cv '^$' || echo 0)"
            echo "- **Missing versions:** $TOTAL"
            if [ ${#MISSING[@]} -gt 0 ]; then
              echo ""
              echo "### Versions to backfill"
              printf -- '- \`%s\`\n' "${MISSING[@]}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  backfill:
    name: Build ${{ matrix.version }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: [discover]
    if: ${{ needs.discover.outputs.count != '0' && !inputs.dry_run }}
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJson(needs.discover.outputs.missing) }}
        platform:
          - linux/amd64
          - linux/arm64
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - name: Checkout tag
        uses: actions/checkout@v6
        with:
          ref: ${{ matrix.version }}

      - name: Extract version number
        id: ver
        run: |
          VERSION="${{ matrix.version }}"
          echo "number=${VERSION#v}" >> "$GITHUB_OUTPUT"

      - name: Detect Dockerfile layout
        id: layout
        run: |
          if [ -f "./Dockerfile" ]; then
            echo "type=unified" >> "$GITHUB_OUTPUT"
            echo "Detected unified Dockerfile (v2.x style)"
          elif [ -f "./Dockerfile.api" ] && [ -f "./Dockerfile.ui" ]; then
            echo "type=split" >> "$GITHUB_OUTPUT"
            echo "Detected split Dockerfiles (v1.x style: Dockerfile.api + Dockerfile.ui)"
          else
            echo "::error::No recognized Dockerfile layout at ${{ matrix.version }}"
            ls -la Dockerfile* 2>/dev/null || echo "No Dockerfile* files found"
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # --- Unified build (v2.x: single Dockerfile) ---

      - name: Build and push unified image
        if: steps.layout.outputs.type == 'unified'
        id: build-unified
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            VERSION=${{ steps.ver.outputs.number }}
          outputs: type=image,name=fiestaboard/fiestaboard,push-by-digest=true,name-canonical=true,push=true

      - name: Export unified digest
        if: steps.layout.outputs.type == 'unified'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build-unified.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload unified digest
        if: steps.layout.outputs.type == 'unified'
        uses: actions/upload-artifact@v6
        with:
          name: digests-${{ matrix.version }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

      # --- Split build (v1.x: Dockerfile.api + Dockerfile.ui) ---

      - name: Build and push API image
        if: steps.layout.outputs.type == 'split'
        id: build-api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.api
          platforms: ${{ matrix.platform }}
          build-args: |
            VERSION=${{ steps.ver.outputs.number }}
          outputs: type=image,name=fiestaboard/fiestaboard-api,push-by-digest=true,name-canonical=true,push=true

      - name: Export API digest
        if: steps.layout.outputs.type == 'split'
        run: |
          mkdir -p /tmp/digests-api
          digest="${{ steps.build-api.outputs.digest }}"
          touch "/tmp/digests-api/${digest#sha256:}"

      - name: Upload API digest
        if: steps.layout.outputs.type == 'split'
        uses: actions/upload-artifact@v6
        with:
          name: digests-api-${{ matrix.version }}-${{ matrix.arch }}
          path: /tmp/digests-api/*
          if-no-files-found: error
          retention-days: 1

      - name: Build and push UI image
        if: steps.layout.outputs.type == 'split'
        id: build-ui
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.ui
          platforms: ${{ matrix.platform }}
          build-args: |
            VERSION=${{ steps.ver.outputs.number }}
          outputs: type=image,name=fiestaboard/fiestaboard-ui,push-by-digest=true,name-canonical=true,push=true

      - name: Export UI digest
        if: steps.layout.outputs.type == 'split'
        run: |
          mkdir -p /tmp/digests-ui
          digest="${{ steps.build-ui.outputs.digest }}"
          touch "/tmp/digests-ui/${digest#sha256:}"

      - name: Upload UI digest
        if: steps.layout.outputs.type == 'split'
        uses: actions/upload-artifact@v6
        with:
          name: digests-ui-${{ matrix.version }}-${{ matrix.arch }}
          path: /tmp/digests-ui/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge ${{ matrix.version }}
    runs-on: ubuntu-latest
    needs: [discover, backfill]
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJson(needs.discover.outputs.missing) }}
    steps:
      - name: Extract version number
        id: ver
        run: |
          VERSION="${{ matrix.version }}"
          echo "number=${VERSION#v}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # --- Unified manifest (v2.x) ---

      - name: Download unified digests
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.version }}-*
          merge-multiple: true

      - name: Create unified manifest
        run: |
          if [ -d /tmp/digests ] && [ "$(ls -A /tmp/digests 2>/dev/null)" ]; then
            cd /tmp/digests
            docker buildx imagetools create \
              -t fiestaboard/fiestaboard:${{ steps.ver.outputs.number }} \
              $(printf 'fiestaboard/fiestaboard@sha256:%s ' *)
          fi

      # --- API manifest (v1.x) ---

      - name: Download API digests
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          path: /tmp/digests-api
          pattern: digests-api-${{ matrix.version }}-*
          merge-multiple: true

      - name: Create API manifest
        run: |
          if [ -d /tmp/digests-api ] && [ "$(ls -A /tmp/digests-api 2>/dev/null)" ]; then
            cd /tmp/digests-api
            docker buildx imagetools create \
              -t fiestaboard/fiestaboard-api:${{ steps.ver.outputs.number }} \
              $(printf 'fiestaboard/fiestaboard-api@sha256:%s ' *)
          fi

      # --- UI manifest (v1.x) ---

      - name: Download UI digests
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          path: /tmp/digests-ui
          pattern: digests-ui-${{ matrix.version }}-*
          merge-multiple: true

      - name: Create UI manifest
        run: |
          if [ -d /tmp/digests-ui ] && [ "$(ls -A /tmp/digests-ui 2>/dev/null)" ]; then
            cd /tmp/digests-ui
            docker buildx imagetools create \
              -t fiestaboard/fiestaboard-ui:${{ steps.ver.outputs.number }} \
              $(printf 'fiestaboard/fiestaboard-ui@sha256:%s ' *)
          fi
