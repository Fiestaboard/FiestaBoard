name: Registry Security Scan

on:
  schedule:
    - cron: '0 0 * * 0'  # Every Sunday at midnight UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  scan-plugins:
    name: Scan Plugin Registry
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Python 3.14
      uses: actions/setup-python@v6
      with:
        python-version: "3.14"

    - name: Install scanning tools
      run: |
        python -m pip install --upgrade pip
        pip install bandit pip-audit

    - name: Scan all registry plugins
      id: scan
      run: python scripts/scan_registry.py --verbose --output scan-results
      continue-on-error: true

    - name: Upload scan results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: registry-scan-results
        path: scan-results/
        retention-days: 90

    - name: Create or update issue on vulnerabilities
      if: steps.scan.outputs.has_vulnerabilities == 'true'
      uses: actions/github-script@v9
      with:
        script: |
          const fs = require('fs');
          const report = fs.readFileSync('scan-results/scan-report.md', 'utf8');
          const title = '🔒 Plugin Registry Security Scan: Vulnerabilities Found';

          // Look for an existing open issue with this title
          const { data: issues } = await github.rest.issues.listForRepo({
            owner: context.repo.owner,
            repo: context.repo.repo,
            state: 'open',
            labels: 'security',
            per_page: 100
          });

          const existing = issues.find(i => i.title === title);
          const body = [
            report,
            '',
            '---',
            '_This issue was automatically created by the weekly plugin registry security scan._',
            `_Last updated: ${new Date().toISOString()}_`
          ].join('\n');

          if (existing) {
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: existing.number,
              body
            });
            console.log(`Updated existing issue #${existing.number}`);
          } else {
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['security']
            });
            console.log('Created new security scan issue');
          }
