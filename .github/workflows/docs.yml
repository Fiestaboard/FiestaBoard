# Build docs in this repo (Fiestaboard/FiestaBoard) and deploy them to
# the Fiestaboard/fiestaboard.github.io repo as incremental commits.
# That repo auto-publishes to https://fiestaboard.github.io since it is
# the organization's GitHub Pages repo.
name: Deploy Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs-site/**'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build & Deploy Docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source repo
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - name: Install dependencies
        working-directory: docs-site
        run: npm ci

      - name: Build Docusaurus site
        working-directory: docs-site
        run: npm run build

      # Push the built static site to fiestaboard.github.io as an incremental commit.
      # That repo serves from main automatically — no Pages config needed here.
      - name: Deploy to fiestaboard.github.io
        run: |
          REPO_URL="https://x-access-token:${DEPLOY_TOKEN}@github.com/Fiestaboard/fiestaboard.github.io.git"
          git clone --depth 1 "$REPO_URL" deploy-target
          cd deploy-target
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Remove old site files but keep .git
          git rm -rf --ignore-unmatch .
          # Copy in the new build (including hidden files like .nojekyll)
          cp -r ../docs-site/build/. .
          git add .
          # Only push if there are changes
          if git diff --cached --quiet; then
            echo "No changes to deploy."
          else
            git commit -m "docs: deploy from ${GITHUB_REPOSITORY}@${GITHUB_SHA::7}"
            git push origin main
          fi
        env:
          DEPLOY_TOKEN: ${{ secrets.RELEASE_PAT }}
