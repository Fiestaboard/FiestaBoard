# Build docs in this repo (Fiestaboard/FiestaBoard) and deploy them to
# the Fiestaboard/fiestaboard.github.io repo as incremental commits.
# That repo auto-publishes to https://fiestaboard.github.io since it is
# the organization's GitHub Pages repo.
#
# Triggers:
#   1. push to main that touches docs-site/ — rebuilds and deploys the
#      site so that screenshot, content, or config changes ship without
#      waiting for a release.
#   2. workflow_dispatch (called by the release workflow with a tag) —
#      creates a Docusaurus version snapshot, builds, then deploys.
#      Patch releases (e.g. 2.5.0 → 2.5.1) share the same docs version
#      (e.g. "2.5") so the snapshot step is a no-op for them.
name: 'Release: Deploy Docs Site'

on:
  push:
    branches: [main]
    paths:
      - 'docs-site/**'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to version docs for (e.g. v2.5.0). Leave empty to just redeploy.'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build & Deploy Docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source repo
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1
          token: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - name: Install dependencies
        working-directory: docs-site
        run: npm ci

      - name: Cache Docusaurus build
        uses: actions/cache@v5
        with:
          path: |
            docs-site/.docusaurus
            docs-site/node_modules/.cache
          key: docusaurus-${{ runner.os }}-${{ hashFiles('docs-site/src/**', 'docs-site/docs/**', 'docs-site/docusaurus.config.ts', 'docs-site/package-lock.json') }}
          restore-keys: |
            docusaurus-${{ runner.os }}-

      # --- Version snapshot (only when dispatched with a release tag) ---

      - name: Determine docs version
        if: inputs.tag != ''
        id: version
        run: |
          TAG="${{ inputs.tag }}"
          # Strip leading 'v' if present (v2.5.0 → 2.5.0)
          SEMVER="${TAG#v}"
          MAJOR="${SEMVER%%.*}"
          REST="${SEMVER#*.}"
          MINOR="${REST%%.*}"
          DOCS_VERSION="${MAJOR}.${MINOR}"

          echo "docs_version=${DOCS_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved docs version: ${DOCS_VERSION}"

      - name: Check if version already exists
        if: inputs.tag != ''
        id: check-version
        run: |
          DOCS_VERSION="${{ steps.version.outputs.docs_version }}"
          if [ -f docs-site/versions.json ] && grep -q "\"${DOCS_VERSION}\"" docs-site/versions.json; then
            echo "Docs version ${DOCS_VERSION} already exists — skipping snapshot."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Docs version ${DOCS_VERSION} is new — will create snapshot."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create docs version snapshot
        if: inputs.tag != '' && steps.check-version.outputs.skip != 'true'
        working-directory: docs-site
        run: npx docusaurus docs:version "${{ steps.version.outputs.docs_version }}"

      # --- Build (always) ---

      - name: Build Docusaurus site
        working-directory: docs-site
        run: npm run build

      # --- Push version snapshot to main (after successful build) ---

      - name: Commit and push versioned docs
        if: inputs.tag != '' && steps.check-version.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add docs-site/versions.json docs-site/versioned_docs docs-site/versioned_sidebars
          git commit -m "docs: snapshot version ${{ steps.version.outputs.docs_version }} docs"
          git push origin main

      # --- Deploy (always) ---

      # Push the built static site to fiestaboard.github.io as an incremental commit.
      # That repo serves from main automatically — no Pages config needed here.
      - name: Deploy to fiestaboard.github.io
        run: |
          REPO_URL="https://x-access-token:${DEPLOY_TOKEN}@github.com/Fiestaboard/fiestaboard.github.io.git"
          git clone --depth 1 "$REPO_URL" deploy-target
          cd deploy-target
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Remove old site files but keep .git
          git rm -rf --ignore-unmatch .
          # Copy in the new build (including hidden files like .nojekyll)
          cp -r ../docs-site/build/. .
          git add .
          # Only push if there are changes
          if git diff --cached --quiet; then
            echo "No changes to deploy."
          else
            git commit -m "docs: deploy from ${GITHUB_REPOSITORY}@${GITHUB_SHA::7}"
            git push origin main
          fi
        env:
          DEPLOY_TOKEN: ${{ secrets.RELEASE_PAT }}
