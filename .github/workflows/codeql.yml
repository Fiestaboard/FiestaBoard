name: CodeQL

# =============================================================================
# GitHub's built-in static analyzer. Free for public repos. Finds classes
# of issues bandit can't (taint flow, SSRF, prototype pollution, etc.) and
# results land in the Security tab.
#
# Runs on PR (so issues surface before merge) and weekly on a schedule
# (catches new rules added to the upstream CodeQL packs without waiting
# for a code change to trigger analysis).
# =============================================================================

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'plugins/**'
      - 'web/src/**'
      - '.github/workflows/codeql.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'plugins/**'
      - 'web/src/**'
      - '.github/workflows/codeql.yml'
  schedule:
    - cron: '23 6 * * 1'  # 06:23 UTC Mondays

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]

    steps:
      - uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          # security-and-quality includes the default security queries
          # plus best-practice checks. Drop to `security-extended` if
          # the quality findings prove too noisy in practice.
          queries: security-and-quality

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
