name: Refresh Plugin Stats

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.RELEASE_PAT }}

      - name: Fetch plugin stats
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: python3 scripts/fetch_plugin_stats.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs-site/static/plugin-stats.json
          if git diff --staged --quiet; then
            echo "No changes."
          else
            # [skip ci] so the daily stats refresh doesn't trigger
            # docs.yml (6-min Docusaurus build) on every cron run.
            git commit -m "chore: refresh plugin stats [skip ci]"
            git push
          fi
