# Auto-merge Dependabot PRs when they are approved.
# Trigger: someone submits an "Approve" review on a Dependabot PR.
# Note: If branch protection requires status checks, merge only succeeds after checks pass.
name: Merge Dependabot PRs

on:
  pull_request_review:
    types: [submitted]

permissions:
  contents: write
  pull-requests: write

jobs:
  merge-dependabot:
    name: Merge approved Dependabot PR
    runs-on: ubuntu-latest
    if: github.event.review.state == 'approved' && (github.event.pull_request.user.login == 'dependabot' || github.event.pull_request.user.login == 'dependabot[bot]')
    steps:
      - name: Merge pull request
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const repo = context.repo;
            const reviews = await github.rest.pulls.listReviews({
              owner: repo.owner,
              repo: repo.repo,
              pull_number: pr.number,
            });
            const approvals = reviews.data.filter(r => r.state === 'APPROVED');
            if (approvals.length === 0) {
              core.warning('No approvals found; skipping merge.');
              return;
            }
            await github.rest.pulls.merge({
              owner: repo.owner,
              repo: repo.repo,
              pull_number: pr.number,
              merge_method: 'squash',
            });
            core.info(`Merged Dependabot PR #${pr.number}`);
