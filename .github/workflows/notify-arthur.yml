name: Notify Arthur

on:
  issues:
    types: [opened, assigned, labeled]
  issue_comment:
    types: [created]
  pull_request:
    types: [review_requested]
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created]
  check_suite:
    types: [completed]

jobs:
  notify:
    runs-on: ubuntu-latest
    if: github.actor != 'arthurandersonbot' || github.event_name == 'pull_request_review' || github.event_name == 'pull_request_review_comment'
    steps:
      - name: Process and forward event
        uses: actions/github-script@v7
        env:
          HOOKS_URL: ${{ secrets.OPENCLAW_HOOKS_URL }}
          HOOKS_TOKEN: ${{ secrets.OPENCLAW_HOOKS_TOKEN }}
          ARTHUR_TOKEN: ${{ secrets.ARTHUR_GH_TOKEN }}
        with:
          script: |
            const ARTHUR = 'arthurandersonbot';
            const REPO = 'Fiestaboard/FiestaBoard';
            const [OWNER, REPO_NAME] = REPO.split('/');
            const MAX_PRS = 4;

            const hooksUrl = process.env.HOOKS_URL;
            const hooksToken = process.env.HOOKS_TOKEN;
            const arthurToken = process.env.ARTHUR_TOKEN;
            if (!hooksUrl || !hooksToken) {
              core.info('Hooks not configured, skipping');
              return;
            }

            const event = context.eventName;
            const action = context.payload.action;
            const payload = context.payload;

            // React as Arthur (👀) using his own token so it shows up as arthurandersonbot
            async function acknowledge() {
              if (!arthurToken) return;
              try {
                const arthurOctokit = github.getOctokit(arthurToken);
                if (event === 'issue_comment') {
                  await arthurOctokit.rest.reactions.createForIssueComment({
                    owner: OWNER, repo: REPO_NAME,
                    comment_id: payload.comment.id,
                    content: 'eyes',
                  });
                } else if (event === 'pull_request_review_comment') {
                  await arthurOctokit.rest.reactions.createForPullRequestReviewComment({
                    owner: OWNER, repo: REPO_NAME,
                    comment_id: payload.comment.id,
                    content: 'eyes',
                  });
                } else if (event === 'issues') {
                  await arthurOctokit.rest.reactions.createForIssue({
                    owner: OWNER, repo: REPO_NAME,
                    issue_number: payload.issue.number,
                    content: 'eyes',
                  });
                } else if (event === 'pull_request_review') {
                  await arthurOctokit.rest.reactions.createForIssue({
                    owner: OWNER, repo: REPO_NAME,
                    issue_number: payload.pull_request.number,
                    content: 'eyes',
                  });
                } else if (event === 'pull_request') {
                  await arthurOctokit.rest.reactions.createForIssue({
                    owner: OWNER, repo: REPO_NAME,
                    issue_number: payload.pull_request.number,
                    content: 'eyes',
                  });
                }
              } catch (err) {
                core.warning(`Failed to add reaction: ${err.message}`);
              }
            }

            function preamble() {
              return [
                `Read workspace/skills/fiestaboard/SKILL.md, workspace/memory/fiestaboard-state.json, and workspace/memory/repos/fiestaboard-learnings.md.`,
                `cd /Users/arthuranderson/projects/FiestaBoard && git checkout main && git pull origin main.`,
                `Check your open PR count: gh pr list --author @me -R ${REPO} --state open | wc -l.`,
                `If you have ${MAX_PRS}+ open PRs and this event requires opening a new one, defer — log it in fiestaboard-state.json for the next standup instead.`,
              ].join('\n');
            }

            let message = null;
            let sessionKey = 'hook:github';
            let model = 'ollama/qwen3:8b';
            let timeout = 300;

            // --- Issues ---
            if (event === 'issues' && (action === 'opened' || action === 'labeled')) {
              const issue = payload.issue || {};
              const labels = (issue.labels || []).map(l => l.name);
              const isBug = labels.includes('bug');
              const assignee = issue.assignee?.login;
              if (!isBug && assignee !== ARTHUR) { core.info('Not relevant'); return; }
              await acknowledge();
              const what = isBug
                ? `New bug filed: #${issue.number} "${issue.title}".`
                : `Issue #${issue.number} "${issue.title}" assigned to you.`;
              message = [
                `[GitHub Event] ${what}`,
                '', `Issue body:\n${(issue.body || '').slice(0, 2000)}`,
                '', preamble(), '',
                isBug
                  ? `Assign yourself (gh issue edit ${issue.number} -R ${REPO} --add-assignee @me), create a branch (arthur/fix/${issue.number}-<short-desc>), write a failing regression test, fix it, run the test suite, and open a PR. If stuck after 20 min, comment the blocker and move on.`
                  : `Work on this issue following TDD. Create a branch, implement, test, and open a PR when ready.`,
                '', 'Update fiestaboard-state.json and fiestaboard-learnings.md when done.',
              ].join('\n');
              sessionKey = `hook:github:issue:${issue.number}`;
              model = 'ollama/qwen3-coder-next:cloud';
              timeout = 900;
            }

            // --- Issue assigned ---
            else if (event === 'issues' && action === 'assigned') {
              const issue = payload.issue || {};
              const assignee = payload.assignee?.login || issue.assignee?.login;
              if (assignee !== ARTHUR) { core.info('Not assigned to Arthur'); return; }
              await acknowledge();
              message = [
                `[GitHub Event] Issue #${issue.number} "${issue.title}" was just assigned to you.`,
                '', `Issue body:\n${(issue.body || '').slice(0, 2000)}`,
                '', preamble(), '',
                'Pick this up. Create a branch, implement with TDD, and open a PR when ready.',
                'Update fiestaboard-state.json when done.',
              ].join('\n');
              sessionKey = `hook:github:issue:${issue.number}`;
              model = 'ollama/qwen3-coder-next:cloud';
              timeout = 900;
            }

            // --- @mention in comment ---
            else if (event === 'issue_comment' && action === 'created') {
              const comment = payload.comment || {};
              const body = comment.body || '';
              if (!body.toLowerCase().includes(`@${ARTHUR.toLowerCase()}`)) {
                core.info('Arthur not mentioned'); return;
              }
              await acknowledge();
              const issue = payload.issue || {};
              const isPR = !!issue.pull_request;
              const kind = isPR ? 'PR' : 'issue';
              message = [
                `[GitHub Event] You were @mentioned in ${kind} #${issue.number} "${issue.title}".`,
                '', `By: ${comment.user?.login}`,
                `Comment:\n${body.slice(0, 2000)}`,
                '', preamble(), '',
                `Read the full context (gh ${isPR ? 'pr' : 'issue'} view ${issue.number} -R ${REPO} --comments) and respond appropriately.`,
                'If action is needed, take it. If it is a question, answer it.',
                'Update fiestaboard-state.json when done.',
              ].join('\n');
              sessionKey = `hook:github:mention:${issue.number}:${comment.id}`;
            }

            // --- PR review submitted ---
            else if (event === 'pull_request_review' && action === 'submitted') {
              const pr = payload.pull_request || {};
              const review = payload.review || {};
              const reviewer = review.user?.login;
              if (pr.user?.login !== ARTHUR) { core.info('Not Arthur PR'); return; }
              if (reviewer === ARTHUR) { core.info('Self-review'); return; }
              await acknowledge();
              const state = (review.state || '').toUpperCase();
              if (state === 'APPROVED') {
                message = [
                  `[GitHub Event] PR #${pr.number} "${pr.title}" was APPROVED by ${reviewer}.`,
                  '', preamble(), '',
                  `Check CI (gh pr checks ${pr.number} -R ${REPO}). If passing, merge (gh pr merge ${pr.number} -R ${REPO} --merge). If failing, fix first.`,
                  'Update fiestaboard-state.json when done.',
                ].join('\n');
                sessionKey = `hook:github:pr-approved:${pr.number}`;
                timeout = 180;
              } else {
                message = [
                  `[GitHub Event] ${reviewer} left a ${state.toLowerCase()} review on your PR #${pr.number} "${pr.title}".`,
                  '', `Review body:\n${(review.body || '(no body)').slice(0, 2000)}`,
                  '', preamble(), '',
                  `Read the full review: gh pr view ${pr.number} -R ${REPO} --comments.`,
                  'Address the feedback. Push fixes to your branch, then respond to the review comments.',
                  state === 'CHANGES_REQUESTED' ? 'This is a changes-requested review — address all points before re-requesting review.' : '',
                  'Update fiestaboard-state.json when done.',
                ].join('\n');
                sessionKey = `hook:github:pr-review:${pr.number}:${review.id}`;
                model = 'ollama/qwen3-coder-next:cloud';
                timeout = 600;
              }
            }

            // --- PR inline review comment ---
            else if (event === 'pull_request_review_comment' && action === 'created') {
              const pr = payload.pull_request || {};
              const comment = payload.comment || {};
              if (pr.user?.login !== ARTHUR) { core.info('Not Arthur PR'); return; }
              if (comment.user?.login === ARTHUR) { core.info('Self-comment'); return; }
              await acknowledge();
              message = [
                `[GitHub Event] ${comment.user?.login} left an inline review comment on your PR #${pr.number} "${pr.title}".`,
                '', `File: ${comment.path || 'unknown'}, line ${comment.line || '?'}`,
                `Comment:\n${(comment.body || '').slice(0, 2000)}`,
                '', preamble(), '',
                'Read the full review thread and address this comment. Push a fix if needed, or reply explaining your reasoning.',
                'Update fiestaboard-state.json when done.',
              ].join('\n');
              sessionKey = `hook:github:pr-comment:${pr.number}:${comment.id}`;
              model = 'ollama/qwen3-coder-next:cloud';
              timeout = 600;
            }

            // --- Review requested ---
            else if (event === 'pull_request' && action === 'review_requested') {
              const pr = payload.pull_request || {};
              const requestedReviewer = payload.requested_reviewer?.login;
              if (requestedReviewer !== ARTHUR) { core.info('Review not for Arthur'); return; }
              await acknowledge();
              message = [
                `[GitHub Event] Review requested from you on PR #${pr.number} "${pr.title}" by ${pr.user?.login}.`,
                '', preamble(), '',
                'Review this PR:',
                `1. Read the diff: gh pr diff ${pr.number} -R ${REPO}`,
                `2. Check the PR description: gh pr view ${pr.number} -R ${REPO}`,
                '3. Look at changed files, test coverage, correctness, and whether changes match docs/conventions.',
                '4. Leave a thoughtful review — approve if it looks good, request changes if there are issues.',
                '5. Focus on substance (correctness, tests, edge cases), not style nitpicks.',
                'Update fiestaboard-state.json when done.',
              ].join('\n');
              sessionKey = `hook:github:review-req:${pr.number}`;
            }

            // --- CI failure ---
            else if (event === 'check_suite' && action === 'completed') {
              const suite = payload.check_suite || {};
              if (suite.conclusion !== 'failure') { core.info('Not a failure'); return; }
              const branch = suite.head_branch || '';
              if (!branch.startsWith('arthur/')) { core.info('Not Arthur branch'); return; }
              const sha = (suite.head_sha || '').slice(0, 8);
              message = [
                `[GitHub Event] CI failed on your branch "${branch}" (${sha}).`,
                '', preamble(), '',
                'Investigate the CI failure:',
                `1. git checkout ${branch} && git pull origin ${branch}`,
                '2. Check the failure details on GitHub or run the test suite locally.',
                '3. Identify and fix the issue.',
                '4. Run the tests locally to confirm the fix, then push.',
                'Update fiestaboard-state.json when done.',
              ].join('\n');
              sessionKey = `hook:github:ci-fail:${branch}:${sha}`;
              model = 'ollama/qwen3-coder-next:cloud';
              timeout = 600;
            }

            else {
              core.info(`Unhandled event: ${event}/${action}`);
              return;
            }

            if (!message) { core.info('No message generated'); return; }

            // Check active hours (PT)
            const now = new Date();
            const ptStr = now.toLocaleString('en-US', { timeZone: 'America/Los_Angeles' });
            const ptHour = new Date(ptStr).getHours();
            let wakeMode = 'now';
            if (ptHour < 9 || ptHour >= 21) {
              wakeMode = 'next-heartbeat';
              message = `[QUEUED — off-hours] ${message}`;
            }

            const hookPayload = {
              message,
              name: 'GitHub',
              sessionKey,
              wakeMode,
              deliver: true,
              channel: 'slack',
              model,
              timeoutSeconds: timeout,
            };

            core.info(`Sending ${event}/${action} to Arthur (session: ${sessionKey}, wake: ${wakeMode})`);

            const response = await fetch(`${hooksUrl}/hooks/agent`, {
              method: 'POST',
              headers: {
                'Authorization': `Bearer ${hooksToken}`,
                'Content-Type': 'application/json',
              },
              body: JSON.stringify(hookPayload),
              signal: AbortSignal.timeout(10000),
            });

            if (!response.ok) {
              const text = await response.text();
              core.warning(`Hook delivery failed: ${response.status} ${text}`);
            } else {
              const result = await response.json();
              core.info(`Hook delivered: ${JSON.stringify(result)}`);
            }
