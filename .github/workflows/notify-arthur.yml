name: Notify Arthur

on:
  issues:
    types: [opened, assigned, labeled]
  issue_comment:
    types: [created]
  pull_request:
    types: [review_requested]
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created]
  check_suite:
    types: [completed]

jobs:
  notify:
    runs-on: ubuntu-latest
    # Don't notify on bot-authored events (avoid self-loops)
    if: github.actor != 'arthurandersonbot' || github.event_name == 'pull_request_review' || github.event_name == 'pull_request_review_comment'
    steps:
      - name: Forward event to Arthur
        env:
          HOOKS_URL: ${{ secrets.OPENCLAW_HOOKS_URL }}
          HOOKS_TOKEN: ${{ secrets.OPENCLAW_HOOKS_TOKEN }}
          GH_EVENT: ${{ github.event_name }}
          EVENT_JSON: ${{ toJSON(github.event) }}
        run: |
          if [ -z "$HOOKS_URL" ] || [ -z "$HOOKS_TOKEN" ]; then
            echo "Hooks not configured, skipping"
            exit 0
          fi

          # Write event payload to file to avoid bash parsing issues
          echo "$EVENT_JSON" > /tmp/event.json
          jq --arg evt "$GH_EVENT" '. + {_ghEvent: $evt}' /tmp/event.json > /tmp/payload.json

          curl -sf -X POST "${HOOKS_URL}/hooks/github" \
            -H "Authorization: Bearer ${HOOKS_TOKEN}" \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Event: ${GH_EVENT}" \
            -d @/tmp/payload.json \
            --max-time 10 \
            || echo "Hook delivery failed (non-fatal)"
