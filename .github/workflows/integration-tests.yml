name: Integration Tests

# Full integration suite runs on merge queue to gate changes before they land on main.
# A smoke subset also runs on PRs to catch critical breakage early.
# If integration tests fail in the merge queue, the PR is automatically removed.
on:
  merge_group:
  pull_request:
    branches: [ '**' ]
    paths:
      - 'src/**'
      - 'web/**'
      - 'Dockerfile'
      - 'docker-compose*.yml'
      - 'requirements*.txt'
      - '.github/workflows/integration-tests.yml'

permissions:
  contents: read

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration-tests:
    name: Integration Tests (${{ github.event_name == 'pull_request' && 'smoke' || 'full' }})
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build production image (same as prod for E2E)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: fiestaboard:integration
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Install UI dependencies
        working-directory: web
        run: |
          rm -rf node_modules package-lock.json
          npm install

      - name: Install Playwright browsers
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Start mock Vestaboard API
        run: |
          python integration-tests/mock-board/server.py &
          sleep 2
          echo "Mock board started on port 7000"

      - name: Start FiestaBoard container (unified app, same as prod)
        run: |
          docker run -d --name fiestaboard-integration \
            --add-host=host.docker.internal:host-gateway \
            -p 4420:3000 \
            -e BOARD_API_MODE=local \
            -e BOARD_HOST=host.docker.internal \
            -e BOARD_LOCAL_API_KEY=test_key \
            -e PRODUCTION=false \
            fiestaboard:integration
          echo "Waiting for app on port 4420..."
          for i in $(seq 1 30); do
            if curl -s -o /dev/null -w "%{http_code}" http://localhost:4420/api/health | grep -q 200; then
              echo "App ready"
              break
            fi
            sleep 1
          done

      # On PRs: run only the core integration smoke suite (integration.spec.ts).
      # This covers health checks, the setup wizard, navigation, basic page &
      # schedule management — the flows most likely to break on any PR.
      # On merge queue: run the full integration suite as the final gate.
      - name: Run integration tests (smoke subset on PRs)
        if: github.event_name == 'pull_request'
        working-directory: web
        run: npx playwright test integration.spec.ts --reporter=github
        env:
          CI: true

      - name: Run integration tests (full suite on merge queue)
        if: github.event_name == 'merge_group'
        working-directory: web
        run: npx playwright test --reporter=github
        env:
          CI: true

      - name: Stop FiestaBoard container
        if: always()
        run: docker rm -f fiestaboard-integration 2>/dev/null || true

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: integration-results-${{ github.event_name }}
          path: web/test-results/
          retention-days: 14
