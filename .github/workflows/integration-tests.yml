name: Integration Tests

# Run ONLY on merge queue to gate changes before they land on main.
# If integration tests fail, the merge queue automatically removes the
# failing PR so it never reaches the target branch.
on:
  merge_group:

permissions:
  contents: read

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration-tests:
    name: Integration Tests (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # --- Python (backend + mock board) ---
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # --- Node.js (UI + Playwright) ---
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install UI dependencies
        working-directory: web
        run: |
          # Fix npm bug with optional dependencies (https://github.com/npm/cli/issues/4828)
          rm -rf node_modules package-lock.json
          npm install

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}

      - name: Install Playwright browsers
        working-directory: web
        run: npx playwright install chromium --with-deps

      # --- Prepare clean data directory ---
      - name: Prepare integration data directory
        run: |
          rm -rf /tmp/fiestaboard-integration-data
          mkdir -p /tmp/fiestaboard-integration-data
          rm -f data/config.json data/settings.json data/pages.json data/schedules.json

      # --- Run tests ---
      - name: Run integration tests (shard ${{ matrix.shard }}/3)
        working-directory: web
        run: npx playwright test --shard=${{ matrix.shard }}/3 --reporter=github
        env:
          CI: true
          FIESTA_API_URL: http://localhost:8000

      # --- Upload artefacts on failure ---
      - name: Upload test results
        uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: playwright-results-shard-${{ matrix.shard }}
          path: web/test-results/
          retention-days: 14

  integration-report:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: integration-tests
    if: always()
    steps:
      - name: Check shard results
        run: |
          if [ "${{ needs.integration-tests.result }}" != "success" ]; then
            echo "Integration test shards failed or were cancelled"
            exit 1
          fi
          echo "All integration test shards passed"
