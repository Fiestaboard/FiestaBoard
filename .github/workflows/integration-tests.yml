name: 'CI: Integration Tests'

# Full integration suite runs on merge queue to gate changes before they land on main.
# A smoke subset also runs on PRs to catch critical breakage early.
# If integration tests fail in the merge queue, the PR is automatically removed.
on:
  merge_group:
  pull_request:
    branches: [ '**' ]
    paths:
      - 'src/**'
      - 'web/**'
      - 'Dockerfile'
      - 'docker-compose*.yml'
      - 'requirements*.txt'
      - '.github/workflows/integration-tests.yml'

permissions:
  contents: read

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration-tests:
    name: Integration Tests (${{ github.event_name == 'pull_request' && 'smoke' || 'full' }})
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        continue-on-error: true
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build production image (same as prod for E2E)
        uses: docker/build-push-action@v7
        timeout-minutes: 10
        with:
          context: .
          file: ./Dockerfile
          # Pin the production stage — a target-less build takes whatever
          # stage is last in the Dockerfile (issue #1377).
          target: runtime
          push: false
          load: true
          tags: fiestaboard:integration
          # Share scopes with ci.yml's e2e jobs so PR builds hit cache
          # populated by the most recent release as well as any other
          # in-flight PR build of the same image.
          cache-from: |
            type=gha,scope=build-linux/amd64
            type=gha,scope=build-test
          cache-to: type=gha,mode=max,scope=build-test

      # mock-board/server.py uses only the Python stdlib (http.server,
      # urllib, json, threading), so no pip install is needed on the
      # runner. ubuntu-latest ships with python3 pre-installed.

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: 'npm'
          # package-lock.json is regenerated on the first build after
          # the Next.js → RR7 migration; fall back to package.json
          # for cache keying until the regenerated lockfile is
          # committed in a follow-up.
          cache-dependency-path: web/package.json

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/package.json', 'web/package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install UI dependencies
        working-directory: web
        timeout-minutes: 5
        run: |
          if [ -f package-lock.json ]; then
            npm ci --legacy-peer-deps --no-audit
          else
            npm install --legacy-peer-deps --no-audit
          fi

      - name: Install Playwright browsers
        working-directory: web
        timeout-minutes: 5
        run: npx playwright install --with-deps chromium

      # ── PR: single container for smoke subset ─────────────────────
      # On PRs we only run integration.spec.ts — a single file whose tests
      # execute sequentially — so one backend is sufficient.
      - name: Start mock Vestaboard API (smoke)
        if: github.event_name == 'pull_request'
        run: |
          # python3 is pre-installed on ubuntu-latest; the script is stdlib-only.
          python3 integration-tests/mock-board/server.py &
          sleep 2
          echo "Mock board started on port 7000"

      - name: Start mock Vestaboard Cloud API (smoke)
        if: github.event_name == 'pull_request'
        env:
          PORT: 9200
          ROWS: 6
          COLS: 30
        run: |
          # mock-cloud/server.py is stdlib-only too — no pip install needed.
          python3 integration-tests/mock-cloud/server.py &
          sleep 2
          echo "Mock Cloud API started on port 9200"

      - name: Start FiestaBoard container (smoke)
        if: github.event_name == 'pull_request'
        run: |
          docker run -d --name fiestaboard-integration \
            --add-host=host.docker.internal:host-gateway \
            -p 4420:3000 \
            -e BOARD_API_MODE=local \
            -e BOARD_HOST=host.docker.internal \
            -e BOARD_LOCAL_API_KEY=test_key \
            -e PRODUCTION=false \
            -e FIESTABOARD_AUTH_ENABLED=false \
            fiestaboard:integration
          echo "Waiting for app on port 4420..."
          for i in $(seq 1 30); do
            if curl -s -o /dev/null -w "%{http_code}" http://localhost:4420/api/health | grep -q 200; then
              echo "App ready"
              break
            fi
            sleep 1
          done

      # On PRs: run only the core integration smoke suite (integration.spec.ts).
      # This covers health checks, the setup wizard, navigation, basic page &
      # schedule management — the flows most likely to break on any PR.
      - name: Run integration tests (smoke subset on PRs)
        if: github.event_name == 'pull_request'
        working-directory: web
        timeout-minutes: 8
        run: npx playwright test integration.spec.ts --reporter=github
        env:
          CI: true
          MOCK_BOARD_PORT: 7000
          # MOCK_BOARD_HOST is the host the FiestaBoard *container* uses to reach the
          # mock server running on the GitHub Actions runner host. From inside Docker,
          # the host is reachable at host.docker.internal, not localhost.
          MOCK_BOARD_HOST: host.docker.internal
          # MOCK_CLOUD_URL is reachable from the runner host (Playwright) at
          # localhost; the mock Cloud API listens on the runner, not in Docker.
          MOCK_CLOUD_URL: http://localhost:9200/

      # ── Merge queue: 4 isolated containers for full suite ─────────
      # The full suite uses workers=4 (playwright.config.ts). Without per-worker
      # backend isolation, all workers share a single backend and race conditions
      # cause spurious failures. We start 4 FiestaBoard + 4 mock-board containers
      # and pass WORKER_URLS so each Playwright worker gets its own isolated backend.
      - name: Start 4 mock board + mock cloud + FiestaBoard containers (full suite)
        if: github.event_name == 'merge_group'
        run: |
          WORKER_COUNT=4
          WORKER_URLS=""
          WORKER_MOCK_URLS=""
          WORKER_MOCK_HOSTS=""
          MOCK_CLOUD_URLS=""

          for i in $(seq 0 $((WORKER_COUNT - 1))); do
            # PORTS=7000,7001 — two Local-API listeners so multi-board output
            # tests (multi-board-output.spec.ts) can address a second board.
            docker run -d --name mock-board-$i \
              -v ${{ github.workspace }}/integration-tests/mock-board:/app:ro \
              -w /app \
              -e PORTS=7000,7001 \
              python:3.11-slim python server.py

            # Note-array Cloud API mock (stdlib-only); one per worker for isolation.
            docker run -d --name mock-cloud-$i \
              -e PORT=9200 -e ROWS=6 -e COLS=30 \
              -v ${{ github.workspace }}/integration-tests/mock-cloud:/app:ro \
              -w /app \
              python:3.11-slim python server.py

            # The backend must know the cloud mock's address at startup so
            # note-array boards actually send to it.
            CLOUD_IP=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' mock-cloud-$i)
            docker run -d --name fiestaboard-int-$i \
              -e PRODUCTION=false \
              -e FIESTABOARD_AUTH_ENABLED=false \
              -e VESTABOARD_CLOUD_API_URL=http://$CLOUD_IP:9200/ \
              fiestaboard:integration
          done

          for i in $(seq 0 $((WORKER_COUNT - 1))); do
            FB_IP=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' fiestaboard-int-$i)
            MOCK_IP=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' mock-board-$i)
            CLOUD_IP=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' mock-cloud-$i)

            [ -n "$WORKER_URLS" ] && WORKER_URLS="$WORKER_URLS,"
            [ -n "$WORKER_MOCK_URLS" ] && WORKER_MOCK_URLS="$WORKER_MOCK_URLS,"
            [ -n "$WORKER_MOCK_HOSTS" ] && WORKER_MOCK_HOSTS="$WORKER_MOCK_HOSTS,"
            [ -n "$MOCK_CLOUD_URLS" ] && MOCK_CLOUD_URLS="$MOCK_CLOUD_URLS,"

            WORKER_URLS="${WORKER_URLS}http://$FB_IP:3000"
            WORKER_MOCK_URLS="${WORKER_MOCK_URLS}http://$MOCK_IP:7000"
            WORKER_MOCK_HOSTS="${WORKER_MOCK_HOSTS}$MOCK_IP"
            MOCK_CLOUD_URLS="${MOCK_CLOUD_URLS}http://$CLOUD_IP:9200"

            echo "Worker $i: FiestaBoard=$FB_IP, MockBoard=$MOCK_IP, MockCloud=$CLOUD_IP"
          done

          echo "WORKER_URLS=$WORKER_URLS" >> $GITHUB_ENV
          echo "WORKER_MOCK_URLS=$WORKER_MOCK_URLS" >> $GITHUB_ENV
          echo "WORKER_MOCK_HOSTS=$WORKER_MOCK_HOSTS" >> $GITHUB_ENV
          echo "MOCK_CLOUD_URLS=$MOCK_CLOUD_URLS" >> $GITHUB_ENV

      - name: Wait for all containers to be ready (full suite)
        if: github.event_name == 'merge_group'
        timeout-minutes: 3
        run: |
          IFS=',' read -ra URLS <<< "$WORKER_URLS"
          for url in "${URLS[@]}"; do
            echo "Waiting for $url..."
            for i in $(seq 1 60); do
              STATUS=$(curl -s -m 5 -o /dev/null -w "%{http_code}" "$url/api/health" 2>/dev/null || echo "000")
              if [ "$STATUS" = "200" ]; then
                echo "  Ready (attempt $i)"
                break
              fi
              if [ "$i" = "60" ]; then
                echo "  ❌ Failed to become ready"
                exit 1
              fi
              sleep 1
            done
          done

      # On merge queue: run the full integration suite as the final gate.
      - name: Run integration tests (full suite on merge queue)
        if: github.event_name == 'merge_group'
        working-directory: web
        timeout-minutes: 12
        run: npx playwright test --reporter=github
        env:
          CI: true
          WORKER_URLS: ${{ env.WORKER_URLS }}
          WORKER_MOCK_URLS: ${{ env.WORKER_MOCK_URLS }}
          WORKER_MOCK_HOSTS: ${{ env.WORKER_MOCK_HOSTS }}
          MOCK_CLOUD_URLS: ${{ env.MOCK_CLOUD_URLS }}

      - name: Stop containers
        if: always()
        run: |
          docker rm -f fiestaboard-integration 2>/dev/null || true
          for i in 0 1 2 3; do
            docker rm -f fiestaboard-int-$i mock-board-$i mock-cloud-$i 2>/dev/null || true
          done

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: integration-results-${{ github.event_name }}
          path: web/test-results/
          retention-days: 14
