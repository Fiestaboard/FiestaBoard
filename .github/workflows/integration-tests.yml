name: Integration Tests

# Run ONLY on merge queue to gate changes before they land on main.
# If integration tests fail, the merge queue automatically removes the
# failing PR so it never reaches the target branch.
on:
  merge_group:

permissions:
  contents: read

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # Cache Docker image by content hash + build environment (test vs prod).
      # - Cache key includes 'test' prefix to separate from production builds
      # - Both e2e and integration workflows share this cache (same key, same VERSION=dev)
      # - Production builds (release.yml) use different VERSION arg, so they get separate caches
      - name: Cache Docker image
        id: docker-cache
        uses: actions/cache@v4
        with:
          path: /tmp/docker-image.tar.gz
          key: docker-image-test-${{ hashFiles('Dockerfile', 'requirements.txt', 'src/**', 'web/**', 'plugins/**', 'tests/**', 'nginx.conf', 'supervisord.conf', 'supervisord-dev.conf', 'entrypoint.sh') }}

      - name: Load cached Docker image
        if: steps.docker-cache.outputs.cache-hit == 'true'
        run: |
          docker load -i /tmp/docker-image.tar.gz
          docker tag fiestaboard:cached fiestaboard:integration
          echo "✅ Loaded cached Docker image (skipped rebuild)"

      - name: Set up Docker Buildx
        if: steps.docker-cache.outputs.cache-hit != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build test image
        if: steps.docker-cache.outputs.cache-hit != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: fiestaboard:integration
          build-args: |
            VERSION=dev
          cache-from: type=gha,scope=build-test
          cache-to: type=gha,mode=max,scope=build-test

      - name: Save Docker image for caching
        if: steps.docker-cache.outputs.cache-hit != 'true'
        run: |
          docker tag fiestaboard:integration fiestaboard:cached
          docker save fiestaboard:cached | gzip > /tmp/docker-image.tar.gz

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install UI dependencies
        working-directory: web
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}

      - name: Install Playwright browsers
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Start mock Vestaboard API
        run: |
          python integration-tests/mock-board/server.py &
          sleep 2
          echo "Mock board started on port 7000"

      - name: Start FiestaBoard container (unified app, same as prod)
        run: |
          docker run -d --name fiestaboard-integration \
            --add-host=host.docker.internal:host-gateway \
            -p 4420:3000 \
            -e BOARD_API_MODE=local \
            -e BOARD_HOST=host.docker.internal \
            -e BOARD_LOCAL_API_KEY=test_key \
            -e PRODUCTION=false \
            fiestaboard:integration
          echo "Waiting for app on port 4420..."
          for i in $(seq 1 30); do
            if curl -s -o /dev/null -w "%{http_code}" http://localhost:4420/api/health | grep -q 200; then
              echo "App ready"
              break
            fi
            sleep 1
          done

      - name: Run integration tests
        working-directory: web
        run: npx playwright test --reporter=github
        env:
          CI: true

      - name: Stop FiestaBoard container
        if: always()
        run: docker rm -f fiestaboard-integration 2>/dev/null || true

      - name: Upload test results
        uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: integration-results
          path: web/test-results/
          retention-days: 14
