name: Integration Tests

# Run ONLY on merge queue to gate changes before they land on main.
# If integration tests fail, the merge queue automatically removes the
# failing PR so it never reaches the target branch.
on:
  merge_group:

permissions:
  contents: read

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration-setup:
    name: Integration Setup
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production image (same as prod for E2E)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: fiestaboard:integration
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Save Docker image
        run: docker save fiestaboard:integration | gzip > /tmp/fiestaboard-integration.tar.gz

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Install UI dependencies
        working-directory: web
        run: |
          rm -rf node_modules package-lock.json
          npm install

      - name: Install Playwright browsers
        working-directory: web
        run: npx playwright install chromium

      - name: Archive dependencies and image
        run: |
          tar -czf /tmp/integration-node-modules.tar.gz -C web node_modules
          tar -czf /tmp/integration-playwright.tar.gz -C ~/.cache ms-playwright

      - name: Upload dependencies
        uses: actions/upload-artifact@v6
        with:
          name: integration-deps
          path: |
            /tmp/integration-node-modules.tar.gz
            /tmp/integration-playwright.tar.gz
            /tmp/fiestaboard-integration.tar.gz
          retention-days: 1

  integration-tests:
    name: Integration Tests (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    needs: integration-setup
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Download dependencies
        uses: actions/download-artifact@v4
        with:
          name: integration-deps
          path: /tmp/integration-deps

      - name: Extract dependencies
        run: |
          tar -xzf /tmp/integration-deps/integration-node-modules.tar.gz -C web
          tar -xzf /tmp/integration-deps/integration-playwright.tar.gz -C ~/.cache
          docker load < /tmp/integration-deps/fiestaboard-integration.tar.gz

      - name: Install Playwright system dependencies
        working-directory: web
        run: npx playwright install-deps chromium

      - name: Start mock Vestaboard API
        run: |
          python integration-tests/mock-board/server.py &
          sleep 2
          echo "Mock board started on port 7000"

      - name: Start FiestaBoard container (unified app, same as prod)
        run: |
          docker run -d --name fiestaboard-integration \
            --add-host=host.docker.internal:host-gateway \
            -p 3000:3000 \
            -e BOARD_API_MODE=local \
            -e BOARD_HOST=host.docker.internal \
            -e BOARD_LOCAL_API_KEY=test_key \
            -e PRODUCTION=false \
            fiestaboard:integration
          echo "Waiting for app on port 3000..."
          for i in $(seq 1 30); do
            if curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/api/health | grep -q 200; then
              echo "App ready"
              break
            fi
            sleep 1
          done

      - name: Run integration tests (shard ${{ matrix.shard }}/3)
        working-directory: web
        run: npx playwright test --shard=${{ matrix.shard }}/3 --reporter=github
        env:
          CI: true

      - name: Stop FiestaBoard container
        if: always()
        run: docker rm -f fiestaboard-integration 2>/dev/null || true

      - name: Upload test results
        uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: integration-results-shard-${{ matrix.shard }}
          path: web/test-results/
          retention-days: 14

  integration-report:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: integration-tests
    if: always()
    steps:
      - name: Check shard results
        run: |
          if [ "${{ needs.integration-tests.result }}" != "success" ]; then
            echo "Integration test shards failed or were cancelled"
            exit 1
          fi
          echo "All integration test shards passed"
