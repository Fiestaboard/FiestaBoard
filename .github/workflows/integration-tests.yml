name: Integration Tests

# Run on merge queue to gate changes before they land on main.
# Also runs on pull requests targeting main/develop for visibility.
on:
  merge_group:
  pull_request:
    branches: [main, develop]
    paths:
      - 'src/**'
      - 'web/**'
      - 'plugins/**'
      - 'integration-tests/**'
      - 'requirements.txt'
      - '.github/workflows/integration-tests.yml'

permissions:
  contents: read

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # --- Python (backend + mock board) ---
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # --- Node.js (UI + Playwright) ---
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install UI dependencies
        working-directory: web
        run: |
          # Fix npm bug with optional dependencies (https://github.com/npm/cli/issues/4828)
          rm -rf node_modules package-lock.json
          npm install

      - name: Install Playwright browsers
        working-directory: web
        run: npx playwright install chromium --with-deps

      # --- Prepare clean data directory ---
      - name: Prepare integration data directory
        run: |
          rm -rf /tmp/fiestaboard-integration-data
          mkdir -p /tmp/fiestaboard-integration-data
          rm -f data/config.json data/settings.json data/pages.json data/schedules.json

      # --- Run tests ---
      - name: Run integration tests
        working-directory: web
        run: npx playwright test --reporter=github
        env:
          CI: true
          FIESTA_API_URL: http://localhost:8000

      # --- Upload artefacts on failure ---
      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 14
