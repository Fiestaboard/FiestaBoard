name: Team PR area labels

on:
  workflow_call:

permissions:
  pull-requests: write
  contents: read

jobs:
  label:
    if: github.event_name == 'pull_request_target' && github.repository_owner == 'Fiestaboard'
    runs-on: >-
      ${{ vars.FIESTABOARD_MAC_PR_RUNNER == 'true'
          && github.event.pull_request.head.repo.full_name == github.repository
          && contains(fromJSON('["OWNER","MEMBER"]'), github.event.pull_request.author_association)
          && fromJSON('["self-hosted","linux","ARM64","mac-ubuntu"]')
          || 'ubuntu-latest' }}
    steps:
      # Versions come from changesets (docs/internal/development/RELEASING.md),
      # so this applies area labels only. It used to add major/minor/patch from
      # the PR title, which release.yml read to pick the bump.
      - name: Auto-label PR based on changed files
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prNumber = context.payload.pull_request.number;
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
              per_page: 100
            });

            const areaLabels = new Set();
            for (const file of files) {
              const p = file.filename;
              if (p.startsWith('plugins/')) areaLabels.add('plugin');
              else if (p.startsWith('web/')) areaLabels.add('frontend');
              else if (p.startsWith('src/')) areaLabels.add('backend');
              else if (p.startsWith('docs/')) areaLabels.add('docs');
              if (p === 'requirements.txt' || p === 'package-lock.json' || p === 'web/package-lock.json') areaLabels.add('dependencies');
            }

            if (areaLabels.size > 0) {
              const labels = [...areaLabels];
              console.log(`Adding area labels: ${labels.join(', ')}`);
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                labels
              });
              console.log(`✅ PR area-labeled with: ${labels.join(', ')}`);
            }

