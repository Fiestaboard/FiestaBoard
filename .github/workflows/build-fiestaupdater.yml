name: 'Build: FiestaUpdater'

# =============================================================================
# Builds the `fiestaupdater` sidecar image (multi-arch) and pushes to Docker
# Hub. Triggers when files under fiestaupdater/ change on main, or on demand.
# =============================================================================

on:
  push:
    branches:
      - main
    paths:
      - 'fiestaupdater/**'
      - '.github/workflows/build-fiestaupdater.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to push (default: latest)'
        required: false
        default: 'latest'

concurrency:
  group: build-fiestaupdater
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build & push fiestaupdater (multi-arch)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Determine tag
        id: tag
        run: |
          TAG="${{ github.event.inputs.tag }}"
          [ -z "$TAG" ] && TAG="latest"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Build & push
        uses: docker/build-push-action@v7
        with:
          context: ./fiestaupdater
          file: ./fiestaupdater/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            fiestaboard/fiestaupdater:${{ steps.tag.outputs.tag }}
            fiestaboard/fiestaupdater:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify multi-arch manifest
        run: |
          docker buildx imagetools inspect \
            "fiestaboard/fiestaupdater:${{ steps.tag.outputs.tag }}"

  test:
    name: Test fiestaupdater handler
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install bats
        run: sudo apt-get update && sudo apt-get install -y bats

      - name: Run handler tests
        run: bats fiestaupdater/tests/
