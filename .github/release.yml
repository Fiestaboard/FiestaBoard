# Categories for GitHub's generated release notes. The release workflow builds
# its notes from CHANGELOG.md (written by Changesets), so this only shapes the
# "Generate release notes" button in the GitHub UI.
changelog:
  exclude:
    labels:
      - ignore-for-release
    authors:
      - github-actions[bot]
  categories:
    - title: Plugin Updates 🔌
      labels:
        - plugin
    - title: Frontend Improvements 🎨
      labels:
        - frontend
    - title: Backend Improvements ⚙️
      labels:
        - backend
    - title: Documentation 📖
      labels:
        - docs
    - title: Dependencies 📦
      labels:
        - dependencies
    - title: Other Changes
      labels:
        - "*"
