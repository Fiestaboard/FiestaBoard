name: 'Setup Python deps'
description: >-
  Install Python 3.11 with pip caching and the project's runtime + dev
  dependencies (requirements.txt + requirements-dev.txt). Used by the
  test-platform and test-plugins jobs so we have one source of truth
  for the Python environment.

inputs:
  python-version:
    description: 'Python version to install'
    required: false
    default: '3.11'

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.python-version }}
        cache: 'pip'
        cache-dependency-path: |
          requirements.txt
          requirements-dev.txt

    - name: Install dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
