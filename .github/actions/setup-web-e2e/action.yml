name: 'Setup web E2E'
description: >-
  Install npm deps and Playwright browsers for the web E2E jobs, with
  npm + Playwright browser caching and parallel install. Use in any job
  that runs Playwright against the FiestaBoard backend.

inputs:
  node-version:
    description: 'Node.js version to install'
    required: false
    default: '20'

runs:
  using: 'composite'
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.node-version }}
        cache: 'npm'
        # package-lock.json is regenerated on the first CI build after the
        # Next.js → RR7 migration; fall back to package.json for cache
        # keying until the regenerated lockfile is committed.
        cache-dependency-path: web/package.json
        # @fiestaboard/ui lives on GitHub Packages; auth via NODE_AUTH_TOKEN.
        registry-url: 'https://npm.pkg.github.com'
        scope: '@fiestaboard'

    - name: Cache Playwright browsers
      uses: actions/cache@v5
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('web/package.json', 'web/package-lock.json') }}
        restore-keys: |
          playwright-${{ runner.os }}-

    - name: Install deps (parallel npm + Playwright)
      shell: bash
      env:
        # Composite actions can't read the `secrets` context; github.token is
        # the same GITHUB_TOKEN (calling job needs `packages: read`) and
        # authorizes the @fiestaboard scope on npm.pkg.github.com.
        NODE_AUTH_TOKEN: ${{ github.token }}
      run: |
        # `npm ci` once a fresh lockfile is committed post-migration;
        # `npm install` covers the gap when it isn't. Runs in the
        # background while we install Playwright's system deps; both
        # are I/O-bound so overlapping them saves ~30s.
        (cd web && \
         if [ -f package-lock.json ]; then \
           npm ci --legacy-peer-deps --no-audit; \
         else \
           npm install --legacy-peer-deps --no-audit; \
         fi && \
         echo "✅ npm install complete") &
        NPM_PID=$!

        cd web
        npx playwright install-deps chromium > /dev/null
        echo "✅ Playwright system deps installed"

        wait $NPM_PID || { echo "❌ npm ci failed"; exit 1; }

        # No-op when the Playwright browser cache hit.
        npx playwright install chromium
        echo "✅ Playwright browsers installed"
