name: 'Setup web E2E'
description: >-
  Install npm deps and Playwright browsers for the web E2E jobs, with
  npm + Playwright browser caching and locked dependencies. Use in any job
  that runs Playwright against the FiestaBoard backend.

inputs:
  node-version:
    description: 'Node.js version to install'
    required: false
    default: '24'

runs:
  using: 'composite'
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.node-version }}
        cache: 'npm'
        cache-dependency-path: web/package-lock.json

    - name: Cache Playwright browsers
      uses: actions/cache@v5
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('web/package.json', 'web/package-lock.json') }}
        restore-keys: |
          playwright-${{ runner.os }}-

    - name: Install locked UI dependencies
      shell: bash
      working-directory: web
      run: npm ci --legacy-peer-deps --no-audit

    - name: Install locked Playwright browsers and system dependencies
      shell: bash
      working-directory: web
      # npm must finish first: concurrent npx can download a different CLI
      # before the locked Playwright package exists in node_modules.
      run: npx --no-install playwright install --with-deps chromium
