# nginx config for the HA Ingress simulation sidecar.
# See ../docker-compose.dev-ingress.yml for context.
server {
    listen 80;
    server_name _;

    # The HA-Supervisor-style prefix. Anything else (e.g. /, /api/...
    # when hit directly) bypasses the simulation and goes through.
    location /api/hassio_ingress/test-token/ {
        # Strip the prefix before forwarding upstream — HA Supervisor
        # does this in its real Ingress flow. The upstream receives
        # plain paths like `/pages/edit/abc`.
        rewrite ^/api/hassio_ingress/test-token/(.*)$ /$1 break;

        # Forward to the dev container on its internal port.
        # fiestaboard-dev publishes nginx on container port 3000
        # (host port 4420), but inside the docker network we hit 3000.
        proxy_pass http://fiestaboard:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The signal HA Ingress passes upstream. This is the value the
        # upstream nginx inserts into <base href>.
        proxy_set_header X-Ingress-Path /api/hassio_ingress/test-token;

        # WebSocket / SSE support (AI chat streaming, Vite HMR in dev).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;
    }

    # Fallback: anything not under the ingress prefix returns 404 so
    # we don't accidentally validate a bypass route.
    location / {
        return 404 "HA Ingress simulator: hit /api/hassio_ingress/test-token/ instead\n";
    }
}
