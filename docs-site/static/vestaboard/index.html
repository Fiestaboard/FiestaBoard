<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Redirecting — FiestaBoard</title>
  <!-- Fallback redirect for users with JavaScript disabled -->
  <meta http-equiv="refresh" content="2; url=/buyavestaboard" />
  <link rel="canonical" href="https://fiestaboard.app/buyavestaboard" />

  <!-- Google Analytics (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-5D2S6D6PNC"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-5D2S6D6PNC', {
      page_path: '/vestaboard',
      transport_type: 'beacon'
    });
    var redirectTimeout = setTimeout(function() {
      window.location.href = '/buyavestaboard';
    }, 1000);
    gtag('event', 'referral_redirect', {
      event_category: 'referral',
      event_label: 'vestaboard',
      transport_type: 'beacon',
      event_callback: function() {
        clearTimeout(redirectTimeout);
        window.location.href = '/buyavestaboard';
      }
    });
  </script>
</head>
<body>
  <p>Redirecting to <a href="/buyavestaboard">Buy a Vestaboard</a>&hellip;</p>
</body>
</html>
