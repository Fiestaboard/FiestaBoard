[supervisord]
nodaemon=true
logfile=/app/data/logs/supervisord.log
logfile_maxbytes=5MB
logfile_backups=1
pidfile=/app/supervisord.pid

[program:api]
command=python -m uvicorn src.api_server:app --host 127.0.0.1 --port 8000
directory=/app
priority=10
autostart=true
autorestart=true
startsecs=5
startretries=10
stdout_logfile=/app/data/logs/api.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/app/data/logs/api-error.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3

# The Node.js UI process is gone post-RR7-migration: nginx serves the
# Vite-built static files directly from /app/web/build/client/. Two
# programs in production (api + nginx) instead of three.

[program:nginx]
command=nginx -g "daemon off;"
priority=20
autostart=true
autorestart=true
startsecs=2
startretries=10
stdout_logfile=/app/data/logs/nginx.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/app/data/logs/nginx-error.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3

[include]
files = /app/conf.d/*.conf
