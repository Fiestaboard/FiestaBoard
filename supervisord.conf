[supervisord]
nodaemon=true
logfile=/app/data/logs/supervisord.log
logfile_maxbytes=5MB
logfile_backups=1
pidfile=/app/supervisord.pid

[program:api]
command=python -m uvicorn src.api_server:app --host 127.0.0.1 --port 8000
directory=/app
autostart=true
autorestart=true
startsecs=5
startretries=10
stdout_logfile=/app/data/logs/api.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/app/data/logs/api-error.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3

[program:nextjs]
command=node server.js
directory=/app/web
environment=PORT="3001",HOSTNAME="127.0.0.1"
autostart=true
autorestart=true
startsecs=3
startretries=10
stdout_logfile=/app/data/logs/nextjs.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/app/data/logs/nextjs-error.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
startsecs=2
startretries=10
stdout_logfile=/app/data/logs/nginx.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/app/data/logs/nginx-error.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3

[program:glances]
command=/app/start-glances.sh
autostart=true
autorestart=false
startsecs=0
stdout_logfile=/app/data/logs/glances.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=1
stderr_logfile=/app/data/logs/glances-error.log
stderr_logfile_maxbytes=5MB
stderr_logfile_backups=1
