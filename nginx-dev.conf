# Development nginx configuration.
#
# In dev mode, the Vite/React-Router dev server runs on 127.0.0.1:3001
# with HMR. nginx proxies `/` traffic there (instead of serving static
# files like production does) so file changes hot-reload without a
# rebuild. The Vite dev server's `base: "./"` setting still emits
# relative asset URLs, so the `<base href>` injection works the same
# way as in production.
pid /var/lib/nginx/nginx.pid;
events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Temp paths for appuser
    client_body_temp_path /var/lib/nginx/body 1 2;
    proxy_temp_path /var/lib/nginx/tmp;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss
               application/rss+xml font/truetype font/opentype
               application/vnd.ms-fontobject image/svg+xml;

    server {
        listen 3000;
        listen [::]:3000;
        http2 on;
        server_name _;

        # Security headers (rendered by entrypoint.sh)
        include /etc/nginx/fiestaboard/*.conf;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # Intercept CONNECTION-LEVEL upstream errors (502 refused / 504 timeout) so we
        # can serve the "please wait" page instead of a raw gateway error while the
        # API is still starting. 503 is deliberately NOT intercepted: the API uses it
        # for real conditions ("board unreachable", "client not initialized") whose
        # JSON detail must reach the UI — intercepting it masked every app-level
        # error as "starting up" forever.
        proxy_intercept_errors on;
        error_page 502 504 /starting.html;

        location = /starting.html {
            root /app/static;
            internal;
        }

        # MCP — same precedence rule as production.
        location /api/mcp {
            error_page 502 504 = @api_starting;
            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_send_timeout 30s;
            proxy_read_timeout 60s;
        }

        location /api/ {
            error_page 502 504 = @api_starting;
            rewrite ^/api(.*)$ $1 break;
            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_send_timeout 30s;
            proxy_read_timeout 60s;
        }

        location @api_starting {
            default_type application/json;
            charset utf-8;
            return 503 '{"detail":"Service is starting up, please try again shortly"}';
        }

        # Kill-switch service worker.
        #
        # Vite-PWA is configured with devOptions.enabled = false, so the dev
        # Vite server never emits a sw.js. But any service worker installed
        # from a prior production-style visit on this origin (someone ran the
        # built UI against localhost:4420, or ran a different container that
        # served sw.js) survives in the browser forever. Origin = host:port,
        # not the container running behind it.
        #
        # That stale SW intercepts every dev navigation. Its workbox
        # NetworkFirst handler has a 10s network timeout, which the cold
        # macOS-bind-mount Vite dep-pre-bundle blows through, so the SW
        # falls back to its 7-day-old cached index.html. That HTML
        # references /assets/<old-hash>.js chunks the dev Vite server
        # doesn't have → white screen until a hard refresh.
        #
        # Without this override the SW also can't self-update: it fetches
        # /sw.js, the proxy below returns RR7's 404 HTML (Content-Type:
        # text/html), and the browser rejects that as a SW update. The
        # stale SW lives forever.
        #
        # This block serves a tiny valid SW that, on activate,
        # unregisters itself, wipes every cache, and reloads every page
        # it controls. The browser triggers a SW update check on every
        # SW-intercepted navigation, so the next time a poisoned tab
        # loads dev, the kill-switch is fetched, installed, activated,
        # and self-destructs. After that the tab is SW-free for as long
        # as it points at the dev server.
        location = /sw.js {
            default_type application/javascript;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            return 200 "self.addEventListener('install',()=>self.skipWaiting());self.addEventListener('activate',e=>e.waitUntil((async()=>{try{await self.registration.unregister()}catch(_){};try{const k=await caches.keys();await Promise.all(k.map(n=>caches.delete(n)))}catch(_){};try{const c=await self.clients.matchAll({type:'window'});c.forEach(x=>x.navigate(x.url))}catch(_){}})()));";
        }

        # Dev: everything else → Vite dev server (HMR over WebSocket).
        # Generous timeouts: Vite pre-bundles dependencies on demand the
        # first time each one is imported, and on macOS the bind-mounted
        # filesystem makes that slow. A cold first load with the full RR7
        # + i18next + Radix + TanStack Query dep graph can take >60s to
        # settle, and during that window the browser sees 504s as nginx
        # cuts off pending /node_modules/.vite/deps/* requests. After
        # the first warm-up these timeouts are never hit.
        location / {
            proxy_pass http://127.0.0.1:3001;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_connect_timeout 10s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
            # Never cache dev assets. Vite re-optimizes deps on demand and
            # stamps every dep chunk URL with a fresh ?v=<hash>. If the
            # browser caches index.html, it keeps pulling stale chunk
            # hashes that Vite already invalidated → instant 504s and a
            # white screen until a hard-refresh. no-store kills that path.
            add_header Cache-Control "no-store" always;
            include /etc/nginx/fiestaboard/location-root/*.conf;
        }
    }
}
