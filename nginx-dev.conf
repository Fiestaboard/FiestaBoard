# Development nginx configuration.
#
# In dev mode, the Vite/React-Router dev server runs on 127.0.0.1:3001
# with HMR. nginx proxies `/` traffic there (instead of serving static
# files like production does) so file changes hot-reload without a
# rebuild. The Vite dev server's `base: "./"` setting still emits
# relative asset URLs, so the `<base href>` injection works the same
# way as in production.
pid /var/lib/nginx/nginx.pid;
events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Temp paths for appuser
    client_body_temp_path /var/lib/nginx/body 1 2;
    proxy_temp_path /var/lib/nginx/tmp;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss
               application/rss+xml font/truetype font/opentype
               application/vnd.ms-fontobject image/svg+xml;

    server {
        listen 3000;
        listen [::]:3000;
        http2 on;
        server_name _;

        # Security headers (rendered by entrypoint.sh)
        include /etc/nginx/fiestaboard/*.conf;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # Intercept upstream errors so we can serve the "please wait" page instead of
        # a raw 502 Bad Gateway while the API or UI are still starting up.
        proxy_intercept_errors on;
        error_page 502 503 504 /starting.html;

        location = /starting.html {
            root /app/static;
            internal;
        }

        # MCP — same precedence rule as production.
        location /api/mcp {
            error_page 502 503 504 = @api_starting;
            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_send_timeout 30s;
            proxy_read_timeout 60s;
        }

        location /api/ {
            error_page 502 503 504 = @api_starting;
            rewrite ^/api(.*)$ $1 break;
            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_send_timeout 30s;
            proxy_read_timeout 60s;
        }

        location @api_starting {
            default_type application/json;
            charset utf-8;
            return 503 '{"detail":"Service is starting up, please try again shortly"}';
        }

        # Dev: everything else → Vite dev server (HMR over WebSocket).
        # Generous timeouts: Vite pre-bundles dependencies on demand the
        # first time each one is imported, and on macOS the bind-mounted
        # filesystem makes that slow. A cold first load with the full RR7
        # + i18next + Radix + TanStack Query dep graph can take >60s to
        # settle, and during that window the browser sees 504s as nginx
        # cuts off pending /node_modules/.vite/deps/* requests. After
        # the first warm-up these timeouts are never hit.
        location / {
            proxy_pass http://127.0.0.1:3001;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_connect_timeout 10s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
            include /etc/nginx/fiestaboard/location-root/*.conf;
        }
    }
}
