<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="600" fill="#000000"/>
  
  <!-- FiestaBoard Display Border -->
  <rect x="50" y="50" width="700" height="500" fill="#000000" stroke="#333333" stroke-width="2"/>
  
  <!-- Title -->
  <text x="400" y="120" font-family="monospace" font-size="36" fill="#00FF00" text-anchor="middle" font-weight="bold">
    NEXT LAUNCH
  </text>
  
  <!-- Mission Name -->
  <text x="400" y="200" font-family="monospace" font-size="32" fill="#00FF00" text-anchor="middle">
    CREW-12
  </text>
  
  <!-- Countdown Label -->
  <text x="400" y="260" font-family="monospace" font-size="24" fill="#888888" text-anchor="middle">
    T-
  </text>
  
  <!-- Countdown Time -->
  <text x="400" y="320" font-family="monospace" font-size="48" fill="#00FF00" text-anchor="middle" font-weight="bold">
    2d 05:30:15
  </text>
  
  <!-- Rocket Name -->
  <text x="400" y="380" font-family="monospace" font-size="24" fill="#00FF00" text-anchor="middle">
    Falcon 9 Block 5
  </text>
  
  <!-- Pad Info -->
  <text x="400" y="430" font-family="monospace" font-size="18" fill="#888888" text-anchor="middle">
    PAD: Space Launch Complex 40
  </text>
  
  <!-- Status -->
  <text x="400" y="470" font-family="monospace" font-size="18" fill="#888888" text-anchor="middle">
    STATUS: Go for Launch
  </text>
  
  <!-- Provider -->
  <text x="400" y="510" font-family="monospace" font-size="18" fill="#888888" text-anchor="middle">
    SpaceX
  </text>
</svg>
