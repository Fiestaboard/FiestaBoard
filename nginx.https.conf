# HTTPS-enabled nginx configuration (Beta).
#
# This file is functionally identical to nginx.conf, with one change: the
# external listener (port 3000 inside the container) terminates TLS using
# a self-signed certificate generated at container startup by
# entrypoint.sh / src/system/https_certs.py. It is selected by the
# entrypoint when the user has enabled the "HTTPS (Beta)" setting.
#
# Cert files are mounted from /app/data/certs/ so they persist across
# container rebuilds via the existing ./data bind mount. Each FiestaBoard
# instance generates and owns its own keypair.
pid /var/lib/nginx/nginx.pid;
events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Temp paths for appuser
    client_body_temp_path /var/lib/nginx/body 1 2;
    proxy_temp_path /var/lib/nginx/tmp;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss
               application/rss+xml font/truetype font/opentype
               application/vnd.ms-fontobject image/svg+xml;

    server {
        listen 3000 ssl;
        listen [::]:3000 ssl;
        http2 on;
        server_name _;

        # Self-signed cert generated per-instance by the entrypoint.
        ssl_certificate     /app/data/certs/fiestaboard.crt;
        ssl_certificate_key /app/data/certs/fiestaboard.key;

        # Modern TLS settings. We only need TLS 1.2+ since this is a
        # local-network app and modern browsers all support it.
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:5m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # Security headers
        # See nginx.conf for the rationale; the snippet is rendered by
        # entrypoint.sh and defaults to `X-Frame-Options: SAMEORIGIN`.
        include /etc/nginx/fiestaboard/*.conf;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # Intercept upstream errors so we can serve the "please wait" page instead of
        # a raw 502 Bad Gateway while the API or UI are still starting up.
        proxy_intercept_errors on;
        error_page 502 503 504 /starting.html;

        location = /starting.html {
            root /app/static;
            internal;
        }

        # MCP traffic must NOT have the /api prefix stripped: the FastAPI
        # app is configured with root_path="/api", and Starlette's Mount
        # only computes the sub-app's root_path correctly when the request
        # path still includes the /api prefix. Stripping it (as the general
        # /api/ rule below does) makes Starlette compute root_path="/api/mcp"
        # while scope.path stays "/mcp/", which causes every request to the
        # MCP sub-app to 404. Must be declared BEFORE `location /api/` so
        # nginx's longest-prefix match picks it up first.
        location /api/mcp {
            error_page 502 503 504 = @api_starting;
            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_send_timeout 30s;
            proxy_read_timeout 60s;
        }

        # All API traffic under /api/* → FastAPI backend (path stripped: /api/pages → /pages)
        location /api/ {
            # Return JSON while the API is starting instead of the HTML "please wait" page.
            error_page 502 503 504 = @api_starting;
            rewrite ^/api(.*)$ $1 break;
            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_send_timeout 30s;
            proxy_read_timeout 60s;
        }

        location @api_starting {
            default_type application/json;
            charset utf-8;
            return 503 '{"detail":"Service is starting up, please try again shortly"}';
        }

        # Everything else → Next.js (UI)
        location / {
            proxy_pass http://127.0.0.1:3001;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;

            # See nginx.conf for the rationale. Reverse-proxy base-path
            # support rendered by entrypoint.sh when
            # FIESTABOARD_INGRESS_PATH_REWRITE=true.
            include /etc/nginx/fiestaboard/location-root/*.conf;
        }

        # Cache static assets aggressively
        location /_next/static {
            proxy_pass http://127.0.0.1:3001;
            proxy_http_version 1.1;
            proxy_cache_valid 200 60m;
            expires 1y;
            add_header Cache-Control "public, immutable";

            # See nginx.conf; CSS at /_next/static/css/* needs the same
            # Ingress prefix rewriting as HTML.
            include /etc/nginx/fiestaboard/location-root/*.conf;
        }

        # Cache images
        location ~* \.(jpg|jpeg|png|gif|ico|svg|webp)$ {
            proxy_pass http://127.0.0.1:3001;
            proxy_http_version 1.1;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # Cache fonts
        location ~* \.(woff|woff2|ttf|otf|eot)$ {
            proxy_pass http://127.0.0.1:3001;
            proxy_http_version 1.1;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
}
