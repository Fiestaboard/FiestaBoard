# Grafana + Prometheus monitoring stack for FiestaBoard (production overlay)
#
# In development: Grafana + Prometheus are included in docker-compose.dev.yml
# by default. You do NOT need this file for development.
#
# For production, add this as a compose overlay:
#   docker compose -f docker-compose.yml -f docker-compose.monitoring.yml up -d
#
# You also need to set LOCAL_MONITORING=true in your .env file (or as an
# environment variable) to show the "Monitor" nav link in the FiestaBoard UI.
#
# Access Grafana at http://localhost:3030 (admin / admin)
# A pre-built "FiestaBoard System" dashboard is auto-provisioned.

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: fiestaboard-prometheus
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
      - "--storage.tsdb.retention.size=256MB"
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  grafana:
    image: grafana/grafana-oss:latest
    container_name: fiestaboard-grafana
    ports:
      - "3030:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/fiestaboard-system.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # Set LOCAL_MONITORING=true so the Monitor nav link appears
  fiestaboard:
    environment:
      - LOCAL_MONITORING=true

volumes:
  prometheus-data:
  grafana-data:
