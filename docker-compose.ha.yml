# Optional Home Assistant + Mosquitto for local dev.
# Use with docker-compose.dev.yml so all services share the fiestaboard-dev network.
#
# Start: docker-compose -f docker-compose.dev.yml -f docker-compose.ha.yml up -d
# HA UI: http://localhost:8123  (from host)
# From inside containers: http://homeassistant:8123, mqtt://mosquitto:1883
# See docs-site/docs/setup/local-home-assistant.md

services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: homeassistant
    restart: unless-stopped
    ports:
      - "8123:8123"
    volumes:
      - homeassistant-config:/config
    networks:
      - fiestaboard-dev
    depends_on:
      - mosquitto

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    networks:
      - fiestaboard-dev

networks:
  fiestaboard-dev:
    driver: bridge

volumes:
  homeassistant-config:
  mosquitto-data:
  mosquitto-log:
