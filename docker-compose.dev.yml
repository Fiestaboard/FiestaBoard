services:
  # FiestaBoard - Single container (API + UI), same as production layout
  fiestaboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fiestaboard-dev
    env_file:
      - .env
    restart: unless-stopped
    ports:
      - "4420:3000"
    environment:
      - PRODUCTION=false
      - WATCHPACK_POLLING=true
      - LOCAL_MONITORING=true
    volumes:
      - ./data:/app/data
      - ./src:/app/src
      - ./plugins:/app/plugins
      - ./tests:/app/tests
      - ./scripts:/app/scripts
      - ./web:/app/web
      - web-dev-node-modules:/app/web/node_modules
      - ./start-dev.sh:/app/start-dev.sh:ro
      - ./supervisord-dev.conf:/app/supervisord-dev.conf:ro
      - ./nginx-dev.conf:/etc/nginx/nginx.conf:ro
    command: ["/bin/sh", "/app/start-dev.sh"]
    networks:
      - fiestaboard-dev
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Grafana + Prometheus monitoring (enabled by default in dev)
  prometheus:
    image: prom/prometheus:latest
    container_name: fiestaboard-prometheus
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
      - "--storage.tsdb.retention.size=256MB"
    networks:
      - fiestaboard-dev
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  grafana:
    image: grafana/grafana-oss:latest
    container_name: fiestaboard-grafana
    ports:
      - "3030:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/fiestaboard-system.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - fiestaboard-dev
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # Web - Used only for running npm test: docker-compose run --rm web npm test
  web:
    image: node:20-alpine
    container_name: fiestaboard-web-test
    working_dir: /app
    volumes:
      - ./web:/app
      - fiestaboard-web-node-modules:/app/node_modules
    environment:
      - CI=true
    networks:
      - fiestaboard-dev
    profiles:
      - test

  # Mock Vestaboard API - for integration/E2E testing only
  fiestaboard-mock-board:
    image: python:3.11-alpine
    container_name: fiestaboard-mock-board
    volumes:
      - ./integration-tests/mock-board/server.py:/server.py:ro
    ports:
      - "7000:7000"
    command: python /server.py
    networks:
      - fiestaboard-dev
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Storybook - Component development and testing
  fiestaboard-storybook:
    image: node:20-alpine
    container_name: fiestaboard-storybook
    working_dir: /app
    volumes:
      - ./web:/app
      - fiestaboard-storybook-node-modules:/app/node_modules
    ports:
      - "6006:6006"
    environment:
      - WATCHPACK_POLLING=true
    command: sh -c "rm -f package-lock.json && npm install --force && npm run storybook -- --host 0.0.0.0"
    networks:
      - fiestaboard-dev
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  fiestaboard-dev:
    driver: bridge

volumes:
  web-dev-node-modules:
  fiestaboard-web-node-modules:
  fiestaboard-storybook-node-modules:
  prometheus-data:
  grafana-data:
