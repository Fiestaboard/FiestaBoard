services:
  # FiestaBoard - Single container (API + UI), same as production layout
  fiestaboard:
    build:
      context: .
      dockerfile: Dockerfile
      # Dev mode needs Node at runtime so `npx react-router dev` can
      # boot Vite. Production targets the default `runtime` stage which
      # omits Node entirely (see Dockerfile for the prod/dev split).
      target: runtime-dev
    container_name: fiestaboard-dev
    env_file:
      - .env
    restart: unless-stopped
    ports:
      - "4420:3000"
    environment:
      - PRODUCTION=false
      - WATCHPACK_POLLING=true
      # Default a fresh dev install to talk to the bundled mock
      # Vestaboard instead of leaving the host blank (which strands
      # Active Display on a permanent spinner). These BOARD_* vars
      # only apply when no value is already set in data/config.json,
      # so anyone with an existing config keeps their real board.
      - BOARD_API_MODE=local
      - BOARD_HOST=fiestaboard-mock-board
      - BOARD_LOCAL_API_KEY=mock-dev-key
      # Point note-array (Cloud API) boards at the bundled mock so they can be
      # registered & exercised by hand in dev — its live board UI is at
      # http://localhost:19200/ui. Unset this to talk to the real Vestaboard Cloud.
      - VESTABOARD_CLOUD_API_URL=http://fiestaboard-mock-cloud:9200/
    volumes:
      - ./data:/app/data
      - ./src:/app/src
      - ./plugins:/app/plugins
      - ./external_plugins:/app/external_plugins
      - ./plugin-registry.json:/app/plugin-registry.json:ro
      - ./staff-picks:/app/staff-picks:ro
      - ./tests:/app/tests
      - ./scripts:/app/scripts
      - ./web:/app/web
      - web-dev-node-modules:/app/web/node_modules
      - ./start-dev.sh:/app/start-dev.sh:ro
      - ./supervisord-dev.conf:/app/supervisord-dev.conf:ro
      - ./nginx-dev.conf:/app/nginx.http.conf:ro
    command: ["/bin/sh", "/app/start-dev.sh"]
    networks:
      - fiestaboard-dev
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Web - Used only for running npm test: docker-compose run --rm web npm test
  web:
    image: node:20-alpine
    container_name: fiestaboard-web-test
    working_dir: /app
    volumes:
      - ./web:/app
      - fiestaboard-web-node-modules:/app/node_modules
    environment:
      - CI=true
    networks:
      - fiestaboard-dev
    profiles:
      - test

  # Mock Vestaboard API - for integration/E2E testing only
  fiestaboard-mock-board:
    image: python:3.11-alpine
    container_name: fiestaboard-mock-board
    volumes:
      - ./integration-tests/mock-board/server.py:/server.py:ro
    # Host ports avoid macOS AirPlay / Control Center (often binds :7000).
    # Inside the container the mock still listens on 7000/7001 (Vestaboard Local API).
    ports:
      - "17000:7000"
      - "17001:7001"
    environment:
      - PORTS=7000,7001
    command: python /server.py
    networks:
      - fiestaboard-dev
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Mock Vestaboard Cloud API (cloud.vestaboard.com) - for note-array integration tests
  fiestaboard-mock-cloud:
    image: python:3.11-alpine
    container_name: fiestaboard-mock-cloud
    volumes:
      - ./integration-tests/mock-cloud/server.py:/server.py:ro
    # Host port avoids collisions with the Local API mock (17000/17001).
    # Inside the container the mock listens on 9200 (Vestaboard Cloud API).
    ports:
      - "19200:9200"
    environment:
      - PORT=9200
      - ROWS=6
      - COLS=30
    command: python /server.py
    networks:
      - fiestaboard-dev
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Storybook - Component development and testing (opt-in via profile)
  fiestaboard-storybook:
    image: node:20-alpine
    container_name: fiestaboard-storybook
    working_dir: /app
    volumes:
      - ./web:/app
      - fiestaboard-storybook-node-modules:/app/node_modules
    ports:
      - "6006:6006"
    environment:
      - WATCHPACK_POLLING=true
    command: sh -c "rm -f package-lock.json && npm install --force && npm run storybook -- --host 0.0.0.0"
    networks:
      - fiestaboard-dev
    profiles:
      - storybook
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  fiestaboard-dev:
    driver: bridge

volumes:
  web-dev-node-modules:
  fiestaboard-web-node-modules:
  fiestaboard-storybook-node-modules:
