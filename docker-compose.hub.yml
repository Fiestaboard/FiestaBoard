services:
  # FiestaBoard - Unified container with API + Web UI
  fiestaboard:
    image: fiestaboard/fiestaboard:latest
    container_name: fiestaboard
    env_file:
      - .env
    environment:
      - PRODUCTION=true
    restart: unless-stopped
    pull_policy: always
    ports:
      - "4420:3000"
    volumes:
      # Persist data (including config) to local filesystem.
      #
      # IMPORTANT: this is a RELATIVE bind mount. Docker resolves `./data`
      # against the directory you run `docker compose` from, not against the
      # location of this file. Always run `docker compose pull`, `up`, `down`,
      # etc. from the same folder you originally started FiestaBoard in -
      # otherwise your settings will look like they have reset (your data is
      # not deleted, it just lives in the original folder).
      # See: https://fiestaboard.app/docs/troubleshooting#settings-or-board-credentials-are-gone-after-an-update
      - ./data:/app/data
      # Persist marketplace-installed (external) plugins across rebuilds
      - ./external_plugins:/app/external_plugins
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ---------------------------------------------------------------------------
  # FiestaUpdater - sidecar that performs in-place updates of `fiestaboard`.
  # Off by default. Enable by setting COMPOSE_PROFILES=fiestaupdater in `.env`.
  # The sidecar is NOT exposed to the host - it is reachable only from the
  # compose-internal network and is authenticated with a shared bearer token.
  # ---------------------------------------------------------------------------
  fiestaupdater:
    image: fiestaboard/fiestaupdater:latest
    container_name: fiestaupdater
    profiles: ["fiestaupdater"]
    restart: unless-stopped
    pull_policy: always
    environment:
      - FIESTAUPDATER_TOKEN=${FIESTAUPDATER_TOKEN}
      - FIESTAUPDATER_SERVICE=fiestaboard
      - FIESTAUPDATER_COMPOSE_FILE=/compose/docker-compose.yml
      - COMPOSE_PROJECT_NAME=fiestaboard
    cap_add:
      - SYS_BOOT
    volumes:
      # Talk to the host Docker daemon to pull images and recreate services.
      - /var/run/docker.sock:/var/run/docker.sock
      # Read the same compose file the user deployed with so we update the
      # exact same service definition.
      - ./docker-compose.hub.yml:/compose/docker-compose.yml:ro
      # The compose file references `env_file: .env` for the fiestaboard
      # service.  When the sidecar runs `docker compose -f /compose/...`,
      # Compose resolves `.env` relative to the compose file's directory.
      # Without this mount, every pull/up/restart fails with
      # "env file /compose/.env not found" and the in-app updater silently
      # no-ops.
      - ./.env:/compose/.env:ro
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8765/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
