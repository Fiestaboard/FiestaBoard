services:
  # FiestaBoard - Unified container with API + Web UI
  fiestaboard:
    image: fiestaboard/fiestaboard:latest
    container_name: fiestaboard
    env_file:
      - .env
    environment:
      - PRODUCTION=true
    restart: unless-stopped
    pull_policy: always
    ports:
      - "4420:3000"
    volumes:
      # Persist data (including config) to local filesystem
      - ./data:/app/data
      # Persist marketplace-installed (external) plugins across rebuilds
      - ./external_plugins:/app/external_plugins
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
