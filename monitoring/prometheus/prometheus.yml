# Prometheus configuration for FiestaBoard monitoring
# Scrapes metrics from the FiestaBoard API server
#
# When used with docker-compose.monitoring.yml as an overlay, Prometheus
# can reach the FiestaBoard container via the shared Docker network.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "fiestaboard"
    metrics_path: "/api/metrics"
    static_configs:
      - targets: ["fiestaboard:3000"]
        labels:
          instance: "fiestaboard"
