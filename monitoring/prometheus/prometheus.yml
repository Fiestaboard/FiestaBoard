# Prometheus configuration for FiestaBoard monitoring
# Scrapes metrics from the co-located FastAPI server on localhost.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "fiestaboard"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["127.0.0.1:8000"]
        labels:
          instance: "fiestaboard"
