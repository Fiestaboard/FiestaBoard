# Loki configuration for in-container log aggregation.
# Single-instance mode with local filesystem storage.
# Designed to run alongside Prometheus and Grafana inside the
# FiestaBoard container when LOCAL_MONITORING=true.

auth_enabled: false

server:
  http_listen_port: 3101
  grpc_listen_port: 0          # disable gRPC – not needed in single-node mode
  log_level: warn

common:
  path_prefix: /app/data/loki
  storage:
    filesystem:
      chunks_directory: /app/data/loki/chunks
      rules_directory: /app/data/loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: "2024-01-01"
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  reject_old_samples: true
  reject_old_samples_max_age: 168h   # 7 days
  ingestion_rate_mb: 4
  ingestion_burst_size_mb: 8
  max_query_series: 500

compactor:
  working_directory: /app/data/loki/compactor
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 2h
  delete_request_store: filesystem

# Keep 7 days of log data (matches Prometheus retention)
table_manager:
  retention_deletes_enabled: true
  retention_period: 168h
