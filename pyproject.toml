[build-system]
requires = ["setuptools>=78.1.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fiestaboard"
dynamic = ["version"]
description = "FiestaBoard Display Service - Home hub for your split-flap display"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "FiestaBoard Contributors"}
]
keywords = ["fiestaboard", "vestaboard", "display", "home-automation", "api", "split-flap"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

# Dependencies from requirements.txt
dependencies = [
    "requests>=2.32.0",
    "python-dateutil>=2.9.0",
    "pytz>=2024.2",
    "fastapi>=0.125.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.0",
    "docker>=7.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
    "coverage>=7.6.0",
    "black>=24.10.0",
    "ruff>=0.9.0",
]

[project.urls]
Homepage = "https://github.com/Fiestaboard/FiestaBoard"
Documentation = "https://fiestaboard.app"
Repository = "https://github.com/Fiestaboard/FiestaBoard"
Issues = "https://github.com/Fiestaboard/FiestaBoard/issues"

[tool.setuptools.dynamic]
version = {attr = "src.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "plugins*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests", "plugins"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--verbose",
    "--strict-markers",
    "--tb=short",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
]

[tool.coverage.run]
source = ["src", "plugins"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/_template/*",
    "*/conftest.py",
    # Untestable without hardware/network (documented in GitHub issues #58-61)
    "src/utils/*",         # Requires external APIs (weather, stocks, transit, HA)
    "src/main.py",         # Application entrypoint
    "src/plugins/testing.py",  # Test infrastructure
    # NOTE: src/formatters/*, src/text_to_board.py, and src/system/* are now
    # tested and have been removed from the omit list (issue #505).
]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "pass",
]

[tool.coverage.html]
directory = "coverage/html"

[tool.coverage.xml]
output = "coverage/coverage.xml"

[tool.ruff]
line-length = 120
target-version = "py311"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]  # Allow unused imports in __init__.py
"tests/**" = ["B008"]  # Allow function calls in argument defaults in tests
"plugins/**/tests/**" = ["B008"]  # Allow function calls in argument defaults in plugin tests

[tool.black]
line-length = 120
target-version = ["py311"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | node_modules
)/
'''
