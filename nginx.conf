# Production nginx configuration
# Unified reverse proxy: API + static SPA served through a single port.
#
# Post-migration to React Router v7 (SPA mode, `ssr: false`): the UI is a
# pile of static files under /app/web/build/client/. There is no Node
# process to proxy to; nginx serves the files directly with an HTML5
# history-fallback so client-side routes (e.g. /pages/edit/<id>) resolve
# to /index.html and let the SPA take over.
#
# HA Ingress is handled by the sub_filter snippet generated by
# entrypoint.sh::configure_ingress_path_rewrite (see snippet at
# /etc/nginx/fiestaboard/location-root/): it prepends the X-Ingress-Path
# prefix to the absolute URL literals in HTML/JS/CSS/JSON bodies and to
# the inlined React Router basename, which the SPA reads back at runtime
# to prefix its API calls (web/src/lib/base-path.ts).
pid /var/lib/nginx/nginx.pid;
events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Temp paths for appuser
    client_body_temp_path /var/lib/nginx/body 1 2;
    proxy_temp_path /var/lib/nginx/tmp;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss
               application/rss+xml font/truetype font/opentype
               application/vnd.ms-fontobject image/svg+xml;

    server {
        listen 3000;
        listen [::]:3000;
        http2 on;
        server_name _;

        # Security headers
        # X-Frame-Options / Content-Security-Policy frame-ancestors are rendered
        # into /etc/nginx/fiestaboard/frame-headers.conf by entrypoint.sh at boot
        # so they can be controlled by env (FIESTABOARD_X_FRAME_OPTIONS and
        # FIESTABOARD_FRAME_ANCESTORS). Default behavior matches the historical
        # `X-Frame-Options: SAMEORIGIN` so existing deployments are unchanged.
        include /etc/nginx/fiestaboard/*.conf;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # Intercept upstream errors so we can serve the "please wait" page instead of
        # a raw 502 Bad Gateway while the API is still starting up.
        proxy_intercept_errors on;
        error_page 502 503 504 /starting.html;

        location = /starting.html {
            root /app/static;
            internal;
        }

        # MCP traffic must NOT have the /api prefix stripped: the FastAPI
        # app is configured with root_path="/api", and Starlette's Mount
        # only computes the sub-app's root_path correctly when the request
        # path still includes the /api prefix. Stripping it (as the general
        # /api/ rule below does) makes Starlette compute root_path="/api/mcp"
        # while scope.path stays "/mcp/", which causes every request to the
        # MCP sub-app to 404. Must be declared BEFORE `location /api/` so
        # nginx's longest-prefix match picks it up first.
        location /api/mcp {
            error_page 502 503 504 = @api_starting;
            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_send_timeout 30s;
            proxy_read_timeout 60s;
        }

        # All API traffic under /api/* → FastAPI backend (path stripped: /api/pages → /pages)
        location /api/ {
            # Return JSON while the API is starting instead of the HTML "please wait" page.
            error_page 502 503 504 = @api_starting;
            rewrite ^/api(.*)$ $1 break;
            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_send_timeout 30s;
            proxy_read_timeout 60s;
        }

        location @api_starting {
            default_type application/json;
            charset utf-8;
            return 503 '{"detail":"Service is starting up, please try again shortly"}';
        }

        # SPA static assets (Vite-built). Long-cache the immutable hashed
        # bundles under /assets/, short-cache the service worker so
        # registration updates aren't sticky.
        location /assets/ {
            root /app/web/build/client;
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
            include /etc/nginx/fiestaboard/location-root/*.conf;
        }

        # sw.js / registerSW.js / manifest.json bodies contain absolute
        # "/assets/", "/sw.js", and "/icons/" references, so they need the
        # same base-path rewrite snippet as HTML/JS served from `/` —
        # without it the PWA manifest's icons and the service worker's
        # precache URLs 404 under HA Ingress.
        location = /sw.js {
            root /app/web/build/client;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            expires off;
            try_files $uri =404;
            include /etc/nginx/fiestaboard/location-root/*.conf;
        }
        location = /registerSW.js {
            root /app/web/build/client;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            expires off;
            try_files $uri =404;
            include /etc/nginx/fiestaboard/location-root/*.conf;
        }
        location = /manifest.json {
            root /app/web/build/client;
            add_header Cache-Control "public, max-age=3600";
            try_files $uri =404;
            include /etc/nginx/fiestaboard/location-root/*.conf;
        }

        # Self-hosted font files from @fontsource-variable/geist live under
        # /assets/ (Vite hashes them) — already covered above. Static image
        # extensions get a 30-day cache so favicons / brand images don't
        # bust on every release.
        location ~* \.(jpg|jpeg|png|gif|ico|svg|webp)$ {
            root /app/web/build/client;
            expires 30d;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # SPA history fallback. Anything that isn't an asset, isn't an API
        # call, and isn't a static file gets /index.html so client-side
        # routing can take over. The location-root sub_filter snippet
        # rewrites the HTML's absolute asset URLs and React Router
        # basename so everything resolves under reverse-proxy prefixes
        # (e.g. HA Ingress).
        #
        # index.html must revalidate on every request: it references the
        # current build's hashed /assets/*.js bundles, so a cached entry
        # point pins the user to a stale chunk graph and they miss the
        # new release until they hard-refresh. no-cache (not no-store)
        # still lets nginx return 304 Not Modified when the file is
        # unchanged, so the wire cost is just a conditional GET.
        location / {
            root /app/web/build/client;
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache, must-revalidate" always;
            include /etc/nginx/fiestaboard/location-root/*.conf;
        }
    }
}
