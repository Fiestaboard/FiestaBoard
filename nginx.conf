# Production nginx configuration
# Unified reverse proxy: API + UI through a single port
pid /var/lib/nginx/nginx.pid;
events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    # Temp paths for appuser
    client_body_temp_path /var/lib/nginx/body 1 2;
    proxy_temp_path /var/lib/nginx/tmp;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript 
               application/json application/javascript application/xml+rss 
               application/rss+xml font/truetype font/opentype 
               application/vnd.ms-fontobject image/svg+xml;

    server {
        listen 3000;
        listen [::]:3000;
        http2 on;
        server_name _;

        # Security headers
        # X-Frame-Options / Content-Security-Policy frame-ancestors are rendered
        # into /etc/nginx/fiestaboard/frame-headers.conf by entrypoint.sh at boot
        # so they can be controlled by env (FIESTABOARD_X_FRAME_OPTIONS and
        # FIESTABOARD_FRAME_ANCESTORS). Default behavior matches the historical
        # `X-Frame-Options: SAMEORIGIN` so existing deployments are unchanged.
        # Wildcard include silently no-ops if the snippet is missing.
        include /etc/nginx/fiestaboard/*.conf;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # Intercept upstream errors so we can serve the "please wait" page instead of
        # a raw 502 Bad Gateway while the API or UI are still starting up.
        proxy_intercept_errors on;
        error_page 502 503 504 /starting.html;

        location = /starting.html {
            root /app/static;
            internal;
        }

        # MCP traffic must NOT have the /api prefix stripped: the FastAPI
        # app is configured with root_path="/api", and Starlette's Mount
        # only computes the sub-app's root_path correctly when the request
        # path still includes the /api prefix. Stripping it (as the general
        # /api/ rule below does) makes Starlette compute root_path="/api/mcp"
        # while scope.path stays "/mcp/", which causes every request to the
        # MCP sub-app to 404. Must be declared BEFORE `location /api/` so
        # nginx's longest-prefix match picks it up first.
        location /api/mcp {
            error_page 502 503 504 = @api_starting;
            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_send_timeout 30s;
            proxy_read_timeout 60s;
        }

        # All API traffic under /api/* → FastAPI backend (path stripped: /api/pages → /pages)
        location /api/ {
            # Return JSON while the API is starting instead of the HTML "please wait" page.
            error_page 502 503 504 = @api_starting;
            rewrite ^/api(.*)$ $1 break;
            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_send_timeout 30s;
            proxy_read_timeout 60s;
        }

        location @api_starting {
            default_type application/json;
            charset utf-8;
            return 503 '{"detail":"Service is starting up, please try again shortly"}';
        }

        # Everything else → Next.js (UI)
        location / {
            proxy_pass http://127.0.0.1:3001;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;

            # Reverse-proxy base-path support (e.g. Home Assistant Ingress).
            #
            # When an upstream proxy sends `X-Ingress-Path` (HA Supervisor's
            # convention for the dynamically-assigned URL prefix), rewrite
            # absolute asset paths in HTML responses to include that prefix.
            # Without this, the browser sees `<script src="/_next/...">`,
            # fetches from the host's origin root, bypasses the proxy and
            # 404s -- visible as "Refused to execute ... nosniff" errors
            # because the 404 page is served as text/html.
            #
            # When the header is absent every `sub_filter` replacement
            # degenerates to a self-substitution, so direct (non-Ingress)
            # access is unaffected.
            #
            # Upstream gzip is disabled here because `sub_filter` cannot
            # rewrite compressed payloads; nginx's outer `gzip on` still
            # compresses the rewritten response before it leaves the box.
            proxy_set_header Accept-Encoding "";
            sub_filter_once off;
            sub_filter '"/_next/'  '"$http_x_ingress_path/_next/';
            sub_filter "'/_next/"  "'$http_x_ingress_path/_next/";
            sub_filter '"/api/'    '"$http_x_ingress_path/api/';
            sub_filter "'/api/"    "'$http_x_ingress_path/api/";
        }

        # Cache static assets aggressively
        location /_next/static {
            proxy_pass http://127.0.0.1:3001;
            proxy_http_version 1.1;
            proxy_cache_valid 200 60m;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Cache images
        location ~* \.(jpg|jpeg|png|gif|ico|svg|webp)$ {
            proxy_pass http://127.0.0.1:3001;
            proxy_http_version 1.1;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # Cache fonts
        location ~* \.(woff|woff2|ttf|otf|eot)$ {
            proxy_pass http://127.0.0.1:3001;
            proxy_http_version 1.1;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
}

