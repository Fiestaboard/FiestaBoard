# Production nginx configuration
# Unified reverse proxy: API + UI through a single port
pid /var/lib/nginx/nginx.pid;
events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    # Temp paths for appuser
    client_body_temp_path /var/lib/nginx/body 1 2;
    proxy_temp_path /var/lib/nginx/tmp;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript 
               application/json application/javascript application/xml+rss 
               application/rss+xml font/truetype font/opentype 
               application/vnd.ms-fontobject image/svg+xml;

    server {
        listen 3000;
        listen [::]:3000;
        http2 on;
        server_name _;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # Intercept upstream errors so we can serve the "please wait" page instead of
        # a raw 502 Bad Gateway while the API or UI are still starting up.
        proxy_intercept_errors on;
        error_page 502 503 504 /starting.html;

        location = /starting.html {
            root /app/static;
            internal;
        }

        # All API traffic under /api/* → FastAPI backend (path stripped: /api/pages → /pages)
        location /api/ {
            # Return JSON while the API is starting instead of the HTML "please wait" page.
            error_page 502 503 504 = @api_starting;
            rewrite ^/api(.*)$ $1 break;
            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_send_timeout 30s;
            proxy_read_timeout 60s;
        }

        location @api_starting {
            default_type application/json;
            charset utf-8;
            return 503 '{"detail":"Service is starting up, please try again shortly"}';
        }

        # Everything else → Next.js (UI)
        location / {
            proxy_pass http://127.0.0.1:3001;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        # Cache static assets aggressively
        location /_next/static {
            proxy_pass http://127.0.0.1:3001;
            proxy_http_version 1.1;
            proxy_cache_valid 200 60m;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Cache images
        location ~* \.(jpg|jpeg|png|gif|ico|svg|webp)$ {
            proxy_pass http://127.0.0.1:3001;
            proxy_http_version 1.1;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # Cache fonts
        location ~* \.(woff|woff2|ttf|otf|eot)$ {
            proxy_pass http://127.0.0.1:3001;
            proxy_http_version 1.1;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
}

